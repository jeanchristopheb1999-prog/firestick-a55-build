      # ================================================================
      # SEMANTIC TESTS
      # ================================================================

      - name: Verify V9 semantics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import random


          # ------------------------------------------------------------
          # PMULHRSW / VQRDMULH edge semantics
          # ------------------------------------------------------------

          def wrap16(x):
              x &= 0xffff
              return x - 0x10000 if x & 0x8000 else x


          def reference_mulhrs(a, b):
              return wrap16(
                  ((a * b) + 0x4000) >> 15
              )


          def v9_mulhrs(a, b):
              x = ((a * b) + 0x4000) >> 15

              if x > 32767:
                  x = 32767

              if x < -32768:
                  x = -32768

              if a == -32768 and b == -32768:
                  x = -32768

              return x


          tests = [
              (-32768, -32768),
              (-32768, 32767),
              (32767, 32767),
              (32767, -32768),
              (0, 0),
              (1, 1),
              (-1, -1),
              (12345, -23456),
              (-22222, 11111),
          ]


          for a, b in tests:
              assert (
                  reference_mulhrs(a, b) ==
                  v9_mulhrs(a, b)
              )


          # ------------------------------------------------------------
          # MIX2 XOR equivalence
          # ------------------------------------------------------------

          for _ in range(10000):
              a = [
                  random.getrandbits(32)
                  for _ in range(4)
              ]

              b = [
                  random.getrandbits(32)
                  for _ in range(4)
              ]


              mixlo = [
                  a[0],
                  b[0],
                  a[1],
                  b[1],
              ]


              mixhi = [
                  a[2],
                  b[2],
                  a[3],
                  b[3],
              ]


              original = [
                  mixlo[i] ^ mixhi[i]
                  for i in range(4)
              ]


              fused = [
                  a[0] ^ a[2],
                  b[0] ^ b[2],
                  a[1] ^ a[3],
                  b[1] ^ b[3],
              ]


              assert original == fused


          # ------------------------------------------------------------
          # Hoisted case14/case18 mask + pointer parity
          # ------------------------------------------------------------

          for rounds0 in range(8):
              original = []

              r = rounds0

              while True:
                  original.append(
                      (
                          r,
                          0x10000000 << r,
                          'pbuf' if r & 1 else 'buftmp',
                          'buftmp' if r & 1 else 'pbuf',
                      )
                  )

                  if r == 0:
                      break

                  r -= 1


              optimized = []

              r = rounds0

              mask = (
                  0x10000000 <<
                  r
              )

              first = (
                  'pbuf'
                  if r & 1
                  else 'buftmp'
              )

              second = (
                  'buftmp'
                  if r & 1
                  else 'pbuf'
              )


              while True:
                  optimized.append(
                      (
                          r,
                          mask,
                          first,
                          second,
                      )
                  )


                  mask >>= 1

                  first, second = (
                      second,
                      first,
                  )


                  if r == 0:
                      break

                  r -= 1


              assert original == optimized


          # fixrand max is exactly 511.
          assert 511 < 65536


          print(
              'V9 semantic tests PASSED'
          )
          PY


      # ================================================================
      # BUILD
      # ================================================================

      - name: Make Android build script executable
        run: |
          chmod +x \
            scripts/build-android-ccminer.sh


      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t ccminer-firestick-a55-v9 \
            -f build.Dockerfile \
            .


      - name: Build armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-output
          mkdir -p build-output

          docker run \
            --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v9 \
            arm


          echo "===== OUTPUT ====="

          find \
            build-output \
            -maxdepth 4 \
            -type f \
            -print


          echo "===== BUILD LOG ====="

          tail -n 300 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log


          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer


      # ================================================================
      # BINARY INSPECTION
      # ================================================================

      - name: Inspect V9 binary
        shell: bash
        run: |
          set -euo pipefail

          BIN="build-output/ccminer-armeabi-v7a/bin/ccminer"


          echo "===== FILE ====="

          file "$BIN"


          echo "===== BUILD ID ====="

          strings "$BIN" |
            grep "A55-CLHASH-V9"


          echo "===== 64-BIT DIVISION HELPER ====="

          readelf -Ws "$BIN" |
            grep "__aeabi_ldivmod" ||
            true


          echo "===== BINARY SIZE ====="

          ls -lh "$BIN"


      # ================================================================
      # PACKAGE
      # ================================================================

      - name: Prepare V9 package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist


          BIN="build-output/ccminer-armeabi-v7a/bin"


          cp \
            "$BIN/ccminer" \
            dist/ccminer-a55-clhash-v9


          if test -f "$BIN/libc++_shared.so"; then
            cp \
              "$BIN/libc++_shared.so" \
              dist/
          fi


          if test -f "$BIN/libomp.so"; then
            cp \
              "$BIN/libomp.so" \
              dist/
          fi


          chmod +x \
            dist/ccminer-a55-clhash-v9


          cat > dist/BUILDINFO.txt <<EOF
          Build:
          A55-CLHASH-V9

          Source:
          shmutalov/ccminer

          Commit:
          7f30d6bfb64d0f3ba010191c5a185016ba46f454

          ABI:
          armeabi-v7a / AArch32

          CPU:
          Cortex-A55

          Stable base:
          A55-HOTPATH-V8

          V8 measured baseline:
          approximately 679 kH/s

          Hardware AES:
          enabled

          Hardware PMULL:
          enabled

          VQRDMULH:
          enabled

          VTBL PSHUFB:
          enabled

          Partial Haraka:
          enabled

          Haraka hot AES count:
          34 instead of 40

          V9 direct Haraka register input:
          enabled

          Hot intermediate RAM writes:
          removed

          CLHash case 0x14 AES/MIX2/XOR fusion:
          enabled

          CLHash case 0x14 mask/pointer hoist:
          enabled

          CLHash case 0x18 PMULL/MULHRS/XOR fusion:
          enabled

          CLHash case 0x18 mask/pointer hoist:
          enabled

          CLHash case 0x18 divisor hoist:
          enabled

          Low32 XOR:
          direct NEON lane

          FixKey indices:
          uint16

          FixKey:
          fully unrolled

          Runtime Haraka self-test:
          enabled per thread

          Complete candidate replay:
          enabled

          API:
          BUILD=A55-CLHASH-V9
          EOF


          echo "===== SHA256 ====="

          sha256sum \
            dist/* |
            tee \
              dist/SHA256SUMS.txt


      # ================================================================
      # ARTIFACT
      # ================================================================

      - name: Upload V9 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestick-a55-clhash-v9-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
