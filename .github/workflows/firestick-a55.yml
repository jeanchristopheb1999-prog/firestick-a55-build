name: FireStick A55 SHADOWKEY V13

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==============================================================
      # BASES REQUIRED TO RECREATE EXACT V12 #35
      # ==============================================================

      - name: Checkout exact V8 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 6cf06bdd8f85afef8793180e6dd68b4a1a4fd9f0
          path: v8-base


      - name: Checkout exact V10 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 73446a48e954bcc579c302d5a01e3dfb71b2bd30
          path: v10-base


      - name: Checkout V11 development base
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 7f92ff0f8788f54781704ce8414915584450bd78
          path: v11-base


      - name: Checkout exact V11 builder
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: c98f006a974ccee5be50ea5982311c05774432bc
          path: v11-builder


      - name: Checkout V12 source-patch base
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 50ac3037b54d6f045e534af8b04a2ddf571ae844
          path: v12-base


      - name: Checkout exact successful V12 35 builder
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 5f9aa55a96369f8da93561e0c839ed81bc3e15c2
          path: v12-builder


      - name: Checkout pinned ccminer source
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454
          path: src


      # ==============================================================
      # REPLAY EXACT SUCCESSFUL V12 #35
      # ==============================================================

      - name: Replay exact V12 35
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path
          import textwrap


          workflow = Path(
              '../v12-builder/.github/workflows/firestick-a55.yml'
          ).read_text()


          lines = workflow.splitlines()

          blocks = []

          i = 0


          while i < len(lines):

              if lines[i].strip() == "python3 - <<'PY'":

                  start = i + 1
                  end = None


                  for j in range(start, len(lines)):

                      if lines[j].strip() == 'PY':

                          end = j
                          break


                  if end is None:

                      raise SystemExit(
                          'Unterminated V12 builder Python block'
                      )


                  blocks.append(
                      textwrap.dedent(
                          '\n'.join(
                              lines[start:end]
                          )
                      )
                  )


                  i = end + 1

              else:

                  i += 1


          if len(blocks) < 2:

              raise SystemExit(
                  'Expected at least 2 V12 builder blocks, found '
                  + str(len(blocks))
              )


          # Block zero is the proven source reconstruction.
          exec(
              compile(
                  blocks[0],
                  'replay-v12-35.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          api = Path(
              'api.cpp'
          ).read_text()


          if 'BUILD=A55-QCFAST-V12' not in api:

              raise SystemExit(
                  'Exact V12 #35 reconstruction failed'
              )


          clhash = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          ).read_text()


          required = [
              '__verusclmulwithoutreduction64alignedrepeat_v12_fast',
              'v12_mulhrs_fast',
              'v12_read_fpscr',
              'v12_clear_qc',
              'v12_probe_qc',
              'v12_rollback_key',
          ]


          for token in required:

              if token not in clhash:

                  raise SystemExit(
                      'V12 reconstruction missing: '
                      + token
                  )


          print(
              '======================================'
          )

          print(
              'EXACT V12 #35 REPLAY: PASS'
          )

          print(
              '======================================'
          )

          PY


      # ==============================================================
      # V13 SHADOWKEY PATCH
      # ==============================================================

      - name: Patch SHADOWKEY V13
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path
          import re


          # ==========================================================
          # FUNCTION EXTRACTION HELPER
          # ==========================================================

          def function_bounds(
              source,
              name
          ):

              name_pos = source.index(
                  name
              )


              brace = source.index(
                  '{',
                  name_pos
              )


              depth = 0
              end = None


              for i in range(
                  brace,
                  len(source)
              ):

                  if source[i] == '{':

                      depth += 1


                  elif source[i] == '}':

                      depth -= 1


                      if depth == 0:

                          end = i + 1
                          break


              if end is None:

                  raise SystemExit(
                      'Could not find end of function: '
                      + name
                  )


              return (
                  name_pos,
                  brace,
                  end
              )


          # ==========================================================
          # CLHASH
          # ==========================================================

          clpath = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          )


          s = clpath.read_text()


          v12_fast_name = (
              '__verusclmulwithoutreduction64alignedrepeat_v12_fast'
          )


          (
              v12_name_pos,
              v12_brace,
              v12_end
          ) = function_bounds(
              s,
              v12_fast_name
          )


          v12_body = s[
              v12_brace:
              v12_end
          ]


          # ==========================================================
          # REMOVE HOT-PATH BACKUP WRITES
          #
          # V12 does this every one of the 32 CLHash iterations:
          #
          #   save prand original 128 bits
          #   save prandex original 128 bits
          #   save two uint32 indexes
          #
          # V13 FAST path:
          #
          #   NO original-value saves.
          #   only two uint16 indexes.
          # ==========================================================

          patterns = [
              (
                  r'\s*_mm_store_si128_emu'
                  r'\(\s*&g_prand\[i\]\s*,\s*prand\[0\]\s*\)\s*;',

                  ''
              ),

              (
                  r'\s*_mm_store_si128_emu'
                  r'\(\s*&g_prandex\[i\]\s*,\s*prandex\[0\]\s*\)\s*;',

                  ''
              ),

              (
                  r'\s*fixrand\[i\]\s*=\s*prand_idx\s*;',

                  '\n        v13_idx_a[i] = '
                  '(uint16_t)prand_idx;'
              ),

              (
                  r'\s*fixrandex\[i\]\s*=\s*prandex_idx\s*;',

                  '\n        v13_idx_b[i] = '
                  '(uint16_t)prandex_idx;'
              ),
          ]


          shadow_body = v12_body


          for pattern, replacement in patterns:

              shadow_body, count = re.subn(
                  pattern,
                  replacement,
                  shadow_body,
                  count=1
              )


              if count != 1:

                  raise SystemExit(
                      'V13 shadow replacement failed: '
                      + pattern
                      + ' count='
                      + str(count)
                  )


          # The backup objects must be completely absent
          # from the new core.
          forbidden = [
              'g_prand',
              'g_prandex',
              'fixrand[',
              'fixrandex[',
          ]


          for token in forbidden:

              if token in shadow_body:

                  raise SystemExit(
                      'Old backup traffic survived in V13 core: '
                      + token
                  )


          if shadow_body.count(
                  'v13_idx_a[i]'
              ) != 1:

              raise SystemExit(
                  'V13 idx_a store count invalid'
              )


          if shadow_body.count(
                  'v13_idx_b[i]'
              ) != 1:

              raise SystemExit(
                  'V13 idx_b store count invalid'
              )


          # ==========================================================
          # BUILD NEW SHADOW CORE
          # ==========================================================

          shadow_function = r'''
          static
          __attribute__((hot, aligned(64)))
          __m128i
          __verusclmulwithoutreduction64alignedrepeat_v13_shadow(
              __m128i *randomsource,
              const __m128i buf[4],
              uint64_t keyMask,
              uint16_t * __restrict v13_idx_a,
              uint16_t * __restrict v13_idx_b
          )
          ''' + shadow_body


          # ==========================================================
          # V13 HELPERS + WRAPPER
          #
          # v12_qc_mode is retained.
          #
          # First hash:
          #   V12 performs its normal QC self-test.
          #
          # First V13 shadow hash:
          #   run shadow
          #   save the 40 mutated Haraka round keys
          #   restore from immutable base
          #   run exact V11 core
          #   compare intermediate AND round keys
          #
          # Normal path after validation:
          #   shadow CLHash
          #   Haraka
          #   restore from immutable base
          # ==========================================================

          helpers = r'''

          // ==========================================================
          // A55 SHADOWKEY V13
          // ==========================================================

          static __thread int
          v13_shadow_state = 0;

          //  0 = not validated yet
          //  1 = validated
          // -1 = disabled permanently


          extern "C"
          __attribute__((always_inline))
          inline void verusclhashv13_restore(
              void *random,
              const void *base,
              const uint16_t *idx_a,
              const uint16_t *idx_b
          )
          {
              __m128i *key =
                  (__m128i *)random;


              const __m128i *base_key =
                  (const __m128i *)base;


          #pragma clang loop unroll(full)
              for (
                  int i = 0;
                  i < 32;
                  ++i
              )
              {
                  const uint32_t a =
                      (uint32_t)idx_a[i];


                  const uint32_t b =
                      (uint32_t)idx_b[i];


                  key[a] =
                      base_key[a];


                  key[b] =
                      base_key[b];
              }
          }


          extern "C"
          uint64_t verusclhashv13_shadow(
              void *random,
              const unsigned char buf[64],
              uint64_t keyMask,
              const void *base,
              uint16_t *idx_a,
              uint16_t *idx_b,
              uint32_t *fixrand,
              uint32_t *fixrandex,
              __m128i *g_prand,
              __m128i *g_prandex,
              int *restore_mode
          )
          {
              __m128i *rs64 =
                  (__m128i *)random;


              const __m128i *string =
                  (const __m128i *)buf;


              // ======================================================
              // LET V12 COMPLETE ITS OWN HARDWARE VALIDATION FIRST
              // ======================================================

              if (__builtin_expect(
                      v12_qc_mode != 1,
                      0
                  ))
              {
                  *restore_mode = 1;


                  return
                      verusclhashv2_2(
                          random,
                          buf,
                          keyMask,
                          fixrand,
                          fixrandex,
                          g_prand,
                          g_prandex
                      );
              }


              if (__builtin_expect(
                      v13_shadow_state < 0,
                      0
                  ))
              {
                  *restore_mode = 1;


                  return
                      verusclhashv2_2(
                          random,
                          buf,
                          keyMask,
                          fixrand,
                          fixrandex,
                          g_prand,
                          g_prandex
                      );
              }


              // ======================================================
              // FAST SHADOW CORE
              // ======================================================

              v12_clear_qc();


              __m128i fast_acc =
                  __verusclmulwithoutreduction64alignedrepeat_v13_shadow(
                      rs64,
                      string,
                      keyMask,
                      idx_a,
                      idx_b
                  );


              const uint32_t fast_flags =
                  v12_read_fpscr();


              // ======================================================
              // RARE MULHRS SATURATION
              //
              // Restore directly from immutable key,
              // then replay the exact V11 CLHash.
              // ======================================================

              if (__builtin_expect(
                      (
                          fast_flags &
                          V12_FPSCR_QC
                      ) != 0,
                      0
                  ))
              {
                  verusclhashv13_restore(
                      random,
                      base,
                      idx_a,
                      idx_b
                  );


                  v12_clear_qc();


                  __m128i exact_acc =
                      __verusclmulwithoutreduction64alignedrepeat_v2_1(
                          rs64,
                          string,
                          keyMask,
                          fixrand,
                          fixrandex,
                          g_prand,
                          g_prandex
                      );


                  v12_clear_qc();


                  exact_acc =
                      _mm_xor_si128_emu(
                          exact_acc,
                          _mm_cvtsi64_si128_emu(
                              0x10000ULL
                          )
                      );


                  *restore_mode = 1;


                  return
                      precompReduction64_port(
                          exact_acc
                      );
              }


              // ======================================================
              // REDUCE FAST INTERMEDIATE
              // ======================================================

              __m128i reduced_fast_acc =
                  _mm_xor_si128_emu(
                      fast_acc,
                      _mm_cvtsi64_si128_emu(
                          0x10000ULL
                      )
                  );


              const uint64_t fast_hash =
                  precompReduction64_port(
                      reduced_fast_acc
                  );


              // ======================================================
              // ONE-TIME SHADOW VALIDATION
              //
              // Validate both:
              //   1. CLHash intermediate
              //   2. all 40 Haraka round keys that follow the
              //      intermediate-selected key offset.
              // ======================================================

              if (__builtin_expect(
                      v13_shadow_state == 0,
                      0
                  ))
              {
                  alignas(16)
                  __m128i fast_round_keys[40];


                  const uint32_t fast_offset =
                      (uint32_t)(
                          fast_hash &
                          511ULL
                      );


                  memcpy(
                      fast_round_keys,
                      rs64 + fast_offset,
                      sizeof(fast_round_keys)
                  );


                  // Return mutable key to pristine state.
                  verusclhashv13_restore(
                      random,
                      base,
                      idx_a,
                      idx_b
                  );


                  v12_clear_qc();


                  // Re-run exact V11.
                  __m128i exact_acc =
                      __verusclmulwithoutreduction64alignedrepeat_v2_1(
                          rs64,
                          string,
                          keyMask,
                          fixrand,
                          fixrandex,
                          g_prand,
                          g_prandex
                      );


                  v12_clear_qc();


                  exact_acc =
                      _mm_xor_si128_emu(
                          exact_acc,
                          _mm_cvtsi64_si128_emu(
                              0x10000ULL
                          )
                      );


                  const uint64_t exact_hash =
                      precompReduction64_port(
                          exact_acc
                      );


                  const uint32_t exact_offset =
                      (uint32_t)(
                          exact_hash &
                          511ULL
                      );


                  const int hash_equal =
                      fast_hash ==
                      exact_hash;


                  const int keys_equal =
                      (
                          fast_offset ==
                          exact_offset
                      )
                      &&
                      (
                          memcmp(
                              fast_round_keys,
                              rs64 + exact_offset,
                              sizeof(fast_round_keys)
                          )
                          == 0
                      );


                  if (
                      hash_equal &&
                      keys_equal
                  )
                  {
                      v13_shadow_state = 1;
                  }
                  else
                  {
                      v13_shadow_state = -1;
                  }


                  // Exact path currently owns the mutations.
                  // Caller must perform classic FixKey.
                  *restore_mode = 1;


                  return exact_hash;
              }


              // ======================================================
              // VALIDATED FAST PATH
              //
              // Caller executes partial Haraka while the working
              // key is still mutated, then restores using base key.
              // ======================================================

              *restore_mode = 0;


              return fast_hash;
          }


          '''


          insert_at = v12_end


          s = (
              s[:insert_at]
              + '\n'
              + helpers
              + '\n'
              + shadow_function
              + '\n'
              + s[insert_at:]
          )


          clpath.write_text(
              s
          )


          # ==========================================================
          # HEADER DECLARATIONS
          # ==========================================================

          hpath = Path(
              'verus/armv7/verus_clhash.h'
          )


          h = hpath.read_text()


          marker = (
              'uint64_t verusclhash_port('
          )


          marker_pos = h.index(
              marker
          )


          decl = r'''
          uint64_t verusclhashv13_shadow(
              void *random,
              const unsigned char buf[64],
              uint64_t keyMask,
              const void *base,
              uint16_t *idx_a,
              uint16_t *idx_b,
              uint32_t *__restrict fixrand,
              uint32_t *__restrict fixrandex,
              __m128i *g_prand,
              __m128i *g_prandex,
              int *restore_mode
          );

          void verusclhashv13_restore(
              void *random,
              const void *base,
              const uint16_t *idx_a,
              const uint16_t *idx_b
          );

          '''


          h = (
              h[:marker_pos]
              + decl
              + h[marker_pos:]
          )


          hpath.write_text(
              h
          )


          # ==========================================================
          # VERUSSCAN
          # ==========================================================

          spath = Path(
              'verus/armv7/verusscan.cpp'
          )


          scan = spath.read_text()


          # ==========================================================
          # EXPAND SINGLE ALLOCATION
          #
          # Existing:
          #   working key : 8832
          #   V11/V12 backup area : 1024
          #
          # Add:
          #   immutable base key : 8832
          # ==========================================================

          old_size = (
              'VERUS_KEY_SIZE + 1024'
          )


          size_count = scan.count(
              old_size
          )


          if size_count != 1:

              raise SystemExit(
                  'Expected one V12 data_key allocation size, found '
                  + str(size_count)
              )


          scan = scan.replace(
              old_size,
              'VERUS_KEY_SIZE + 1024 + VERUS_KEY_SIZE',
              1
          )


          # ==========================================================
          # IMMUTABLE BASE POINTER
          # ==========================================================

          m = re.search(
              r'(__m128i\s*\*\s*data_key_prandex\s*='
              r'[^;]+;)',
              scan
          )


          if not m:

              raise SystemExit(
                  'data_key_prandex declaration not found'
              )


          base_decl = r'''

              __m128i *data_key_base =
                  (__m128i *)(
                      (unsigned char *)data_key
                      +
                      VERUS_KEY_SIZE
                      +
                      1024
                  );
          '''


          scan = (
              scan[:m.end()]
              + base_decl
              + scan[m.end():]
          )


          # ==========================================================
          # COMPACT 16-BIT TOUCH LOG
          # ==========================================================

          m = re.search(
              r'alignas\(64\)\s+uint32_t\s+fixrandex\[32\]\s*;',
              scan
          )


          if not m:

              raise SystemExit(
                  'aligned fixrandex declaration not found'
              )


          idx_decl = r'''

              alignas(64)
              uint16_t v13_idx_a[32];


              alignas(64)
              uint16_t v13_idx_b[32];
          '''


          scan = (
              scan[:m.end()]
              + idx_decl
              + scan[m.end():]
          )


          # ==========================================================
          # COPY KEY ONCE PER WORK UNIT
          # ==========================================================

          gen_pos = scan.index(
              'GenNewCLKey('
          )


          gen_end = scan.index(
              ';',
              gen_pos
          ) + 1


          base_copy = r'''

              memcpy(
                  data_key_base,
                  data_key,
                  VERUS_KEY_SIZE
              );
          '''


          scan = (
              scan[:gen_end]
              + base_copy
              + scan[gen_end:]
          )


          # ==========================================================
          # REPLACE HOT Verus2hash WITH V13 VERSION
          # ==========================================================

          normal_name = (
              'inline void Verus2hash('
          )


          normal_pos = scan.index(
              normal_name
          )


          normal_start = scan.rfind(
              'extern "C"',
              0,
              normal_pos
          )


          normal_brace = scan.index(
              '{',
              normal_pos
          )


          depth = 0
          normal_end = None


          for i in range(
              normal_brace,
              len(scan)
          ):

              if scan[i] == '{':

                  depth += 1


              elif scan[i] == '}':

                  depth -= 1


                  if depth == 0:

                      normal_end = i + 1
                      break


          if normal_end is None:

              raise SystemExit(
                  'Could not locate end of Verus2hash'
              )


          v13_verus2 = r'''extern "C"
          __attribute__((always_inline))
          inline void Verus2hash(
              unsigned char *hash,
              unsigned char *curBuf,
              unsigned char *nonce,
              __m128i * __restrict data_key,
              uint8_t *gpu_init,
              uint32_t *fixrand,
              uint32_t *fixrandex,
              __m128i *g_prand,
              __m128i *g_prandex,
              int version,
              const __m128i *data_key_base,
              uint16_t *v13_idx_a,
              uint16_t *v13_idx_b
          )
          {
              (void)gpu_init;
              (void)version;


              memcpy(
                  curBuf + 47,
                  curBuf,
                  16
              );


              memcpy(
                  curBuf + 63,
                  curBuf,
                  1
              );


              memcpy(
                  curBuf + 32,
                  nonce,
                  15
              );


              int restore_mode =
                  1;


              uint64_t intermediate =
                  verusclhashv13_shadow(
                      data_key,
                      curBuf,
                      511,
                      data_key_base,
                      v13_idx_a,
                      v13_idx_b,
                      fixrand,
                      fixrandex,
                      g_prand,
                      g_prandex,
                      &restore_mode
                  );


              memcpy(
                  curBuf + 47,
                  &intermediate,
                  8
              );


              memcpy(
                  curBuf + 55,
                  &intermediate,
                  8
              );


              memcpy(
                  curBuf + 63,
                  &intermediate,
                  1
              );


              intermediate &=
                  511;


              const __m128i *round_keys =
                  data_key
                  +
                  intermediate;


              if (__builtin_expect(
                      v8_haraka_fast_state < 0,
                      0
                  ))
              {
                  haraka512_port_keyed(
                      hash,
                      curBuf,
                      round_keys
                  );
              }
              else
              {
                  v8_haraka512_word7(
                      hash,
                      curBuf,
                      round_keys
                  );


                  if (__builtin_expect(
                          v8_haraka_fast_state == 0,
                          0
                      ))
                  {
                      alignas(16)
                      uint32_t reference_hash[8] =
                          { 0 };


                      haraka512_port_keyed(
                          (unsigned char *)
                              reference_hash,
                          curBuf,
                          round_keys
                      );


                      uint32_t fast_word7;


                      memcpy(
                          &fast_word7,
                          hash + 28,
                          sizeof(fast_word7)
                      );


                      if (
                          fast_word7
                          ==
                          reference_hash[7]
                      )
                      {
                          v8_haraka_fast_state =
                              1;
                      }
                      else
                      {
                          memcpy(
                              hash,
                              reference_hash,
                              32
                          );


                          v8_haraka_fast_state =
                              -1;
                      }
                  }
              }


              // ======================================================
              // V13 RESTORE
              //
              // Fast validated path:
              // restore touched locations directly from immutable key.
              //
              // Validation / QC fallback:
              // exact V11 path made the mutations, so use FixKey.
              // ======================================================

              if (__builtin_expect(
                      restore_mode == 0,
                      1
                  ))
              {
                  verusclhashv13_restore(
                      data_key,
                      data_key_base,
                      v13_idx_a,
                      v13_idx_b
                  );
              }
              else
              {
                  FixKey(
                      fixrand,
                      fixrandex,
                      data_key,
                      g_prand,
                      g_prandex
                  );
              }
          }'''


          scan = (
              scan[:normal_start]
              + v13_verus2
              + scan[normal_end:]
          )


          # ==========================================================
          # PATCH HOT LOOP CALL
          # ==========================================================

          scan_start = scan.index(
              'extern "C" int scanhash_verus'
          )


          call_start = scan.index(
              'Verus2hash(',
              scan_start
          )


          open_paren = scan.index(
              '(',
              call_start
          )


          depth = 0
          close_paren = None


          for i in range(
              open_paren,
              len(scan)
          ):

              if scan[i] == '(':

                  depth += 1


              elif scan[i] == ')':

                  depth -= 1


                  if depth == 0:

                      close_paren = i
                      break


          if close_paren is None:

              raise SystemExit(
                  'Could not locate hot Verus2hash call end'
              )


          semicolon = scan.index(
              ';',
              close_paren
          ) + 1


          new_call = r'''Verus2hash(
                      (unsigned char *)vhash,
                      (unsigned char *)blockhash_half,
                      nonceSpace,
                      data_key,
                      &gpuinit,
                      fixrand,
                      fixrandex,
                      data_key_prand,
                      data_key_prandex,
                      version,
                      data_key_base,
                      v13_idx_a,
                      v13_idx_b
                  );'''


          scan = (
              scan[:call_start]
              + new_call
              + scan[semicolon:]
          )


          spath.write_text(
              scan
          )


          # ==========================================================
          # BUILD ID
          # ==========================================================

          apath = Path(
              'api.cpp'
          )


          api = apath.read_text()


          if 'BUILD=A55-QCFAST-V12' not in api:

              raise SystemExit(
                  'V12 BUILD ID missing'
              )


          api = api.replace(
              'BUILD=A55-QCFAST-V12',
              'BUILD=A55-SHADOWKEY-V13',
              1
          )


          apath.write_text(
              api
          )


          # ==========================================================
          # FINAL SOURCE VALIDATION
          # ==========================================================

          clhash = clpath.read_text()

          scan = spath.read_text()


          required_clhash = [
              '__verusclmulwithoutreduction64alignedrepeat_v13_shadow',
              'verusclhashv13_shadow',
              'verusclhashv13_restore',
              'v13_shadow_state',
              'fast_round_keys[40]',
              'v12_qc_mode',
          ]


          for token in required_clhash:

              if token not in clhash:

                  raise SystemExit(
                      'V13 CLHash token missing: '
                      + token
                  )


          required_scan = [
              'data_key_base',
              'v13_idx_a[32]',
              'v13_idx_b[32]',
              'verusclhashv13_shadow',
              'verusclhashv13_restore',
          ]


          for token in required_scan:

              if token not in scan:

                  raise SystemExit(
                      'V13 scan token missing: '
                      + token
                  )


          if (
              'BUILD=A55-SHADOWKEY-V13'
              not in apath.read_text()
          ):

              raise SystemExit(
                  'V13 BUILD ID missing'
              )


          print(
              '======================================'
          )

          print(
              'A55 SHADOWKEY V13 PATCH: PASS'
          )

          print(
              '======================================'
          )

          print(
              'Exact V12 #35        : PRESERVED'
          )

          print(
              'V12 QCFAST           : PRESERVED'
          )

          print(
              'V13 immutable key    : YES'
          )

          print(
              'V13 backup vectors   : REMOVED FAST PATH'
          )

          print(
              'V13 indexes          : UINT16'
          )

          print(
              'V13 shadow restore   : YES'
          )

          print(
              'V13 intermediate test: YES'
          )

          print(
              'V13 40-key test      : YES'
          )

          print(
              'Automatic V12 fallback: YES'
          )

          print(
              'BUILD=A55-SHADOWKEY-V13'
          )

          PY


      # ==============================================================
      # SEMANTIC TESTS
      # ==============================================================

      - name: Verify SHADOWKEY V13 model
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import random


          random.seed(
              0xA5513
          )


          # ==========================================================
          # MODEL:
          #
          # old path:
          # save old values each round, mutate,
          # reverse-restore old values
          #
          # V13:
          # only save indices, mutate,
          # restore each touched index from immutable base
          # ==========================================================

          for trial in range(
              100000
          ):

              base = [
                  random.getrandbits(128)
                  for _ in range(512)
              ]


              old_key = list(
                  base
              )


              new_key = list(
                  base
              )


              fix_a = []
              fix_b = []

              old_a = []
              old_b = []

              idx_a = []
              idx_b = []


              for i in range(32):

                  a = random.randrange(
                      512
                  )


                  b = random.randrange(
                      512
                  )


                  # OLD BACKUP PATH
                  fix_a.append(a)
                  fix_b.append(b)

                  old_a.append(
                      old_key[a]
                  )

                  old_b.append(
                      old_key[b]
                  )


                  # NEW COMPACT LOG
                  idx_a.append(a)
                  idx_b.append(b)


                  # Same arbitrary mutations applied to both models.
                  ma = random.getrandbits(
                      128
                  )

                  mb = random.getrandbits(
                      128
                  )


                  old_key[a] ^= ma
                  old_key[b] ^= mb

                  new_key[a] ^= ma
                  new_key[b] ^= mb


              # They must be identical before restore.
              assert old_key == new_key


              # OLD reverse backup restore.
              for i in range(
                  31,
                  -1,
                  -1
              ):

                  old_key[
                      fix_b[i]
                  ] = old_b[i]


                  old_key[
                      fix_a[i]
                  ] = old_a[i]


              # V13 immutable-base restore.
              #
              # Order no longer matters because every restore value
              # is the pristine base value.
              for i in range(32):

                  new_key[
                      idx_a[i]
                  ] = base[
                      idx_a[i]
                  ]


                  new_key[
                      idx_b[i]
                  ] = base[
                      idx_b[i]
                  ]


              assert old_key == base

              assert new_key == base

              assert old_key == new_key


              # Indexes must fit uint16 easily.
              assert max(idx_a) <= 511

              assert max(idx_b) <= 511


          print(
              '100,000 shadow restore simulations: PASS'
          )


          # ==========================================================
          # HARAKA WINDOW SAFETY
          #
          # intermediate & 511 selects the first of 40 x 16-byte keys.
          #
          # 511 + 39 = 550
          # key contains 552 entries.
          # ==========================================================

          for offset in range(512):

              assert (
                  offset + 39
                  <
                  552
              )


          print(
              'Haraka 40-key window bounds: PASS'
          )


          # ==========================================================
          # TRAFFIC ACCOUNTING
          #
          # OLD bookkeeping per hash:
          #
          # backup phase:
          #   64 x 16B original value stores = 1024
          #   64 x 4B index stores          = 256
          #
          # restore:
          #   64 x 16B backup loads         = 1024
          #   64 x 4B index loads           = 256
          #   64 x 16B key stores           = 1024
          #
          # total = 3584
          #
          # V13:
          #   64 x 2B index stores          = 128
          #   64 x 2B index loads           = 128
          #   64 x 16B immutable-key loads  = 1024
          #   64 x 16B key stores           = 1024
          #
          # total = 2304
          # ==========================================================

          old_bytes = (
              1024
              +
              256
              +
              1024
              +
              256
              +
              1024
          )


          new_bytes = (
              128
              +
              128
              +
              1024
              +
              1024
          )


          saved = (
              old_bytes
              -
              new_bytes
          )


          percent = (
              saved
              * 100.0
              /
              old_bytes
          )


          assert old_bytes == 3584

          assert new_bytes == 2304

          assert saved == 1280


          print(
              'Old bookkeeping bytes/hash:',
              old_bytes
          )


          print(
              'V13 bookkeeping bytes/hash:',
              new_bytes
          )


          print(
              'Saved bytes/hash:',
              saved
          )


          print(
              'Bookkeeping traffic reduction:',
              round(
                  percent,
                  2
              ),
              '%'
          )


          print(
              '======================================'
          )

          print(
              'SHADOWKEY V13 MODEL: PASS'
          )

          print(
              '======================================'
          )

          PY


      # ==============================================================
      # SOURCE CHECK
      # ==============================================================

      - name: Verify V13 source
        shell: bash
        run: |
          set -euo pipefail

          cd src


          echo "===== BUILD ====="

          grep -n \
            "A55-SHADOWKEY-V13" \
            api.cpp


          echo "===== V12 QCFAST STILL PRESENT ====="

          grep -n \
            "v12_mulhrs_fast" \
            verus/armv7/verus_clhash_portable.cpp |
            head -n 5


          echo "===== V13 SHADOW CORE ====="

          grep -n \
            "v13_shadow" \
            verus/armv7/verus_clhash_portable.cpp |
            head -n 30


          echo "===== V13 COMPACT INDEX ====="

          grep -n \
            "v13_idx_a" \
            verus/armv7/verus_clhash_portable.cpp |
            head -n 20


          grep -n \
            "v13_idx_b" \
            verus/armv7/verus_clhash_portable.cpp |
            head -n 20


          echo "===== IMMUTABLE BASE ====="

          grep -n \
            "data_key_base" \
            verus/armv7/verusscan.cpp


          echo "===== 40 HARAKA KEY VALIDATION ====="

          grep -n \
            "fast_round_keys" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== RESTORE ====="

          grep -n \
            "verusclhashv13_restore" \
            verus/armv7/verus_clhash_portable.cpp


      # ==============================================================
      # BUILD
      # ==============================================================

      - name: Make build script executable
        shell: bash
        run: |
          set -euo pipefail

          cd src

          chmod +x \
            scripts/build-android-ccminer.sh


      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          cd src


          docker build \
            -t ccminer-firestick-a55-v13 \
            -f build.Dockerfile \
            .


      - name: Build SHADOWKEY V13 armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            build-output


          mkdir -p \
            build-output


          docker run \
            --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v13 \
            arm


          echo "===== OUTPUT ====="

          find \
            build-output \
            -maxdepth 4 \
            -type f \
            -print


          echo "===== BUILD LOG ====="

          tail -n 500 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log


          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer


      # ==============================================================
      # BINARY INSPECTION
      # ==============================================================

      - name: Inspect SHADOWKEY V13 binary
        shell: bash
        run: |
          set -euo pipefail

          cd src


          BIN="build-output/ccminer-armeabi-v7a/bin/ccminer"


          echo "===== FILE ====="

          file \
            "$BIN"


          echo "===== BUILD ID ====="

          strings \
            "$BIN" |
            grep \
              "A55-SHADOWKEY-V13"


          echo "===== SIZE ====="

          ls -lh \
            "$BIN"


          echo "===== AEABI LDIVMOD ====="

          readelf \
            -Ws \
            "$BIN" |
            grep \
              "__aeabi_ldivmod" ||
            true


      # ==============================================================
      # PACKAGE
      # ==============================================================

      - name: Prepare SHADOWKEY V13 package
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            dist


          mkdir -p \
            dist


          BIN="build-output/ccminer-armeabi-v7a/bin"


          cp \
            "$BIN/ccminer" \
            dist/ccminer-a55-shadowkey-v13


          if test -f "$BIN/libc++_shared.so"
          then

              cp \
                "$BIN/libc++_shared.so" \
                dist/

          fi


          if test -f "$BIN/libomp.so"
          then

              cp \
                "$BIN/libomp.so" \
                dist/

          fi


          chmod +x \
            dist/ccminer-a55-shadowkey-v13


          cat > dist/BUILDINFO.txt <<EOF
          Build:
          A55-SHADOWKEY-V13

          Stable base:
          exact A55-QCFAST-V12 #35

          V12 builder commit:
          5f9aa55a96369f8da93561e0c839ed81bc3e15c2

          V12 measured baseline:
          approximately 1.26 MH/s sustained

          ccminer source:
          7f30d6bfb64d0f3ba010191c5a185016ba46f454

          ABI:
          armeabi-v7a / AArch32

          Target CPU:
          Cortex-A55

          Hardware AES:
          preserved

          Hardware PMULL:
          preserved

          V10 FASTMOD:
          preserved

          V11 HOTCORE:
          preserved

          V12 QCFAST:
          preserved

          V13 immutable base key:
          enabled

          V13 hot-path original-value backups:
          removed

          V13 hot-path touched indexes:
          uint16

          V13 normal restore:
          direct from immutable key

          V13 validation:
          CLHash intermediate + 40 mutated Haraka keys

          V13 fallback:
          exact V12

          Old bookkeeping traffic:
          approximately 3584 bytes/hash

          V13 bookkeeping traffic:
          approximately 2304 bytes/hash

          Estimated bookkeeping traffic reduction:
          approximately 35.7 percent

          API:
          BUILD=A55-SHADOWKEY-V13
          EOF


          echo "===== PACKAGE ====="

          ls -lh \
            dist/


          echo "===== SHA256 ====="

          sha256sum \
            dist/* |
            tee \
              dist/SHA256SUMS.txt


      # ==============================================================
      # ARTIFACT
