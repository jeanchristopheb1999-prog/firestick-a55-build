name: FireStick A55 NEON MULHRS V6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pinned ccminer ARM source
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454

      - name: Patch FireStick A55 V6
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected code not found in {path}: {old}')
              p.write_text(s.replace(old, new, 1))

          # ============================================================
          # Cortex-A55 / ARMv8 Crypto / AArch32
          # ============================================================
          replace_once(
              'Makefile.am',
              'SHARED_CPPFLAGS += -march=armv7-a -mfpu=neon -mfloat-abi=softfp',
              'SHARED_CPPFLAGS += -march=armv8-a+crypto -mtune=cortex-a55 -mfpu=crypto-neon-fp-armv8 -mfloat-abi=softfp'
          )

          # ============================================================
          # V3 SIGBUS ALIGNMENT FIXES — PRESERVE EXACTLY
          # ============================================================
          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t _ALIGN(4)  blockhash_half[64] = { 0 };',
              'alignas(32) uint8_t blockhash_half[64] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              '__m128i *data_key =  (__m128i*)malloc(VERUS_KEY_SIZE + 1024);',
              '''__m128i *data_key = NULL;
              if (posix_memalign((void **)&data_key, 64, VERUS_KEY_SIZE + 1024) != 0 || !data_key)
              {
                  return 0;
              }'''
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t  full_data[140 + 3 + 1344] = { 0 };',
              'alignas(16) uint8_t full_data[140 + 3 + 1344] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t nonceSpace[15] = {0};',
              'alignas(16) uint8_t nonceSpace[16] = {0};'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint32_t  vhash[8] = { 0 };',
              'alignas(16) uint32_t vhash[8] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              '((uint32_t *)(&nonceSpace[11]))[0] = nonce_buf;',
              'memcpy(&nonceSpace[11], &nonce_buf, sizeof(nonce_buf));'
          )

          # ============================================================
          # HARDWARE AES — V4/V5 PRESERVED
          # ============================================================
          p = Path('verus/armv7/haraka_portable.c')
          s = p.read_text()

          start = s.index('void aesenc(unsigned char *s, const unsigned char *rk)')
          end = s.index('\n// Simulate _mm_unpacklo_epi32', start)

          hw_aes = r'''void aesenc(unsigned char *s, const unsigned char *rk)
          {
              uint8x16_t state = vld1q_u8((const uint8_t *)s);
              const uint8x16_t zero = vdupq_n_u8(0);

              state = vaeseq_u8(state, zero);
              state = vaesmcq_u8(state);
              state = veorq_u8(
                  state,
                  vld1q_u8((const uint8_t *)rk)
              );

              vst1q_u8((uint8_t *)s, state);
          }
          '''

          p.write_text(s[:start] + hw_aes + s[end:])

          # ============================================================
          # SAFE HARAKA RETURNS — PRESERVE SIGBUS FIX
          # ============================================================
          p = Path('verus/armv7/haraka_portable.h')
          s = p.read_text()

          unsafe = 'return *(__m128i *)result;'

          if s.count(unsafe) != 2:
              raise SystemExit(
                  f'Expected 2 unsafe Haraka returns, found {s.count(unsafe)}'
              )

          s = s.replace(
              unsafe,
              'return vreinterpretq_m128i_u32(vld1q_u32(result));'
          )

          p.write_text(s)

          # ============================================================
          # CLHASH SAFE RETURNS + LOAD/STORE
          # ============================================================
          p = Path('verus/armv7/verus_clhash_portable.cpp')
          s = p.read_text()

          unsafe = 'return *(__m128i *)result;'

          if s.count(unsafe) != 3:
              raise SystemExit(
                  f'Expected 3 unsafe CLHash returns, found {s.count(unsafe)}'
              )

          s = s.replace(
              unsafe,
              '''__m128i out;
              memcpy(&out, result, sizeof(out));
              return out;'''
          )

          start = s.index('__m128i _mm_load_si128_emu(const void *p)')
          end = s.index('\n void _mm_store_si128_emu', start)

          safe_load = r'''__m128i _mm_load_si128_emu(const void *p)
          {
              return vreinterpretq_m128i_u8(
                  vld1q_u8((const uint8_t *)p)
              );
          }
          '''

          s = s[:start] + safe_load + s[end:]

          start = s.index('void _mm_store_si128_emu(void *p, __m128i val)')
          end = s.index('\n__m128i _mm_shuffle_epi8_emu', start)

          safe_store = r'''void _mm_store_si128_emu(void *p, __m128i val)
          {
              vst1q_u8(
                  (uint8_t *)p,
                  vreinterpretq_u8_m128i(val)
              );
          }
          '''

          s = s[:start] + safe_store + s[end:]

          # ============================================================
          # V5 ZERO-COPY HARDWARE PMULL — PRESERVE EXACTLY
          # ============================================================
          start = s.index('__m128i _mm_clmulepi64_si128_emu')
          end = s.index('\n__m128i _mm_mulhrs_epi16_emu', start)

          zero_copy_pmull = r'''static inline __attribute__((always_inline))
          __m128i _mm_clmulepi64_si128_emu(const __m128i &a, const __m128i &b, int imm)
          {
              const uint64x2_t av =
                  vreinterpretq_u64_s32(a);

              const uint64x2_t bv =
                  vreinterpretq_u64_s32(b);

              const uint64x1_t va =
                  (imm & 1) ? vget_high_u64(av) : vget_low_u64(av);

              const uint64x1_t vb =
                  (imm & 0x10) ? vget_high_u64(bv) : vget_low_u64(bv);

              uint64x2_t product;

              __asm__ volatile(
                  "vmull.p64 %q0, %P1, %P2"
                  : "=w"(product)
                  : "w"(va), "w"(vb)
              );

              return vreinterpretq_s32_u64(product);
          }
          '''

          s = s[:start] + zero_copy_pmull + s[end:]

          # ============================================================
          # V6 — VECTORIZE _mm_mulhrs_epi16_emu
          #
          # OLD:
          #   8 scalar signed multiplies in a C loop
          #
          # NEW:
          #   8 lanes processed with NEON
          #
          # Keeps exact old arithmetic:
          #   ((a*b)+0x4000) >> 15
          # ============================================================
          start = s.index('__m128i _mm_mulhrs_epi16_emu')
          marker = s.index('_mm_set_epi64x_emu', start)
          end = s.rfind('\n', start, marker) + 1

          neon_mulhrs = r'''static inline __attribute__((always_inline))
          __m128i _mm_mulhrs_epi16_emu(__m128i a, __m128i b)
          {
              const int16x8_t va =
                  vreinterpretq_s16_m128i(a);

              const int16x8_t vb =
                  vreinterpretq_s16_m128i(b);

              const int32x4_t prod_lo =
                  vmull_s16(
                      vget_low_s16(va),
                      vget_low_s16(vb)
                  );

              const int32x4_t prod_hi =
                  vmull_s16(
                      vget_high_s16(va),
                      vget_high_s16(vb)
                  );

              const int32x4_t rounding =
                  vdupq_n_s32(0x4000);

              const int32x4_t rounded_lo =
                  vshrq_n_s32(
                      vaddq_s32(prod_lo, rounding),
                      15
                  );

              const int32x4_t rounded_hi =
                  vshrq_n_s32(
                      vaddq_s32(prod_hi, rounding),
                      15
                  );

              const int16x8_t result =
                  vcombine_s16(
                      vmovn_s32(rounded_lo),
                      vmovn_s32(rounded_hi)
                  );

              return vreinterpretq_m128i_s16(result);
          }

          '''

          s = s[:start] + neon_mulhrs + s[end:]

          p.write_text(s)

          # ============================================================
          # V6 ID IN API
          # ============================================================
          p = Path('api.cpp')
          s = p.read_text()

          old = '''sprintf(buffer, "NAME=%s;VER=%s;API=%s;"'''

          new = '''sprintf(buffer, "NAME=%s;VER=%s;BUILD=A55-NEON-MULHRS-V6;API=%s;"'''

          if old not in s:
              raise SystemExit('API summary signature not found')

          p.write_text(s.replace(old, new, 1))

          print('=======================================')
          print('FireStick A55 NEON MULHRS V6')
          print('=======================================')
          print('V3 SIGBUS fixes       : PRESERVED')
          print('V4 hardware AES       : PRESERVED')
          print('V4 hardware PMULL     : PRESERVED')
          print('V5 zero-copy PMULL    : PRESERVED')
          print('V6 NEON MULHRS        : ENABLED')
          print('V6 always-inline      : ENABLED')
          print('API build identifier  : A55-NEON-MULHRS-V6')
          PY

      - name: Verify V6 patches
        shell: bash
        run: |
          set -euo pipefail

          echo "===== CPU ====="
          grep -n "cortex-a55" Makefile.am

          echo "===== AES ====="
          grep -n "vaeseq_u8" \
            verus/armv7/haraka_portable.c

          echo "===== PMULL ====="
          grep -n "vmull.p64" \
            verus/armv7/verus_clhash_portable.cpp

          echo "===== ZERO COPY ====="
          grep -n "vget_high_u64" \
            verus/armv7/verus_clhash_portable.cpp

          echo "===== NEON MULHRS ====="
          grep -n "vmull_s16" \
            verus/armv7/verus_clhash_portable.cpp

          grep -n "vmovn_s32" \
            verus/armv7/verus_clhash_portable.cpp

          echo "===== API ID ====="
          grep -n "A55-NEON-MULHRS-V6" api.cpp

          echo "===== ALIGNMENT ====="
          grep -n "posix_memalign" \
            verus/armv7/verusscan.cpp

          grep -n "alignas" \
            verus/armv7/verusscan.cpp

      - name: Make Android build script executable
        run: chmod +x scripts/build-android-ccminer.sh

      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t ccminer-firestick-a55-v6 \
            -f build.Dockerfile \
            .

      - name: Build armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-output
          mkdir -p build-output

          docker run --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v6 \
            arm

          echo "===== OUTPUT ====="
          find build-output -maxdepth 4 -type f -print

          echo "===== BUILD LOG ====="
          tail -n 200 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log

          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer

      - name: Prepare V6 package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          BIN="build-output/ccminer-armeabi-v7a/bin"

          cp "$BIN/ccminer" \
            dist/ccminer-a55-neon-mulhrs-v6

          test -f "$BIN/libc++_shared.so" && \
            cp "$BIN/libc++_shared.so" dist/ || true

          test -f "$BIN/libomp.so" && \
            cp "$BIN/libomp.so" dist/ || true

          chmod +x dist/ccminer-a55-neon-mulhrs-v6

          cat > dist/BUILDINFO.txt <<EOF
          Build: A55-NEON-MULHRS-V6
          Source: 7f30d6bfb64d0f3ba010191c5a185016ba46f454

          ABI: armeabi-v7a / AArch32
          Android API: 23

          Cortex-A55 tune: enabled
          ARMv8 crypto: enabled
          Hardware AES: enabled
          Hardware PMULL: enabled
          Zero-copy PMULL: enabled
          NEON MULHRS: enabled
          Always-inline hot helpers: enabled

          V3 SIGBUS fixes: preserved

          API identifier:
          BUILD=A55-NEON-MULHRS-V6

          V5 baseline:
          approximately 424 kH/s
          REJ=0
          STALE=0
          DISCO=0
          EOF

          echo "===== BINARY ====="
          file dist/ccminer-a55-neon-mulhrs-v6

          echo "===== SHA256 ====="
          sha256sum dist/* | tee dist/SHA256SUMS.txt

      - name: Upload V6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestick-a55-neon-mulhrs-v6-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
