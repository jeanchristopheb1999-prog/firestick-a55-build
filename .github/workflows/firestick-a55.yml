name: FireStick A55 OPT AlignFix V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pinned ccminer ARM source
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454

      - name: Patch Cortex-A55 AES and SIGBUS fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected code not found in {path}: {old}')
              p.write_text(s.replace(old, new, 1))

          # ------------------------------------------------------------
          # 1. Cortex-A55 + ARMv8 crypto while staying 32-bit AArch32
          # ------------------------------------------------------------
          replace_once(
              'Makefile.am',
              'SHARED_CPPFLAGS += -march=armv7-a -mfpu=neon -mfloat-abi=softfp',
              'SHARED_CPPFLAGS += -march=armv8-a+crypto -mtune=cortex-a55 -mfpu=crypto-neon-fp-armv8 -mfloat-abi=softfp'
          )

          # ------------------------------------------------------------
          # 2. Main Verus buffer alignment
          # ------------------------------------------------------------
          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t _ALIGN(4)  blockhash_half[64] = { 0 };',
              'alignas(32) uint8_t blockhash_half[64] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              '__m128i *data_key =  (__m128i*)malloc(VERUS_KEY_SIZE + 1024);',
              '''__m128i *data_key = NULL;
              if (posix_memalign((void **)&data_key, 64, VERUS_KEY_SIZE + 1024) != 0 || !data_key)
              {
                  return 0;
              }'''
          )

          # More stack alignment safety
          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t  full_data[140 + 3 + 1344] = { 0 };',
              'alignas(16) uint8_t full_data[140 + 3 + 1344] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t nonceSpace[15] = {0};',
              'alignas(16) uint8_t nonceSpace[16] = {0};'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint32_t  vhash[8] = { 0 };',
              'alignas(16) uint32_t vhash[8] = { 0 };'
          )

          # Remove an unsafe unaligned uint32_t store at nonceSpace+11
          replace_once(
              'verus/armv7/verusscan.cpp',
              '((uint32_t *)(&nonceSpace[11]))[0] = nonce_buf;',
              'memcpy(&nonceSpace[11], &nonce_buf, sizeof(nonce_buf));'
          )

          # ------------------------------------------------------------
          # 3. Hardware AES for Haraka
          # ------------------------------------------------------------
          p = Path('verus/armv7/haraka_portable.c')
          s = p.read_text()

          start = s.index('void aesenc(unsigned char *s, const unsigned char *rk)')
          end = s.index('\n// Simulate _mm_unpacklo_epi32', start)

          hw_aes = r'''void aesenc(unsigned char *s, const unsigned char *rk)
          {
              uint8x16_t state = vld1q_u8((const uint8_t *)s);
              const uint8x16_t zero = vdupq_n_u8(0);

              state = vaeseq_u8(state, zero);
              state = vaesmcq_u8(state);
              state = veorq_u8(
                  state,
                  vld1q_u8((const uint8_t *)rk)
              );

              vst1q_u8((uint8_t *)s, state);
          }
          '''

          p.write_text(s[:start] + hw_aes + s[end:])

          # ------------------------------------------------------------
          # 4. Haraka temporary-vector alignment fixes
          # ------------------------------------------------------------
          p = Path('verus/armv7/haraka_portable.h')
          s = p.read_text()

          unsafe = 'return *(__m128i *)result;'

          if s.count(unsafe) != 2:
              raise SystemExit(
                  f'Expected 2 unsafe Haraka vector returns, found {s.count(unsafe)}'
              )

          s = s.replace(
              unsafe,
              '''__m128i out;
              memcpy(&out, result, sizeof(out));
              return out;'''
          )

          p.write_text(s)

          # ------------------------------------------------------------
          # 5. CLHash SIGBUS fixes
          #
          # IMPORTANT:
          # We retain the proven software clmul64 in this V2 because
          # Android NDK AArch32 does not expose vmull_p64 the way A64 does.
          # PMULL will be added later with dedicated ARM32 assembly.
          # ------------------------------------------------------------
          p = Path('verus/armv7/verus_clhash_portable.cpp')
          s = p.read_text()

          unsafe = 'return *(__m128i *)result;'

          if s.count(unsafe) != 3:
              raise SystemExit(
                  f'Expected 3 unsafe CLHash vector returns, found {s.count(unsafe)}'
              )

          s = s.replace(
              unsafe,
              '''__m128i out;
              memcpy(&out, result, sizeof(out));
              return out;'''
          )

          # ------------------------------------------------------------
          # 6. Force unaligned-safe NEON loads
          # ------------------------------------------------------------
          start = s.index('__m128i _mm_load_si128_emu(const void *p)')
          end = s.index('\n void _mm_store_si128_emu', start)

          safe_load = r'''__m128i _mm_load_si128_emu(const void *p)
          {
              return vreinterpretq_m128i_u8(
                  vld1q_u8((const uint8_t *)p)
              );
          }
          '''

          s = s[:start] + safe_load + s[end:]

          # ------------------------------------------------------------
          # 7. Force unaligned-safe NEON stores
          # ------------------------------------------------------------
          start = s.index('void _mm_store_si128_emu(void *p, __m128i val)')
          end = s.index('\n__m128i _mm_shuffle_epi8_emu', start)

          safe_store = r'''void _mm_store_si128_emu(void *p, __m128i val)
          {
              vst1q_u8(
                  (uint8_t *)p,
                  vreinterpretq_u8_m128i(val)
              );
          }
          '''

          s = s[:start] + safe_store + s[end:]

          p.write_text(s)

          print('=================================')
          print('FireStick A55 OPT AlignFix V2')
          print('=================================')
          print('Cortex-A55 tune       : ENABLED')
          print('ARMv8 crypto          : ENABLED')
          print('Hardware AES          : ENABLED')
          print('NEON                   : ENABLED')
          print('CLMUL                  : SOFTWARE SAFE VERSION')
          print('data_key alignment     : 64 bytes')
          print('blockhash alignment    : 32 bytes')
          print('stack buffer alignment : ENABLED')
          print('safe NEON load/store   : ENABLED')
          print('unsafe vector casts    : REMOVED')
          PY

      - name: Verify patches
        shell: bash
        run: |
          set -e

          echo "===== FLAGS ====="
          grep -n "SHARED_CPPFLAGS" Makefile.am

          echo "===== A55 ====="
          grep -n "cortex-a55" Makefile.am

          echo "===== AES ====="
          grep -n "vaeseq_u8" verus/armv7/haraka_portable.c
          grep -n "vaesmcq_u8" verus/armv7/haraka_portable.c

          echo "===== ALIGNMENT ====="
          grep -n "alignas" verus/armv7/verusscan.cpp
          grep -n "posix_memalign" verus/armv7/verusscan.cpp

          echo "===== SAFE LOADS ====="
          grep -n "vld1q_u8" verus/armv7/verus_clhash_portable.cpp

          echo "===== SOFTWARE CLMUL ====="
          grep -n "clmul64" verus/armv7/verus_clhash_portable.cpp | head

      - name: Make Android script executable
        run: chmod +x scripts/build-android-ccminer.sh

      - name: Build Android image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t ccminer-firestick-a55-alignfix-v2 \
            -f build.Dockerfile \
            .

      - name: Build armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-output
          mkdir -p build-output

          docker run --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-alignfix-v2 \
            arm

          echo "===== OUTPUT FILES ====="
          find build-output -maxdepth 4 -type f -print

          echo "===== BUILD LOG END ====="
          tail -n 150 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log

          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer

      - name: Prepare unique package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          BIN="build-output/ccminer-armeabi-v7a/bin"

          cp "$BIN/ccminer" \
            dist/ccminer-a55-alignfix-v2

          if [ -f "$BIN/libc++_shared.so" ]; then
            cp "$BIN/libc++_shared.so" dist/
          fi

          if [ -f "$BIN/libomp.so" ]; then
            cp "$BIN/libomp.so" dist/
          fi

          chmod +x dist/ccminer-a55-alignfix-v2

          cat > dist/BUILDINFO.txt <<EOF
          Build: FireStick A55 OPT AlignFix V2
          Source: 7f30d6bfb64d0f3ba010191c5a185016ba46f454
          ABI: armeabi-v7a
          Android API: 23
          CPU: Cortex-A55
          ISA: ARMv8-A crypto / AArch32
          AES: hardware
          CLMUL: software safe implementation
          Main buffer alignment: 32 bytes
          data_key alignment: 64 bytes
          safe unaligned NEON load/store: yes
          EOF

          echo "===== BINARY ====="
          file dist/ccminer-a55-alignfix-v2

          echo "===== HASHES ====="
          sha256sum dist/* | tee dist/SHA256SUMS.txt

      - name: Upload Fire Stick artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestick-a55-alignfix-v2-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
