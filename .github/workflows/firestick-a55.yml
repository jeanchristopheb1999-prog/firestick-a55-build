name: FireStick A55 FASTMOD V10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==============================================================
      # GET EXACT HISTORICAL V8 WORKFLOW
      # ==============================================================

      - name: Checkout exact V8 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 6cf06bdd8f85afef8793180e6dd68b4a1a4fd9f0
          path: v8-base


      # ==============================================================
      # GET PINNED CCMINER SOURCE
      # ==============================================================

      - name: Checkout pinned ccminer ARM source
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454
          path: src


      # ==============================================================
      # REPLAY THE EXACT V8 CHAMPION PATCH
      # ==============================================================

      - name: Rebuild exact V8 champion base
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path
          import textwrap


          workflow = Path(
              '../v8-base/.github/workflows/firestick-a55.yml'
          ).read_text()


          lines = workflow.splitlines()


          start = None

          for i, line in enumerate(lines):
              if line.strip() == "python3 - <<'PY'":
                  start = i + 1
                  break


          if start is None:
              raise SystemExit(
                  'Could not find historical V8 Python patch'
              )


          end = None

          for i in range(start, len(lines)):
              if lines[i].strip() == 'PY':
                  end = i
                  break


          if end is None:
              raise SystemExit(
                  'Could not find end of historical V8 patch'
              )


          patch_code = textwrap.dedent(
              '\n'.join(
                  lines[start:end]
              )
          )


          print(
              '======================================'
          )

          print(
              'REPLAY EXACT V8 CHAMPION'
          )

          print(
              '6cf06bdd8f85afef8793180e6dd68b4a1a4fd9f0'
          )

          print(
              '======================================'
          )


          exec(
              compile(
                  patch_code,
                  'historical-v8-patch.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          print(
              'V8 champion patch replay: PASS'
          )
          PY


      # ==============================================================
      # FASTMOD V10
      # ==============================================================

      - name: Patch FASTMOD V10
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path


          p = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          )

          s = p.read_text()


          # ==========================================================
          # EXACT AARCH32 64/32 REMAINDER
          #
          # Replaces:
          #
          #     int64_t % int32_t
          #
          # which normally pulls in __aeabi_ldivmod on ARM32.
          #
          # The A55 has native 32-bit UDIV.
          #
          # We perform:
          #
          #     unsigned 64 / unsigned 32 remainder
          #
          # using native 32-bit UDIV, then restore the signed
          # C/C++ remainder sign.
          #
          # No float.
          # No reciprocal approximation.
          # Exact integer result.
          # ==========================================================

          helper = r'''

          // ==========================================================
          // A55 FASTMOD V10
          // ==========================================================

          typedef struct
          {
              uint32_t d;
              uint32_t shift;
              uint32_t vn;
              uint32_t vn1;
              uint32_t vn0;

          } v10_div32_ctx;


          static inline
          __attribute__((always_inline))
          uint32_t v10_udiv32(
              uint32_t numerator,
              uint32_t denominator
          )
          {
              uint32_t quotient;


              __asm__ volatile(
                  "udiv %0, %1, %2"
                  : "=r"(quotient)
                  : "r"(numerator),
                    "r"(denominator)
              );


              return quotient;
          }


          static inline
          __attribute__((always_inline))
          uint32_t v10_umod32(
              uint32_t numerator,
              uint32_t denominator
          )
          {
              const uint32_t quotient =
                  v10_udiv32(
                      numerator,
                      denominator
                  );


              return
                  numerator -
                  quotient * denominator;
          }


          static inline
          __attribute__((always_inline))
          v10_div32_ctx v10_make_div32_ctx(
              int32_t divisor
          )
          {
              v10_div32_ctx ctx;


              const uint32_t raw =
                  (uint32_t)divisor;


              ctx.d =
                  divisor < 0
                      ? (uint32_t)(
                            0u - raw
                        )
                      : raw;


              ctx.shift =
                  (uint32_t)
                  __builtin_clz(
                      ctx.d
                  );


              ctx.vn =
                  ctx.d <<
                  ctx.shift;


              ctx.vn1 =
                  ctx.vn >>
                  16;


              ctx.vn0 =
                  ctx.vn &
                  0xffffu;


              return ctx;
          }


          static inline
          __attribute__((always_inline))
          uint32_t v10_umod64_ctx(
              uint64_t numerator,
              const v10_div32_ctx *ctx
          )
          {
              const uint32_t d =
                  ctx->d;


              if (__builtin_expect(
                      d == 1u,
                      0
                  ))
              {
                  return 0u;
              }


              uint32_t u1 =
                  (uint32_t)(
                      numerator >>
                      32
                  );


              const uint32_t u0 =
                  (uint32_t)numerator;


              // Reduce high half first.
              if (u1 >= d)
              {
                  u1 =
                      v10_umod32(
                          u1,
                          d
                      );
              }


              // Fast path when remaining value is 32-bit.
              if (__builtin_expect(
                      u1 == 0u,
                      0
                  ))
              {
                  return
                      v10_umod32(
                          u0,
                          d
                      );
              }


              // ------------------------------------------------------
              // Exact normalized 64/32 division in base 2^16.
              // ------------------------------------------------------

              const uint32_t shift =
                  ctx->shift;


              uint32_t un32;
              uint32_t un10;


              if (shift != 0u)
              {
                  un32 =
                      (u1 << shift) |
                      (
                          u0 >>
                          (
                              32u -
                              shift
                          )
                      );


                  un10 =
                      u0 <<
                      shift;
              }
              else
              {
                  un32 =
                      u1;


                  un10 =
                      u0;
              }


              const uint32_t un1 =
                  un10 >>
                  16;


              const uint32_t un0 =
                  un10 &
                  0xffffu;


              const uint32_t vn =
                  ctx->vn;


              const uint32_t vn1 =
                  ctx->vn1;


              const uint32_t vn0 =
                  ctx->vn0;


              // ------------------------------------------------------
              // Quotient digit #1
              // ------------------------------------------------------

              uint32_t q1 =
                  v10_udiv32(
                      un32,
                      vn1
                  );


              uint32_t rhat =
                  un32 -
                  q1 * vn1;


              while (
                  q1 >= 0x10000u ||
                  q1 * vn0 >
                      (
                          (rhat << 16) +
                          un1
                      )
              )
              {
                  --q1;


                  rhat +=
                      vn1;


                  if (
                      rhat >=
                      0x10000u
                  )
                  {
                      break;
                  }
              }


              const uint32_t un21 =
                  (un32 << 16) +
                  un1 -
                  q1 * vn;


              // ------------------------------------------------------
              // Quotient digit #2
              // ------------------------------------------------------

              uint32_t q0 =
                  v10_udiv32(
                      un21,
                      vn1
                  );


              rhat =
                  un21 -
                  q0 * vn1;


              while (
                  q0 >= 0x10000u ||
                  q0 * vn0 >
                      (
                          (rhat << 16) +
                          un0
                      )
              )
              {
                  --q0;


                  rhat +=
                      vn1;


                  if (
                      rhat >=
                      0x10000u
                  )
                  {
                      break;
                  }
              }


              const uint32_t rem_normalized =
                  (un21 << 16) +
                  un0 -
                  q0 * vn;


              return
                  rem_normalized >>
                  shift;
          }


          static inline
          __attribute__((always_inline))
          int32_t v10_smod64(
              int64_t dividend,
              int32_t divisor
          )
          {
              const v10_div32_ctx ctx =
                  v10_make_div32_ctx(
                      divisor
                  );


              const uint64_t raw =
                  (uint64_t)dividend;


              const int negative =
                  dividend < 0;


              // Unsigned two's complement magnitude.
              // Handles INT64_MIN correctly.
              const uint64_t magnitude =
                  negative
                      ? (~raw + 1ULL)
                      : raw;


              const uint32_t remainder =
                  v10_umod64_ctx(
                      magnitude,
                      &ctx
                  );


              const int32_t signed_remainder =
                  (int32_t)remainder;


              // C remainder follows dividend sign.
              return
                  negative
                      ? -signed_remainder
                      : signed_remainder;
          }


          '''


          marker = (
              '__m128i '
              '__verusclmulwithoutreduction64alignedrepeat_v2_1'
          )


          if marker not in s:
              raise SystemExit(
                  'V2.1 CLHash function marker not found'
              )


          insert_at = s.index(
              marker
          )


          s = (
              s[:insert_at] +
              helper +
              s[insert_at:]
          )


          # ==========================================================
          # ROBUST MODULO REPLACEMENT
          #
          # No whitespace-sensitive block matching.
          #
          # There are exactly four occurrences in the pinned source:
          #
          # v2.1:
          #   case 0x0c
          #   case 0x18
          #
          # compatibility implementation:
          #   case 0x0c
          #   case 0x18
          # ==========================================================

          original_mod = (
              'const __m128i modulo = '
              '_mm_cvtsi32_si128_emu('
              'dividend % divisor);'
          )


          count = s.count(
              original_mod
          )


          print(
              'Original 64-bit modulo sites:',
              count
          )


          if count != 4:
              raise SystemExit(
                  'Expected exactly 4 modulo sites, found '
                  + str(count)
              )


          replacement_mod = '''const int32_t v10_remainder =
                    v10_smod64(
                        dividend,
                        divisor
                    );

                const __m128i modulo =
                    _mm_cvtsi32_si128_emu(
                        (uint32_t)v10_remainder
                    );'''


          s = s.replace(
              original_mod,
              replacement_mod
          )


          if (
              'dividend % divisor'
              in s
          ):
              raise SystemExit(
                  'Original 64-bit modulo still present'
              )


          if (
              s.count(
                  'v10_smod64('
              ) < 5
          ):
              raise SystemExit(
                  'FASTMOD call count sanity check failed'
              )


          p.write_text(s)


          # ==========================================================
          # BUILD IDENTIFIER
          # ==========================================================

          p = Path(
              'api.cpp'
          )


          api = p.read_text()


          old_id = (
              'BUILD=A55-HOTPATH-V8'
          )


          if old_id not in api:
              raise SystemExit(
                  'Historical V8 BUILD ID not found'
              )


          api = api.replace(
              old_id,
              'BUILD=A55-FASTMOD-V10',
              1
          )


          p.write_text(
              api
          )


          print(
              '======================================'
          )

          print(
              'A55 FASTMOD V10 PATCHED'
          )

          print(
              '======================================'
          )

          print(
              'Base                 : exact V8'
          )

          print(
              'V9 changes           : NONE'
          )

          print(
              '64/32 remainder      : native 32-bit UDIV'
          )

          print(
              'Modulo sites replaced:',
              count
          )

          print(
              'BUILD=A55-FASTMOD-V10'
          )

          PY


      # ==============================================================
      # VERIFY SOURCE
      # ==============================================================

      - name: Verify FASTMOD V10 source
        shell: bash
        run: |
          set -euo pipefail

          cd src


          echo "===== V10 BUILD ID ====="

          grep -n \
            "A55-FASTMOD-V10" \
            api.cpp


          echo "===== UDIV ====="

          grep -n \
            '"udiv %0, %1, %2"' \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== FASTMOD CALLS ====="

          grep -n \
            "v10_smod64" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== CHECK OLD MODULO ====="

          if grep -n \
            "dividend % divisor" \
            verus/armv7/verus_clhash_portable.cpp
          then
              echo \
                "ERROR: original 64-bit modulo survived"

              exit 1
          else
              echo \
                "PASS: old 64-bit modulo removed"
          fi


          echo "===== V8 AES ====="

          grep -n \
            "v8_aesenc_vec" \
            verus/armv7/haraka_portable.h


          echo "===== V8 PMULL ====="

          grep -n \
            "vmull.p64" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== V8 VQRDMULH ====="

          grep -n \
            "vqrdmulhq_s16" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== V8 PARTIAL HARAKA ====="

          grep -n \
            "v8_haraka512_word7" \
            verus/armv7/verusscan.cpp


      # ==============================================================
      # MATH TEST
      # ==============================================================

      - name: Verify FASTMOD semantics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import random


          MASK32 = (
              1 << 32
          ) - 1


          MASK64 = (
              1 << 64
          ) - 1


          def u32(x):
              return (
                  x &
                  MASK32
              )


          def umod32(
              numerator,
              denominator
          ):
              q = (
                  numerator //
                  denominator
              )


              return u32(
                  numerator -
                  q * denominator
              )


          def fast_umod64_32(
              numerator,
              d
          ):
              if d == 1:
                  return 0


              u1 = (
                  numerator >>
                  32
              ) & MASK32


              u0 = (
                  numerator &
                  MASK32
              )


              if u1 >= d:
                  u1 = umod32(
                      u1,
                      d
                  )


              if u1 == 0:
                  return umod32(
                      u0,
                      d
                  )


              shift = (
                  32 -
                  d.bit_length()
              )


              vn = u32(
                  d <<
                  shift
              )


              vn1 = (
                  vn >>
                  16
              )


              vn0 = (
                  vn &
                  0xffff
              )


              if shift:
                  un32 = u32(
                      (
                          u1 <<
                          shift
                      ) |
                      (
                          u0 >>
                          (
                              32 -
                              shift
                          )
                      )
                  )


                  un10 = u32(
                      u0 <<
                      shift
                  )
              else:
                  un32 = u1
                  un10 = u0


              un1 = (
                  un10 >>
                  16
              )


              un0 = (
                  un10 &
                  0xffff
              )


              q1 = (
                  un32 //
                  vn1
              )


              rhat = u32(
                  un32 -
                  q1 * vn1
              )


              while (
                  q1 >= 0x10000 or
                  q1 * vn0 >
                      (
                          (rhat << 16) +
                          un1
                      )
              ):
                  q1 = u32(
                      q1 - 1
                  )


                  rhat = u32(
                      rhat +
                      vn1
                  )


                  if rhat >= 0x10000:
                      break


              un21 = u32(
                  (
                      un32 <<
                      16
                  ) +
                  un1 -
                  q1 * vn
              )


              q0 = (
                  un21 //
                  vn1
              )


              rhat = u32(
                  un21 -
                  q0 * vn1
              )


              while (
                  q0 >= 0x10000 or
                  q0 * vn0 >
                      (
                          (rhat << 16) +
                          un0
                      )
              ):
                  q0 = u32(
                      q0 - 1
                  )


                  rhat = u32(
                      rhat +
                      vn1
                  )


                  if rhat >= 0x10000:
                      break


              rem_normalized = u32(
                  (
                      un21 <<
                      16
                  ) +
                  un0 -
                  q0 * vn
              )


              return (
                  rem_normalized >>
                  shift
              )


          def c_remainder(
              dividend,
              divisor
          ):
              q = (
                  abs(dividend) //
                  abs(divisor)
              )


              if (
                  (dividend < 0) !=
                  (divisor < 0)
              ):
                  q = -q


              return (
                  dividend -
                  q * divisor
              )


          def fast_signed_mod(
              dividend,
              divisor
          ):
              raw = (
                  dividend &
                  MASK64
              )


              magnitude = (
                  ((~raw + 1) & MASK64)
                  if dividend < 0
                  else raw
              )


              d = (
                  -divisor
                  if divisor < 0
                  else divisor
              )


              remainder = (
                  fast_umod64_32(
                      magnitude,
                      d
                  )
              )


              return (
                  -remainder
                  if dividend < 0
                  else remainder
              )


          # ==========================================================
          # EDGE CASES
          # ==========================================================

          dividends = [
              -(1 << 63),
              -(1 << 63) + 1,
              -0x7fffffffffffffff,
              -1234567890123456789,
              -0x100000000,
              -0xffffffff,
              -3,
              -2,
              -1,
              0,
              1,
              2,
              3,
              0xffffffff,
              0x100000000,
              1234567890123456789,
              (1 << 63) - 1,
          ]


          divisors = [
              -(1 << 31),
              -(1 << 31) + 1,
              -2147483647,
              -65536,
              -65535,
              -3,
              -2,
              -1,
              1,
              2,
              3,
              65535,
              65536,
              2147483646,
              2147483647,
          ]


          for dividend in dividends:
              for divisor in divisors:

                  reference = c_remainder(
                      dividend,
                      divisor
                  )


                  result = fast_signed_mod(
                      dividend,
                      divisor
                  )


                  if result != reference:
                      raise SystemExit(
                          'EDGE MISMATCH: '
                          f'{dividend} % {divisor} '
                          f'fast={result} '
                          f'reference={reference}'
                      )


          print(
              'FASTMOD edge cases: PASS'
          )


          # ==========================================================
          # 1,000,000 RANDOM TESTS
          # ==============================================================

          random.seed(
              0xA55F10
          )


          for i in range(
              1000000
          ):
              dividend = random.randint(
                  -(1 << 63),
                  (1 << 63) - 1
              )


              divisor = random.randint(
                  -(1 << 31),
                  (1 << 31) - 1
              )


              if divisor == 0:
                  divisor = 1


              reference = c_remainder(
                  dividend,
                  divisor
              )


              result = fast_signed_mod(
                  dividend,
                  divisor
              )


              if result != reference:
                  raise SystemExit(
                      'RANDOM MISMATCH '
                      f'#{i}: '
                      f'{dividend} % {divisor} '
                      f'fast={result} '
                      f'reference={reference}'
                  )


          print(
              '1,000,000 random FASTMOD tests: PASS'
          )

          print(
              'FASTMOD V10 semantics: PASS'
          )

          PY


      # ==============================================================
      # BUILD
      # ==============================================================

      - name: Make Android build script executable
        shell: bash
        run: |
          set -euo pipefail

          cd src

          chmod +x \
            scripts/build-android-ccminer.sh


      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          cd src

          docker build \
            -t ccminer-firestick-a55-v10 \
            -f build.Dockerfile \
            .


      - name: Build FASTMOD V10 armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            build-output


          mkdir -p \
            build-output


          docker run \
            --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v10 \
            arm


          echo "===== OUTPUT ====="

          find \
            build-output \
            -maxdepth 4 \
            -type f \
            -print


          echo "===== BUILD LOG ====="

          tail -n 300 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log


          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer


      # ==============================================================
      # BINARY INSPECTION
      # ==============================================================

      - name: Inspect FASTMOD V10 binary
        shell: bash
        run: |
          set -euo pipefail

          cd src


          BIN="build-output/ccminer-armeabi-v7a/bin/ccminer"


          echo "===== FILE ====="

          file \
            "$BIN"


          echo "===== BUILD ID ====="

          strings \
            "$BIN" |
            grep \
              "A55-FASTMOD-V10"


          echo "===== DIVISION HELPER ====="

          readelf \
            -Ws \
            "$BIN" |
            grep \
              "__aeabi_ldivmod" ||
            echo \
              "GOOD: __aeabi_ldivmod not linked"


          echo "===== SIZE ====="

          ls -lh \
            "$BIN"


      # ==============================================================
      # PACKAGE
      # ==============================================================

      - name: Prepare FASTMOD V10 package
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            dist


          mkdir -p \
            dist


          BIN="build-output/ccminer-armeabi-v7a/bin"


          cp \
            "$BIN/ccminer" \
            dist/ccminer-a55-fastmod-v10


          if test -f "$BIN/libc++_shared.so"
          then
              cp \
                "$BIN/libc++_shared.so" \
                dist/
          fi


          if test -f "$BIN/libomp.so"
          then
              cp \
                "$BIN/libomp.so" \
                dist/
          fi


          chmod +x \
            dist/ccminer-a55-fastmod-v10


          cat > dist/BUILDINFO.txt <<EOF
          Build:
          A55-FASTMOD-V10

          Base:
          Exact A55-HOTPATH-V8 champion

          Historical V8 workflow:
          6cf06bdd8f85afef8793180e6dd68b4a1a4fd9f0

          ccminer source:
          7f30d6bfb64d0f3ba010191c5a185016ba46f454

          ABI:
          armeabi-v7a / AArch32

          CPU:
          Cortex-A55

          V8 measured baseline:
          approximately 679 kH/s

          V9 modifications:
          NOT INCLUDED

          Hardware AES:
          preserved

          Hardware PMULL:
          preserved

          VQRDMULH:
          preserved

          NEON VTBL:
          preserved

          Partial Haraka:
          preserved

          Haraka hot path:
          34 AES operations

          Runtime self-test:
          preserved

          Full candidate replay:
          preserved

          New optimization:
          exact AArch32 FASTMOD

          int64 % int32 CLHash sites:
          replaced

          Native UDIV:
          32-bit

          Floating point:
          not used

          Approximate division:
          not used

          Semantic validation:
          1,000,000 random tests plus edge cases

          API:
          BUILD=A55-FASTMOD-V10
          EOF


          echo "===== SHA256 ====="

          sha256sum \
            dist/* |
            tee \
              dist/SHA256SUMS.txt


      # ==============================================================
      # UPLOAD
      # ==============================================================

      - name: Upload FASTMOD V10 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestick-a55-fastmod-v10-${{ github.run_number }}
          path: src/dist/
          if-no-files-found: error
          retention-days: 30
