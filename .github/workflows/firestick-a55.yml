name: FireStick A55 SHADOWKEY V13

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==============================================================
      # BASES EXACTES
      # ==============================================================

      - name: Checkout exact V8 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 6cf06bdd8f85afef8793180e6dd68b4a1a4fd9f0
          path: v8-base

      - name: Checkout exact V10 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 73446a48e954bcc579c302d5a01e3dfb71b2bd30
          path: v10-base

      - name: Checkout V11 development base
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 7f92ff0f8788f54781704ce8414915584450bd78
          path: v11-base

      - name: Checkout exact V11 builder
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: c98f006a974ccee5be50ea5982311c05774432bc
          path: v11-builder

      - name: Checkout V12 source base
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 50ac3037b54d6f045e534af8b04a2ddf571ae844
          path: v12-base

      - name: Checkout exact V12 35 builder
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 5f9aa55a96369f8da93561e0c839ed81bc3e15c2
          path: v12-builder

      # V13 #36:
      # le patch SHADOWKEY et son modèle ont déjà PASSÉ.
      - name: Checkout proven V13 36
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 3d9da4b5b0a837975e23c1ef38c37e28b04331f7
          path: v13-base

      - name: Checkout pinned ccminer
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454
          path: src


      # ==============================================================
      # REJOUE EXACTEMENT LE V13 #36
      # ==============================================================

      - name: Replay proven V13 36
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path
          import textwrap


          wf = Path(
              '../v13-base/.github/workflows/firestick-a55.yml'
          ).read_text()


          lines = wf.splitlines()
          blocks = []

          i = 0

          while i < len(lines):

              if lines[i].strip() == "python3 - <<'PY'":

                  start = i + 1
                  end = None

                  for j in range(start, len(lines)):

                      if lines[j].strip() == 'PY':
                          end = j
                          break

                  if end is None:
                      raise SystemExit(
                          'Unterminated V13 block'
                      )

                  blocks.append(
                      textwrap.dedent(
                          '\n'.join(
                              lines[start:end]
                          )
                      )
                  )

                  i = end + 1

              else:
                  i += 1


          if len(blocks) != 3:

              raise SystemExit(
                  'Expected 3 V13 blocks, found '
                  + str(len(blocks))
              )


          print('==============================')
          print('REPLAY V12 #35')
          print('==============================')


          exec(
              compile(
                  blocks[0],
                  'v13-v12-base.py',
                  'exec'
              ),
              {
                  '__name__': '__main__'
              }
          )


          print('==============================')
          print('REPLAY SHADOWKEY V13')
          print('==============================')


          exec(
              compile(
                  blocks[1],
                  'v13-shadowkey.py',
                  'exec'
              ),
              {
                  '__name__': '__main__'
              }
          )


          print('==============================')
          print('REPLAY V13 MODEL')
          print('==============================')


          exec(
              compile(
                  blocks[2],
                  'v13-model.py',
                  'exec'
              ),
              {
                  '__name__': '__main__'
              }
          )


          api = Path(
              'api.cpp'
          ).read_text()


          if 'BUILD=A55-SHADOWKEY-V13' not in api:

              raise SystemExit(
                  'V13 replay failed'
              )


          print('==============================')
          print('V13 #36 REPLAY: PASS')
          print('==============================')

          PY


      # ==============================================================
      # CORRECTIONS STRUCTURELLES
      # ==============================================================

      - name: Repair V13 compile issues
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path
          import re


          # ==========================================================
          # FIX A
          #
          # Le V13 #36 avait inséré la copie immutable après
          # la DEFINITION de GenNewCLKey au lieu de son APPEL.
          #
          # On supprime toute copie existante et on en place
          # exactement une dans scanhash_verus après l'appel réel.
          # ==========================================================

          scan_path = Path(
              'verus/armv7/verusscan.cpp'
          )


          scan = scan_path.read_text()


          copy_regex = re.compile(
              r'\s*memcpy\s*\(\s*'
              r'data_key_base\s*,\s*'
              r'data_key\s*,\s*'
              r'VERUS_KEY_SIZE\s*'
              r'\)\s*;',
              re.MULTILINE
          )


          scan, removed = copy_regex.subn(
              '',
              scan
          )


          print(
              'Old base-key copies removed:',
              removed
          )


          if removed < 1:

              raise SystemExit(
                  'No V13 base-key memcpy found'
              )


          scan_func = scan.index(
              'extern "C" int scanhash_verus'
          )


          gen_call = scan.index(
              'GenNewCLKey(',
              scan_func
          )


          gen_end = scan.index(
              ';',
              gen_call
          ) + 1


          immutable_copy = '''

              // V13 immutable pristine CLHash key.
              memcpy(
                  data_key_base,
                  data_key,
                  VERUS_KEY_SIZE
              );
          '''


          scan = (
              scan[:gen_end]
              + immutable_copy
              + scan[gen_end:]
          )


          scan_path.write_text(
              scan
          )


          # ==========================================================
          # ROBUST VALIDATION — NO WHITESPACE ASSUMPTIONS
          # ==========================================================

          scan = scan_path.read_text()


          matches = list(
              copy_regex.finditer(
                  scan
              )
          )


          if len(matches) != 1:

              raise SystemExit(
                  'Expected exactly one final base-key copy, found '
                  + str(len(matches))
              )


          final_copy_pos = matches[0].start()


          scan_func = scan.index(
              'extern "C" int scanhash_verus'
          )


          gen_call = scan.index(
              'GenNewCLKey(',
              scan_func
          )


          if final_copy_pos <= scan_func:

              raise SystemExit(
                  'Base-key copy outside scanhash'
              )


          if final_copy_pos <= gen_call:

              raise SystemExit(
                  'Base-key copy before GenNewCLKey call'
              )


          data_key_base_pos = scan.index(
              'data_key_base',
              scan_func
          )


          if data_key_base_pos >= final_copy_pos:

              raise SystemExit(
                  'data_key_base declared too late'
              )


          print(
              'FIX A PASS: immutable key copy correctly placed'
          )


          # ==========================================================
          # FIX B
          #
          # verus_clhash_portable.cpp appelle verusclhashv2_2
          # avant sa définition.
          #
          # Utilise le VRAI header, qui contient déjà son prototype.
          # ==========================================================

          cl_path = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          )


          cl = cl_path.read_text()


          include_line = (
              '#include "verus_clhash.h"'
          )


          if include_line not in cl:

              marker = (
                  '#include "haraka_portable.h"'
              )


              if marker not in cl:

                  raise SystemExit(
                      'haraka include marker missing'
                  )


              cl = cl.replace(
                  marker,
                  marker
                  + '\n'
                  + include_line,
                  1
              )


          print(
              'FIX B PASS: verus_clhash.h included'
          )


          # ==========================================================
          # FIX C
          #
          # Le wrapper V13 appelle le core shadow avant sa définition.
          # Ajoute seulement le prototype interne nécessaire.
          # ==========================================================

          wrapper_token = (
              'uint64_t verusclhashv13_shadow('
          )


          wrapper_pos = cl.index(
              wrapper_token
          )


          # Trouve le "extern C" qui appartient au wrapper,
          # seulement s'il est vraiment juste devant.
          extern_pos = cl.rfind(
              'extern "C"',
              0,
              wrapper_pos
          )


          if (
              extern_pos >= 0
              and
              wrapper_pos - extern_pos < 100
          ):
              insert_pos = extern_pos
          else:
              insert_pos = wrapper_pos


          prototype = r'''

          // ==========================================================
          // SHADOWKEY V13 INTERNAL FORWARD DECLARATION
          // ==========================================================

          static __m128i
          __verusclmulwithoutreduction64alignedrepeat_v13_shadow(
              __m128i *randomsource,
              const __m128i buf[4],
              uint64_t keyMask,
              uint16_t * __restrict v13_idx_a,
              uint16_t * __restrict v13_idx_b
          );


          '''


          # Do not duplicate on accidental rerun.
          prefix = cl[:wrapper_pos]


          if (
              '__verusclmulwithoutreduction64alignedrepeat_v13_shadow('
              not in prefix
          ):

              cl = (
                  cl[:insert_pos]
                  + prototype
                  + cl[insert_pos:]
              )


          cl_path.write_text(
              cl
          )


          print(
              'FIX C PASS: shadow core forward declared'
          )


          # ==========================================================
          # FINAL STRUCTURAL PREFLIGHT
          # ==========================================================

          cl = cl_path.read_text()


          if (
              '#include "verus_clhash.h"'
              not in cl
          ):
              raise SystemExit(
                  'verus_clhash.h missing'
              )


          wrapper_pos = cl.index(
              'uint64_t verusclhashv13_shadow('
          )


          proto_pos = cl.index(
              '__verusclmulwithoutreduction64alignedrepeat_v13_shadow('
          )


          if proto_pos >= wrapper_pos:

              raise SystemExit(
                  'Shadow prototype still after wrapper'
              )


          shadow_count = cl.count(
              '__verusclmulwithoutreduction64alignedrepeat_v13_shadow('
          )


          # prototype + wrapper call + actual definition
          if shadow_count < 3:

              raise SystemExit(
                  'Shadow symbol count too low: '
                  + str(shadow_count)
              )


          # Ensure public v2.2 prototype now exists before wrapper
          header = Path(
              'verus/armv7/verus_clhash.h'
          ).read_text()


          if (
              'uint64_t verusclhashv2_2('
              not in header
          ):

              raise SystemExit(
                  'verusclhashv2_2 prototype missing from header'
              )


          if (
              'BUILD=A55-SHADOWKEY-V13'
              not in
              Path('api.cpp').read_text()
          ):

              raise SystemExit(
                  'V13 BUILD ID missing'
              )


          print('==============================')
          print('V13 STRUCTURAL PREFLIGHT PASS')
          print('==============================')
          print('immutable copy      : PASS')
          print('v2.2 declaration    : PASS')
          print('shadow declaration  : PASS')
          print('BUILD V13           : PASS')

          PY


      # ==============================================================
      # SOURCE VISIBILITY
      # ==============================================================

      - name: Show corrected V13 source
        shell: bash
        run: |
          set -euo pipefail

          cd src

          echo "===== BUILD ====="
          grep -n \
            "A55-SHADOWKEY-V13" \
            api.cpp

          echo "===== HEADER INCLUDE ====="
          grep -n \
            'verus_clhash.h' \
            verus/armv7/verus_clhash_portable.cpp

          echo "===== BASE KEY ====="
          grep -n \
            "data_key_base" \
            verus/armv7/verusscan.cpp

          echo "===== GEN KEY ====="
          grep -n \
            "GenNewCLKey" \
            verus/armv7/verusscan.cpp

          echo "===== SHADOW CORE ====="
          grep -n \
            "__verusclmulwithoutreduction64alignedrepeat_v13_shadow" \
            verus/armv7/verus_clhash_portable.cpp

          echo "===== V13 WRAPPER ====="
          grep -n \
            "verusclhashv13_shadow" \
            verus/armv7/verus_clhash_portable.cpp

          echo "===== RESTORE ====="
          grep -n \
            "verusclhashv13_restore" \
            verus/armv7/verus_clhash_portable.cpp

          echo "===== UINT16 LOG ====="
          grep -n \
            "v13_idx_" \
            verus/armv7/verusscan.cpp


      # ==============================================================
      # BUILD IMAGE
      # ==============================================================

      - name: Make build script executable
        shell: bash
        run: |
          set -euo pipefail

          cd src

          chmod +x \
            scripts/build-android-ccminer.sh


      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          cd src

          docker build \
            -t ccminer-firestick-a55-v13 \
            -f build.Dockerfile \
            .


      # ==============================================================
      # ACTUAL ARM32 COMPILE
      # ==============================================================

      - name: Build SHADOWKEY V13 armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          cd src

          rm -rf \
            build-output

          mkdir -p \
            build-output


          docker run \
            --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v13 \
            arm


          echo "===== OUTPUT ====="

          find \
            build-output \
            -maxdepth 4 \
            -type f \
            -print


          echo "===== BUILD LOG ====="

          tail -n 600 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log


          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer


      # ==============================================================
      # BINARY CHECK
      # ==============================================================

      - name: Inspect SHADOWKEY V13 binary
        shell: bash
        run: |
          set -euo pipefail

          cd src

          BIN="build-output/ccminer-armeabi-v7a/bin/ccminer"


          echo "===== FILE ====="

          file \
            "$BIN"


          echo "===== BUILD ID ====="

          strings \
            "$BIN" |
            grep \
              "A55-SHADOWKEY-V13"


          echo "===== SIZE ====="

          ls -lh \
            "$BIN"


          echo "===== AEABI LDIVMOD ====="

          readelf \
            -Ws \
            "$BIN" |
            grep \
              "__aeabi_ldivmod" ||
            true


      # ==============================================================
      # PACKAGE
      # ==============================================================

      - name: Prepare SHADOWKEY V13 package
        shell: bash
        run: |
          set -euo pipefail

          cd src

          rm -rf \
            dist

          mkdir -p \
            dist


          BIN="build-output/ccminer-armeabi-v7a/bin"


          cp \
            "$BIN/ccminer" \
            dist/ccminer-a55-shadowkey-v13


          if test -f "$BIN/libc++_shared.so"
          then

              cp \
                "$BIN/libc++_shared.so" \
                dist/
          fi


          if test -f "$BIN/libomp.so"
          then

              cp \
                "$BIN/libomp.so" \
                dist/
          fi


          chmod +x \
            dist/ccminer-a55-shadowkey-v13


          cat > dist/BUILDINFO.txt <<EOF
          Build:
          A55-SHADOWKEY-V13

          Base:
          exact A55-QCFAST-V12 #35

          V12 builder:
          5f9aa55a96369f8da93561e0c839ed81bc3e15c2

          V13 optimization source:
          run #36
          3d9da4b5b0a837975e23c1ef38c37e28b04331f7

          ABI:
          armeabi-v7a / AArch32

          CPU:
          Cortex-A55

          V12 measured baseline:
          approximately 1.26 MH/s

          V10 FASTMOD:
          preserved

          V11 HOTCORE:
          preserved

          V12 QCFAST:
          preserved

          V13 immutable base key:
          enabled

          V13 vector backup stores:
          removed from validated hot path

          V13 touched-index log:
          uint16

          V13 restore:
          from immutable pristine key

          V13 validation:
          intermediate + 40 Haraka round keys

          V13 fallback:
          exact V12

          V13 theoretical bookkeeping:
          3584 bytes/hash -> 2304 bytes/hash

          Compile repair:
          immutable memcpy moved into scanhash
          verus_clhash header imported
          shadow core forward declared

          API:
          BUILD=A55-SHADOWKEY-V13
          EOF


          echo "===== SHA256 ====="

          sha256sum \
            dist/* |
            tee \
              dist/SHA256SUMS.txt


          echo "===== PACKAGE ====="

          ls -lh \
            dist/


      # ==============================================================
      # ARTIFACT
      # ==============================================================

      - name: Upload SHADOWKEY V13 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestick-a55-shadowkey-v13-${{ github.run_number }}
          path: src/dist/
          if-no-files-found: error
          retention-days: 30
