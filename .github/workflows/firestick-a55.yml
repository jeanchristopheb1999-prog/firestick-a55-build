name: FireStick A55 CLHASH V9

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pinned ccminer ARM source
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454

      - name: Patch FireStick A55 V9
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re


          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()

              if old not in s:
                  raise SystemExit(
                      f'Expected code not found in {path}: {old}'
                  )

              p.write_text(
                  s.replace(old, new, 1)
              )


          # ============================================================
          # CPU TARGET
          # ============================================================

          replace_once(
              'Makefile.am',
              'SHARED_CPPFLAGS += -march=armv7-a -mfpu=neon -mfloat-abi=softfp',
              'SHARED_CPPFLAGS += -march=armv8-a+crypto '
              '-mtune=cortex-a55 '
              '-mfpu=crypto-neon-fp-armv8 '
              '-mfloat-abi=softfp '
              '-fomit-frame-pointer'
          )


          # ============================================================
          # V3 ALIGNMENT / SIGBUS
          # ============================================================

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t _ALIGN(4)  blockhash_half[64] = { 0 };',
              'alignas(32) uint8_t blockhash_half[64] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              '__m128i *data_key =  (__m128i*)malloc(VERUS_KEY_SIZE + 1024);',
              '''__m128i *data_key = NULL;
              if (posix_memalign(
                      (void **)&data_key,
                      64,
                      VERUS_KEY_SIZE + 1024
                  ) != 0 || !data_key)
              {
                  return 0;
              }'''
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t  full_data[140 + 3 + 1344] = { 0 };',
              'alignas(16) uint8_t full_data[140 + 3 + 1344] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t nonceSpace[15] = {0};',
              'alignas(16) uint8_t nonceSpace[16] = {0};'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint32_t  vhash[8] = { 0 };',
              'alignas(16) uint32_t vhash[8] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              '((uint32_t *)(&nonceSpace[11]))[0] = nonce_buf;',
              'memcpy(&nonceSpace[11], &nonce_buf, sizeof(nonce_buf));'
          )


          # ============================================================
          # V9 FIXKEY INDEXES
          #
          # keyMask = 511, so indices only require 9 bits.
          # uint16 is exact and halves index traffic.
          # ============================================================

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint32_t fixrand[32];',
              'alignas(64) uint16_t fixrand[32];'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint32_t fixrandex[32];',
              'alignas(64) uint16_t fixrandex[32];'
          )


          # ============================================================
          # CLHASH HEADER -> uint16 FixKey indices
          # ============================================================

          p = Path(
              'verus/armv7/verus_clhash.h'
          )

          s = p.read_text()

          s = re.sub(
              r'uint32_t\s*\*\s*__restrict\s+fixrandex\b',
              'uint16_t *__restrict fixrandex',
              s
          )

          s = re.sub(
              r'uint32_t\s*\*\s*__restrict\s+fixrand\b',
              'uint16_t *__restrict fixrand',
              s
          )

          p.write_text(s)


          # ============================================================
          # HARDWARE AES - FULL HARAKA
          # ============================================================

          p = Path(
              'verus/armv7/haraka_portable.c'
          )

          s = p.read_text()

          start = s.index(
              '// Simulate _mm_aesenc_si128 instructions from AESNI'
          )

          end = s.index(
              '// Simulate _mm_unpacklo_epi32',
              start
          )

          hw_aes = r'''// ARMv8 hardware AES
          void aesenc(
              unsigned char *s,
              const unsigned char *rk
          )
          {
              uint8x16_t state =
                  vld1q_u8(
                      (const uint8_t *)s
                  );

              const uint8x16_t zero =
                  vdupq_n_u8(0);

              state =
                  vaeseq_u8(
                      state,
                      zero
                  );

              state =
                  vaesmcq_u8(
                      state
                  );

              state =
                  veorq_u8(
                      state,
                      vld1q_u8(
                          (const uint8_t *)rk
                      )
                  );

              vst1q_u8(
                  (uint8_t *)s,
                  state
              );
          }


          '''

          p.write_text(
              s[:start] +
              hw_aes +
              s[end:]
          )


          # ============================================================
          # HARAKA HEADER
          # Register AES
          # ============================================================

          p = Path(
              'verus/armv7/haraka_portable.h'
          )

          s = p.read_text()

          start = s.index(
              '//extern void aesenc(unsigned char *s, '
              'const unsigned char *rk);'
          )

          end = s.index(
              '\ntypedef unsigned int uint32_t;',
              start
          )

          fast_aes = r'''// ARMv8 AES
          void aesenc(
              unsigned char *s,
              const unsigned char *rk
          );


          static inline
          __attribute__((always_inline))
          __m128i v9_aesenc_vec(
              __m128i state,
              __m128i round_key
          )
          {
              uint8x16_t v =
                  vreinterpretq_u8_s32(
                      state
                  );

              const uint8x16_t zero =
                  vdupq_n_u8(0);

              v =
                  vaeseq_u8(
                      v,
                      zero
                  );

              v =
                  vaesmcq_u8(
                      v
                  );

              v =
                  veorq_u8(
                      v,
                      vreinterpretq_u8_s32(
                          round_key
                      )
                  );

              return
                  vreinterpretq_s32_u8(
                      v
                  );
          }


          #define AES2_EMU(s0, s1, rci) do { \
              (s0) = v9_aesenc_vec((s0), rc[(rci)]); \
              (s1) = v9_aesenc_vec((s1), rc[(rci) + 1]); \
              (s0) = v9_aesenc_vec((s0), rc[(rci) + 2]); \
              (s1) = v9_aesenc_vec((s1), rc[(rci) + 3]); \
          } while (0)

          '''

          s = (
              s[:start] +
              fast_aes +
              s[end:]
          )

          unsafe = (
              'return *(__m128i *)result;'
          )

          if s.count(unsafe) != 2:
              raise SystemExit(
                  'Unexpected Haraka return count: '
                  + str(s.count(unsafe))
              )

          s = s.replace(
              unsafe,
              'return '
              'vreinterpretq_m128i_u32('
              'vld1q_u32(result));'
          )

          p.write_text(s)


          # ============================================================
          # CLHASH CORE
          # ============================================================

          p = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          )

          s = p.read_text()


          # ------------------------------------------------------------
          # uint16 FixKey indices
          # ------------------------------------------------------------

          s = re.sub(
              r'uint32_t\s*\*\s*__restrict\s+fixrandex\b',
              'uint16_t * __restrict fixrandex',
              s
          )

          s = re.sub(
              r'uint32_t\s*\*\s*__restrict\s+fixrand\b',
              'uint16_t * __restrict fixrand',
              s
          )


          # ------------------------------------------------------------
          # Safe portable vector returns
          # ------------------------------------------------------------

          unsafe = (
              'return *(__m128i *)result;'
          )

          if s.count(unsafe) != 3:
              raise SystemExit(
                  'Unexpected CLHash return count: '
                  + str(s.count(unsafe))
              )

          s = s.replace(
              unsafe,
              '''__m128i out;
              memcpy(&out, result, sizeof(out));
              return out;'''
          )


          # ------------------------------------------------------------
          # Inline cheap helpers
          # ------------------------------------------------------------

          s = s.replace(
              '__m128i _mm_setr_epi8_emu(',
              'static inline '
              '__attribute__((always_inline)) '
              '__m128i _mm_setr_epi8_emu(',
              1
          )

          s = s.replace(
              '__m128i _mm_xor_si128_emu(',
              'static inline '
              '__attribute__((always_inline)) '
              '__m128i _mm_xor_si128_emu(',
              1
          )


          # ------------------------------------------------------------
          # Vector load
          # ------------------------------------------------------------

          start = s.index(
              '__m128i _mm_load_si128_emu(const void *p)'
          )

          end = s.index(
              '\n void _mm_store_si128_emu',
              start
          )

          fast_load = r'''static inline
          __attribute__((always_inline))
          __m128i _mm_load_si128_emu(
              const void *p
          )
          {
              return
                  vreinterpretq_s32_u8(
                      vld1q_u8(
                          (const uint8_t *)p
                      )
                  );
          }
          '''

          s = (
              s[:start] +
              fast_load +
              s[end:]
          )


          # ------------------------------------------------------------
          # Vector store
          # ------------------------------------------------------------

          start = s.index(
              'void _mm_store_si128_emu(void *p, __m128i val)'
          )

          end = s.index(
              '\n__m128i _mm_shuffle_epi8_emu',
              start
          )

          fast_store = r'''static inline
          __attribute__((always_inline))
          void _mm_store_si128_emu(
              void *p,
              __m128i val
          )
          {
              vst1q_u8(
                  (uint8_t *)p,
                  vreinterpretq_u8_s32(
                      val
                  )
              );
          }
          '''

          s = (
              s[:start] +
              fast_store +
              s[end:]
          )


          # ============================================================
          # PSHUFB -> VTBL2
          # ============================================================

          start = s.index(
              '__m128i _mm_shuffle_epi8_emu'
          )

          end = s.index(
              '\n// portable\n'
              '__m128i lazyLengthHash_port',
              start
          )

          neon_shuffle = r'''static inline
          __attribute__((always_inline))
          __m128i _mm_shuffle_epi8_emu(
              __m128i a,
              __m128i b
          )
          {
              const uint8x16_t av =
                  vreinterpretq_u8_s32(a);

              const uint8x16_t bv =
                  vreinterpretq_u8_s32(b);

              uint8x8x2_t table;

              table.val[0] =
                  vget_low_u8(av);

              table.val[1] =
                  vget_high_u8(av);


              uint8x16_t index =
                  vandq_u8(
                      bv,
                      vdupq_n_u8(0x0f)
                  );


              const uint8x16_t zero_mask =
                  vcgeq_u8(
                      bv,
                      vdupq_n_u8(0x80)
                  );


              index =
                  vbslq_u8(
                      zero_mask,
                      vdupq_n_u8(0xff),
                      index
                  );


              const uint8x8_t lo =
                  vtbl2_u8(
                      table,
                      vget_low_u8(index)
                  );

              const uint8x8_t hi =
                  vtbl2_u8(
                      table,
                      vget_high_u8(index)
                  );


              return
                  vreinterpretq_s32_u8(
                      vcombine_u8(
                          lo,
                          hi
                      )
                  );
          }


          // ==========================================================
          // V9 MIX2 -> XOR fusion
          //
          // Original case 0x14 does:
          // MIX2(a,b)
          // acc ^= a
          // acc ^= b
          //
          // V9 computes MIX2(a,b).lo ^ MIX2(a,b).hi directly.
          // ==========================================================

          static inline
          __attribute__((always_inline))
          __m128i v9_mix2_xor(
              __m128i a,
              __m128i b
          )
          {
              const int32x4_t ai =
                  vreinterpretq_s32_m128i(a);

              const int32x4_t bi =
                  vreinterpretq_s32_m128i(b);


              const int32x2x2_t lo =
                  vzip_s32(
                      vget_low_s32(ai),
                      vget_low_s32(bi)
                  );


              const int32x2x2_t hi =
                  vzip_s32(
                      vget_high_s32(ai),
                      vget_high_s32(bi)
                  );


              const int32x4_t mixlo =
                  vcombine_s32(
                      lo.val[0],
                      lo.val[1]
                  );


              const int32x4_t mixhi =
                  vcombine_s32(
                      hi.val[0],
                      hi.val[1]
                  );


              return
                  vreinterpretq_m128i_s32(
                      veorq_s32(
                          mixlo,
                          mixhi
                      )
                  );
          }


          static inline
          __attribute__((always_inline))
          __m128i v9_aes4_mix2_xor(
              __m128i a,
              __m128i b,
              const __m128i *rk
          )
          {
              a =
                  v9_aesenc_vec(
                      a,
                      rk[0]
                  );

              b =
                  v9_aesenc_vec(
                      b,
                      rk[1]
                  );

              a =
                  v9_aesenc_vec(
                      a,
                      rk[2]
                  );

              b =
                  v9_aesenc_vec(
                      b,
                      rk[3]
                  );


              return
                  v9_mix2_xor(
                      a,
                      b
                  );
          }


          // XOR scalar only into low 32-bit lane.
          static inline
          __attribute__((always_inline))
          __m128i v9_xor_low32(
              __m128i acc,
              uint32_t x
          )
          {
              uint32x4_t v =
                  vreinterpretq_u32_m128i(
                      acc
                  );

              v =
                  vsetq_lane_u32(
                      vgetq_lane_u32(
                          v,
                          0
                      ) ^ x,
                      v,
                      0
                  );

              return
                  vreinterpretq_m128i_u32(
                      v
                  );
          }


          '''

          s = (
              s[:start] +
              neon_shuffle +
              s[end:]
          )


          # ============================================================
          # HARDWARE PMULL
          # ============================================================

          start = s.index(
              '__m128i _mm_clmulepi64_si128_emu'
          )

          end = s.index(
              '\n__m128i _mm_mulhrs_epi16_emu',
              start
          )

          pmull = r'''static inline
          __attribute__((always_inline))
          __m128i _mm_clmulepi64_si128_emu(
              const __m128i &a,
              const __m128i &b,
              int imm
          )
          {
              const uint64x2_t av =
                  vreinterpretq_u64_s32(a);

              const uint64x2_t bv =
                  vreinterpretq_u64_s32(b);


              const uint64x1_t va =
                  (imm & 1)
                      ? vget_high_u64(av)
                      : vget_low_u64(av);


              const uint64x1_t vb =
                  (imm & 0x10)
                      ? vget_high_u64(bv)
                      : vget_low_u64(bv);


              uint64x2_t product;


              __asm__ volatile(
                  "vmull.p64 %q0, %P1, %P2"
                  : "=w"(product)
                  : "w"(va),
                    "w"(vb)
              );


              return
                  vreinterpretq_s32_u64(
                      product
                  );
          }
          '''

          s = (
              s[:start] +
              pmull +
              s[end:]
          )


          # ============================================================
          # VQRDMULH
          # ============================================================

          start = s.index(
              '__m128i _mm_mulhrs_epi16_emu'
          )

          end = s.index(
              '__m128i _mm_set_epi64x_emu',
              start
          )

          mulhrs = r'''static inline
          __attribute__((always_inline))
          __m128i _mm_mulhrs_epi16_emu(
              __m128i a,
              __m128i b
          )
          {
              const int16x8_t va =
                  vreinterpretq_s16_s32(a);

              const int16x8_t vb =
                  vreinterpretq_s16_s32(b);


              int16x8_t result =
                  vqrdmulhq_s16(
                      va,
                      vb
                  );


              const int16x8_t min16 =
                  vdupq_n_s16(
                      (int16_t)-32768
                  );


              const uint16x8_t overflow =
                  vandq_u16(
                      vceqq_s16(
                          va,
                          min16
                      ),
                      vceqq_s16(
                          vb,
                          min16
                      )
                  );


              result =
                  vbslq_s16(
                      overflow,
                      min16,
                      result
                  );


              return
                  vreinterpretq_s32_s16(
                      result
                  );
          }


          // ==========================================================
          // V9 fused case-0x18 non-division path
          // ==========================================================

          static inline
          __attribute__((always_inline))
          __m128i v9_case18_nondiv(
              __m128i *acc,
              __m128i onekey,
              __m128i temp
          )
          {
              const __m128i add =
                  _mm_xor_si128_emu(
                      onekey,
                      temp
                  );


              onekey =
                  _mm_clmulepi64_si128_emu(
                      add,
                      add,
                      0x10
                  );


              const __m128i product =
                  _mm_mulhrs_epi16_emu(
                      *acc,
                      onekey
                  );


              *acc =
                  _mm_xor_si128_emu(
                      *acc,
                      product
                  );


              return
                  onekey;
          }

          '''

          s = (
              s[:start] +
              mulhrs +
              s[end:]
          )


          # ============================================================
          # REGISTER BRIDGES
          # ============================================================

          start = s.index(
              '__m128i _mm_set_epi64x_emu'
          )

          marker = s.index(
              '__m128i _mm_cvtsi32_si128_emu',
              start
          )

          end = (
              s.rfind(
                  '\n',
                  start,
                  marker
              ) + 1
          )

          bridges = r'''static inline
          __attribute__((always_inline))
          __m128i _mm_set_epi64x_emu(
              uint64_t hi,
              uint64_t lo
          )
          {
              const uint64x2_t v =
                  vcombine_u64(
                      vcreate_u64(lo),
                      vcreate_u64(hi)
                  );

              return
                  vreinterpretq_s32_u64(v);
          }


          static inline
          __attribute__((always_inline))
          __m128i _mm_cvtsi64_si128_emu(
              uint64_t lo
          )
          {
              const uint64x2_t v =
                  vcombine_u64(
                      vcreate_u64(lo),
                      vdup_n_u64(0)
                  );

              return
                  vreinterpretq_s32_u64(v);
          }


          static inline
          __attribute__((always_inline))
          int64_t _mm_cvtsi128_si64_emu(
              __m128i &a
          )
          {
              return
                  vget_lane_s64(
                      vget_low_s64(
                          vreinterpretq_s64_s32(
                              a
                          )
                      ),
                      0
                  );
          }


          static inline
          __attribute__((always_inline))
          int32_t _mm_cvtsi128_si32_emu(
              __m128i &a
          )
          {
              return
                  vgetq_lane_s32(
                      a,
                      0
                  );
          }

          '''

          s = (
              s[:start] +
              bridges +
              s[end:]
          )


          # ============================================================
          # ACTIVE V2.1 CASE 0x14
          #
          # Hoisted mask + alternating pointers
          # Fused AES/MIX2/XOR
          # ============================================================

          active = s.index(
              '__verusclmulwithoutreduction64alignedrepeat_v2_1'
          )

          pos14 = s.index(
              'case 0x14:',
              active
          )

          start14 = (
              s.rfind(
                  '\n',
                  active,
                  pos14
              ) + 1
          )

          pos18 = s.index(
              'case 0x18:',
              pos14
          )

          end14 = (
              s.rfind(
                  '\n',
                  pos14,
                  pos18
              ) + 1
          )


          case14 = r'''            case 0x14:
            {
                const __m128i *buftmp =
                    pbuf -
                    (((selector & 1) << 1) - 1);


                uint64_t rounds =
                    selector >> 61;


                __m128i *rc =
                    prand;


                uint64_t aesround =
                    0;


                uint64_t mask =
                    ((uint64_t)0x10000000) <<
                    rounds;


                const __m128i *sel_mul =
                    (rounds & 1)
                        ? pbuf
                        : buftmp;


                const __m128i *sel_aes =
                    (rounds & 1)
                        ? buftmp
                        : pbuf;


                do
                {
                    const __m128i onekey =
                        _mm_load_si128_emu(
                            rc++
                        );


                    if (selector & mask)
                    {
                        const __m128i temp =
                            _mm_load_si128_emu(
                                sel_mul
                            );


                        const __m128i add =
                            _mm_xor_si128_emu(
                                onekey,
                                temp
                            );


                        const __m128i product =
                            _mm_clmulepi64_si128_emu(
                                add,
                                add,
                                0x10
                            );


                        acc =
                            _mm_xor_si128_emu(
                                acc,
                                product
                            );
                    }
                    else
                    {
                        const __m128i temp =
                            _mm_load_si128_emu(
                                sel_aes
                            );


                        const uint64_t roundidx =
                            aesround++ << 2;


                        const __m128i mixed =
                            v9_aes4_mix2_xor(
                                onekey,
                                temp,
                                rc + roundidx
                            );


                        acc =
                            _mm_xor_si128_emu(
                                acc,
                                mixed
                            );
                    }


                    mask >>=
                        1;


                    const __m128i *swap =
                        sel_mul;

                    sel_mul =
                        sel_aes;

                    sel_aes =
                        swap;

                } while (rounds--);


                const __m128i tempa1 =
                    _mm_load_si128_emu(
                        prand
                    );


                const __m128i tempa2 =
                    _mm_mulhrs_epi16_emu(
                        acc,
                        tempa1
                    );


                const __m128i tempa3 =
                    _mm_xor_si128_emu(
                        tempa1,
                        tempa2
                    );


                const __m128i tempa4 =
                    _mm_load_si128_emu(
                        prandex
                    );


                _mm_store_si128_emu(
                    prandex,
                    tempa3
                );


                _mm_store_si128_emu(
                    prand,
                    tempa4
                );


                break;
            }
          '''

          s = (
              s[:start14] +
              case14 +
              s[end14:]
          )


          # ============================================================
          # ACTIVE V2.1 CASE 0x18
          #
          # Hoist divisor
          # Hoist mask
          # Alternate pointers instead of ternary each iteration
          # Fused PMULL/VQRDMULH/XOR
          # Direct low32 XOR
          # ============================================================

          active = s.index(
              '__verusclmulwithoutreduction64alignedrepeat_v2_1'
          )

          pos18 = s.index(
              'case 0x18:',
              active
          )

          start18 = (
              s.rfind(
                  '\n',
                  active,
                  pos18
              ) + 1
          )

          pos1c = s.index(
              'case 0x1c:',
              pos18
          )

          end18 = (
              s.rfind(
                  '\n',
                  pos18,
                  pos1c
              ) + 1
          )


          case18 = r'''            case 0x18:
            {
                const __m128i *buftmp =
                    pbuf -
                    (((selector & 1) << 1) - 1);


                uint64_t rounds =
                    selector >> 61;


                __m128i *rc =
                    prand;


                __m128i onekey;


                const int32_t divisor =
                    (int32_t)(uint32_t)selector;


                uint64_t mask =
                    ((uint64_t)0x10000000) <<
                    rounds;


                const __m128i *sel_div =
                    (rounds & 1)
                        ? pbuf
                        : buftmp;


                const __m128i *sel_cl =
                    (rounds & 1)
                        ? buftmp
                        : pbuf;


                do
                {
                    onekey =
                        _mm_load_si128_emu(
                            rc++
                        );


                    if (selector & mask)
                    {
                        const __m128i temp =
                            _mm_load_si128_emu(
                                sel_div
                            );


                        onekey =
                            _mm_xor_si128_emu(
                                onekey,
                                temp
                            );


                        const int64_t dividend =
                            _mm_cvtsi128_si64_emu(
                                onekey
                            );


                        const int32_t remainder =
                            (int32_t)(
                                dividend %
                                divisor
                            );


                        acc =
                            v9_xor_low32(
                                acc,
                                (uint32_t)remainder
                            );
                    }
                    else
                    {
                        const __m128i temp =
                            _mm_load_si128_emu(
                                sel_cl
                            );


                        onekey =
                            v9_case18_nondiv(
                                &acc,
                                onekey,
                                temp
                            );
                    }


                    mask >>=
                        1;


                    const __m128i *swap =
                        sel_div;

                    sel_div =
                        sel_cl;

                    sel_cl =
                        swap;

                } while (rounds--);


                const __m128i tempa3 =
                    _mm_load_si128_emu(
                        prandex
                    );


                const __m128i tempa4 =
                    _mm_xor_si128_emu(
                        tempa3,
                        acc
                    );


                _mm_store_si128_emu(
                    prandex,
                    onekey
                );


                _mm_store_si128_emu(
                    prand,
                    tempa4
                );


                break;
            }
          '''

          s = (
              s[:start18] +
              case18 +
              s[end18:]
          )


          p.write_text(s)


          # ============================================================
          # VERUSSCAN V9
          # ============================================================

          p = Path(
              'verus/armv7/verusscan.cpp'
          )

          s = p.read_text()


          s = s.replace(
              'static __thread uint32_t throughput = 0;',
              '/* V9 throughput is constant one */',
              1
          )


          # ============================================================
          # FIXKEY + V9 HARAKA
          # ============================================================

          start = s.index(
              'extern "C" inline void FixKey'
          )

          end = s.index(
              'extern "C" inline void VerusHashHalf',
              start
          )


          hot_helpers = r'''extern "C"
          __attribute__((always_inline))
          inline void FixKey(
              uint16_t *fixrand,
              uint16_t *fixrandex,
              __m128i *keyback,
              __m128i *g_prand,
              __m128i *g_prandex
          )
          {
          #pragma clang loop unroll(full)
              for (
                  int i = 31;
                  i >= 0;
                  --i
              )
              {
                  keyback[
                      fixrandex[i]
                  ] =
                      g_prandex[i];


                  keyback[
                      fixrand[i]
                  ] =
                      g_prand[i];
              }
          }


          // ==========================================================
          // Prepare the exact 64-byte CLHash input with NEON.
          //
          // Two vector stores + one byte.
          // ==========================================================

          static inline
          __attribute__((always_inline))
          void v9_prepare_clhash_input(
              unsigned char *curBuf,
              const unsigned char *nonce
          )
          {
              const uint8x16_t n =
                  vld1q_u8(
                      nonce
                  );


              const uint8x16_t h0 =
                  vld1q_u8(
                      curBuf
                  );


              // nonce[0..14], byte 47 gets overwritten below.
              vst1q_u8(
                  curBuf + 32,
                  n
              );


              // Restore bytes 47..62.
              vst1q_u8(
                  curBuf + 47,
                  h0
              );


              // Restore byte 63.
              curBuf[63] =
                  vgetq_lane_u8(
                      h0,
                      0
                  );
          }


          static inline
          __attribute__((always_inline))
          void v9_write_intermediate(
              unsigned char *curBuf,
              uint64_t intermediate
          )
          {
              memcpy(
                  curBuf + 47,
                  &intermediate,
                  8
              );

              memcpy(
                  curBuf + 55,
                  &intermediate,
                  8
              );

              curBuf[63] =
                  (unsigned char)intermediate;
          }


          static inline
          __attribute__((always_inline))
          uint8x16_t v9_haraka_aes(
              uint8x16_t state,
              uint8x16_t key
          )
          {
              const uint8x16_t zero =
                  vdupq_n_u8(0);


              state =
                  vaeseq_u8(
                      state,
                      zero
                  );


              state =
                  vaesmcq_u8(
                      state
                  );


              return
                  veorq_u8(
                      state,
                      key
                  );
          }


          static inline
          __attribute__((always_inline))
          uint8x16_t v9_unpacklo32(
              uint8x16_t a,
              uint8x16_t b
          )
          {
              const int32x4_t ai =
                  vreinterpretq_s32_u8(a);

              const int32x4_t bi =
                  vreinterpretq_s32_u8(b);


              const int32x2x2_t z =
                  vzip_s32(
                      vget_low_s32(ai),
                      vget_low_s32(bi)
                  );


              return
                  vreinterpretq_u8_s32(
                      vcombine_s32(
                          z.val[0],
                          z.val[1]
                      )
                  );
          }


          static inline
          __attribute__((always_inline))
          uint8x16_t v9_unpackhi32(
              uint8x16_t a,
              uint8x16_t b
          )
          {
              const int32x4_t ai =
                  vreinterpretq_s32_u8(a);

              const int32x4_t bi =
                  vreinterpretq_s32_u8(b);


              const int32x2x2_t z =
                  vzip_s32(
                      vget_high_s32(ai),
                      vget_high_s32(bi)
                  );


              return
                  vreinterpretq_u8_s32(
                      vcombine_s32(
                          z.val[0],
                          z.val[1]
                      )
                  );
          }


          // ==========================================================
          // V9 PARTIAL HARAKA
          //
          // V8 still wrote the 17 intermediate bytes to curBuf
          // before loading s2/s3.
          //
          // V9 constructs s2 and s3 directly in NEON registers.
          // No intermediate memory roundtrip on normal hashes.
          // ==========================================================

          static inline
          __attribute__((always_inline))
          void v9_haraka512_word7(
              unsigned char *out,
              const unsigned char *curBuf,
              const unsigned char *nonce,
              uint64_t intermediate,
              const __m128i *rc
          )
          {
              uint8x16_t s0 =
                  vld1q_u8(
                      curBuf
                  );


              uint8x16_t s1 =
                  vld1q_u8(
                      curBuf + 16
                  );


              uint8x16_t s2 =
                  vld1q_u8(
                      nonce
                  );


              // Final Haraka input byte 47 =
              // low byte of intermediate.
              s2 =
                  vsetq_lane_u8(
                      (uint8_t)intermediate,
                      s2,
                      15
                  );


              // Bytes 47..63 are intermediate repeated.
              // s3 begins at byte 48, therefore rotate repeated
              // intermediate by one byte.
              const uint64x2_t iv64 =
                  vcombine_u64(
                      vcreate_u64(
                          intermediate
                      ),
                      vcreate_u64(
                          intermediate
                      )
                  );


              const uint8x16_t iv =
                  vreinterpretq_u8_u64(
                      iv64
                  );


              uint8x16_t s3 =
                  vextq_u8(
                      iv,
                      iv,
                      1
                  );


              // First 3 complete Haraka rounds.
          #pragma clang loop unroll(full)
              for (
                  int round = 0;
                  round < 3;
                  ++round
              )
              {
                  const int r =
                      round * 8;


                  s0 = v9_haraka_aes(
                      s0,
                      vreinterpretq_u8_s32(
                          rc[r + 0]
                      )
                  );

                  s1 = v9_haraka_aes(
                      s1,
                      vreinterpretq_u8_s32(
                          rc[r + 1]
                      )
                  );

                  s2 = v9_haraka_aes(
                      s2,
                      vreinterpretq_u8_s32(
                          rc[r + 2]
                      )
                  );

                  s3 = v9_haraka_aes(
                      s3,
                      vreinterpretq_u8_s32(
                          rc[r + 3]
                      )
                  );


                  s0 = v9_haraka_aes(
                      s0,
                      vreinterpretq_u8_s32(
                          rc[r + 4]
                      )
                  );

                  s1 = v9_haraka_aes(
                      s1,
                      vreinterpretq_u8_s32(
                          rc[r + 5]
                      )
                  );

                  s2 = v9_haraka_aes(
                      s2,
                      vreinterpretq_u8_s32(
                          rc[r + 6]
                      )
                  );

                  s3 = v9_haraka_aes(
                      s3,
                      vreinterpretq_u8_s32(
                          rc[r + 7]
                      )
                  );


                  const uint8x16_t t =
                      v9_unpacklo32(
                          s0,
                          s1
                      );


                  const uint8x16_t a =
                      v9_unpackhi32(
                          s0,
                          s1
                      );


                  const uint8x16_t b =
                      v9_unpacklo32(
                          s2,
                          s3
                      );


                  const uint8x16_t c =
                      v9_unpackhi32(
                          s2,
                          s3
                      );


                  s3 =
                      v9_unpacklo32(
                          a,
                          c
                      );


                  s0 =
                      v9_unpackhi32(
                          a,
                          c
                      );


                  s2 =
                      v9_unpackhi32(
                          b,
                          t
                      );


                  s1 =
                      v9_unpacklo32(
                          b,
                          t
                      );
              }


              // Fourth complete AES stage.
              s0 = v9_haraka_aes(
                  s0,
                  vreinterpretq_u8_s32(rc[24])
              );

              s1 = v9_haraka_aes(
                  s1,
                  vreinterpretq_u8_s32(rc[25])
              );

              s2 = v9_haraka_aes(
                  s2,
                  vreinterpretq_u8_s32(rc[26])
              );

              s3 = v9_haraka_aes(
                  s3,
                  vreinterpretq_u8_s32(rc[27])
              );


              s0 = v9_haraka_aes(
                  s0,
                  vreinterpretq_u8_s32(rc[28])
              );

              s1 = v9_haraka_aes(
                  s1,
                  vreinterpretq_u8_s32(rc[29])
              );

              s2 = v9_haraka_aes(
                  s2,
                  vreinterpretq_u8_s32(rc[30])
              );

              s3 = v9_haraka_aes(
                  s3,
                  vreinterpretq_u8_s32(rc[31])
              );


              // Only dependency required by final word7.
              const uint8x16_t t =
                  v9_unpacklo32(
                      s0,
                      s1
                  );


              const uint8x16_t b =
                  v9_unpacklo32(
                      s2,
                      s3
                  );


              s2 =
                  v9_unpackhi32(
                      b,
                      t
                  );


              // Final round only requires state2.
              s2 = v9_haraka_aes(
                  s2,
                  vreinterpretq_u8_s32(rc[34])
              );


              s2 = v9_haraka_aes(
                  s2,
                  vreinterpretq_u8_s32(rc[38])
              );


              uint32_t word7 =
                  vgetq_lane_u32(
                      vreinterpretq_u32_u8(
                          s2
                      ),
                      2
                  );


              // Original input bytes 52..55 correspond
              // to s3 uint32 lane 1.
              const uint32_t input_word7 =
                  vgetq_lane_u32(
                      vreinterpretq_u32_u8(
                          s3
                      ),
                      1
                  );


              word7 ^=
                  input_word7;


              memcpy(
                  out + 28,
                  &word7,
                  sizeof(word7)
              );
          }


          '''

          s = (
              s[:start] +
              hot_helpers +
              s[end:]
          )


          # ============================================================
          # V9 FAST HASH + FULL CANDIDATE HASH
          # ============================================================

          start = s.index(
              'extern "C" void inline Verus2hash'
          )

          end = s.index(
              '#ifdef _WIN32',
              start
          )


          verus2 = r'''static __thread int
          v9_haraka_fast_state = 0;
          //  0 = not tested
          //  1 = verified
          // -1 = fallback


          extern "C"
          __attribute__((always_inline))
          inline void Verus2hash(
              unsigned char *hash,
              unsigned char *curBuf,
              unsigned char *nonce,
              __m128i * __restrict data_key,
              uint8_t *gpu_init,
              uint16_t *fixrand,
              uint16_t *fixrandex,
              __m128i *g_prand,
              __m128i *g_prandex,
              int version
          )
          {
              (void)gpu_init;
              (void)version;


              // Build exact CLHash input.
              v9_prepare_clhash_input(
                  curBuf,
                  nonce
              );


              uint64_t intermediate =
                  verusclhashv2_2(
                      data_key,
                      curBuf,
                      511,
                      fixrand,
                      fixrandex,
                      g_prand,
                      g_prandex
                  );


              intermediate &=
                  511;


              const __m128i *round_keys =
                  data_key +
                  intermediate;


              if (__builtin_expect(
                      v9_haraka_fast_state < 0,
                      0
                  ))
              {
                  // Safe fallback.
                  v9_write_intermediate(
                      curBuf,
                      intermediate
                  );


                  haraka512_port_keyed(
                      hash,
                      curBuf,
                      round_keys
                  );
              }
              else
              {
                  // Normal V9 path:
                  // don't write intermediate to RAM.
                  v9_haraka512_word7(
                      hash,
                      curBuf,
                      nonce,
                      intermediate,
                      round_keys
                  );


                  // One-time bit-exact test per thread.
                  if (__builtin_expect(
                          v9_haraka_fast_state == 0,
                          0
                      ))
                  {
                      uint32_t fast_word7;


                      memcpy(
                          &fast_word7,
                          hash + 28,
                          sizeof(fast_word7)
                      );


                      // Build complete input only for this test.
                      v9_write_intermediate(
                          curBuf,
                          intermediate
                      );


                      alignas(16)
                      uint32_t reference_hash[8] =
                          { 0 };


                      haraka512_port_keyed(
                          (unsigned char *)
                              reference_hash,
                          curBuf,
                          round_keys
                      );


                      if (
                          fast_word7 ==
                          reference_hash[7]
                      )
                      {
                          v9_haraka_fast_state =
                              1;
                      }
                      else
                      {
                          memcpy(
                              hash,
                              reference_hash,
                              32
                          );

                          v9_haraka_fast_state =
                              -1;
                      }
                  }
              }


              FixKey(
                  fixrand,
                  fixrandex,
                  data_key,
                  g_prand,
                  g_prandex
              );
          }


          // ==========================================================
          // FULL REPLAY
          // Only for actual candidate.
          // ==========================================================

          extern "C"
          __attribute__((noinline))
          void Verus2hashFullV9(
              unsigned char *hash,
              unsigned char *curBuf,
              unsigned char *nonce,
              __m128i * __restrict data_key,
              uint8_t *gpu_init,
              uint16_t *fixrand,
              uint16_t *fixrandex,
              __m128i *g_prand,
              __m128i *g_prandex,
              int version
          )
          {
              (void)gpu_init;
              (void)version;


              v9_prepare_clhash_input(
                  curBuf,
                  nonce
              );


              uint64_t intermediate =
                  verusclhashv2_2(
                      data_key,
                      curBuf,
                      511,
                      fixrand,
                      fixrandex,
                      g_prand,
                      g_prandex
                  );


              intermediate &=
                  511;


              v9_write_intermediate(
                  curBuf,
                  intermediate
              );


              haraka512_port_keyed(
                  hash,
                  curBuf,
                  data_key +
                  intermediate
              );


              FixKey(
                  fixrand,
                  fixrandex,
                  data_key,
                  g_prand,
                  g_prandex
              );
          }

          '''

          s = (
              s[:start] +
              verus2 +
              s[end:]
          )


          # ============================================================
          # CANDIDATE PATH
          # ============================================================

          start = s.index(
              '\t\tif (vhash[7] <= Htarg )'
          )

          end = s.index(
              '\n\t\tif ((uint64_t)throughput',
              start
          )


          candidate = r'''		if (__builtin_expect(
                      vhash[7] <= Htarg,
                      0
                  ))
                  {
                      alignas(16)
                      uint32_t fullhash[8] =
                          { 0 };


                      Verus2hashFullV9(
                          (unsigned char *)
                              fullhash,

                          (unsigned char *)
                              blockhash_half,

                          nonceSpace,

                          data_key,

                          &gpuinit,

                          fixrand,
                          fixrandex,

                          data_key_prand,
                          data_key_prandex,

                          version
                      );


                      if (
                          fullhash[7] ==
                          vhash[7]
                      )
                      {
                          work->valid_nonces++;


                          ((uint32_t *)
                              full_data
                          )[NONCE_OFT] =
                              nonce_buf;


                          memcpy(
                              work->data,
                              full_data,
                              140
                          );


                          const int nonce =
                              work->valid_nonces -
                              1;


                          memcpy(
                              work->extra,
                              sol_data,
                              1347
                          );


                          memcpy(
                              work->extra + 1332,
                              nonceSpace,
                              15
                          );


                          bn_store_hash_target_ratio(
                              fullhash,
                              work->target,
                              work,
                              nonce
                          );


                          work->nonces[
                              work->valid_nonces - 1
                          ] =
                              nonce_buf;


                          goto out;
                      }
                  }
          '''

          s = (
              s[:start] +
              candidate +
              s[end:]
          )


          # ============================================================
          # LOOP BOOKKEEPING
          # ============================================================

          s = s.replace(
              'struct timeval tv_start, tv_end;',
              '',
              1
          )

          s = s.replace(
              'gettimeofday(&tv_start, NULL);',
              '',
              1
          )

          s = s.replace(
              'throughput = 1;',
              '',
              1
          )

          s = s.replace(
              '*hashes_done = nonce_buf - start_nonce + throughput;',
              '',
              1
          )

          s = s.replace(
              'if ((uint64_t)throughput + '
              '(uint64_t)nonce_buf >= '
              '(uint64_t)max_nonce)',
              'if ((uint64_t)nonce_buf + '
              '1ULL >= '
              '(uint64_t)max_nonce)',
              1
          )

          s = s.replace(
              'nonce_buf += throughput;',
              '++nonce_buf;',
              1
          )


          old_out = (
              'out:\n'
              '\tgettimeofday(&tv_end, NULL);'
          )

          new_out = (
              'out:\n'
              '\t*hashes_done = '
              'nonce_buf - start_nonce + 1;'
          )


          if old_out not in s:
              raise SystemExit(
                  'V9 could not find out bookkeeping'
              )


          s = s.replace(
              old_out,
              new_out,
              1
          )


          p.write_text(s)


          # ============================================================
          # API BUILD ID
          # ============================================================

          p = Path(
              'api.cpp'
          )

          s = p.read_text()


          old = (
              'sprintf(buffer, '
              '"NAME=%s;VER=%s;API=%s;"'
          )


          new = (
              'sprintf(buffer, '
              '"NAME=%s;VER=%s;'
              'BUILD=A55-CLHASH-V9;'
              'API=%s;"'
          )


          if old not in s:
              raise SystemExit(
                  'API summary signature not found'
              )


          p.write_text(
              s.replace(
                  old,
                  new,
                  1
              )
          )


          print('=======================================')
          print('FireStick A55 CLHASH V9')
          print('=======================================')
          print('V8 partial Haraka      : YES')
          print('Haraka register input  : V9')
          print('No hot intermediate RAM: YES')
          print('PMULL                   : YES')
          print('VQRDMULH                : YES')
          print('VTBL                     : YES')
          print('case 0x14 fusion        : YES')
          print('case 0x18 fusion        : YES')
          print('case 0x18 mask hoist    : YES')
          print('case 0x18 pointer hoist : YES')
          print('low32 direct XOR        : YES')
          print('FixKey uint16 indices   : YES')
          print('FixKey unrolled         : YES')
          print('full candidate replay   : YES')
          print('Haraka runtime selftest : YES')
          print('BUILD=A55-CLHASH-V9')
          PY


      # ================================================================
      # VERIFY PATCHES
      # ================================================================

      - name: Verify V9 patches
        shell: bash
        run: |
          set -euo pipefail

          echo "===== CPU ====="
          grep -n "cortex-a55" Makefile.am

