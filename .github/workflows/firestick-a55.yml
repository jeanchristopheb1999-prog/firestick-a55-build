name: FireStick A55 QCFAST V12

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==============================================================
      # EXACT HISTORICAL BASES REQUIRED TO RECREATE V11 #33
      # ==============================================================

      - name: Checkout exact V8 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 6cf06bdd8f85afef8793180e6dd68b4a1a4fd9f0
          path: v8-base


      - name: Checkout exact V10 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 73446a48e954bcc579c302d5a01e3dfb71b2bd30
          path: v10-base


      - name: Checkout V11 run 30 base
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 7f92ff0f8788f54781704ce8414915584450bd78
          path: v11-base


      - name: Checkout exact V11 33 builder
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: c98f006a974ccee5be50ea5982311c05774432bc
          path: v11-builder


      - name: Checkout pinned ccminer source
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454
          path: src


      # ==============================================================
      # REBUILD EXACT V11 #33
      # ==============================================================

      - name: Replay exact V11 33
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path
          import textwrap


          workflow = Path(
              '../v11-builder/.github/workflows/firestick-a55.yml'
          ).read_text()


          lines = workflow.splitlines()

          blocks = []

          i = 0


          while i < len(lines):

              if lines[i].strip() == "python3 - <<'PY'":

                  start = i + 1
                  end = None


                  for j in range(start, len(lines)):

                      if lines[j].strip() == 'PY':

                          end = j
                          break


                  if end is None:

                      raise SystemExit(
                          'Unterminated V11 Python block'
                      )


                  blocks.append(
                      textwrap.dedent(
                          '\n'.join(
                              lines[start:end]
                          )
                      )
                  )


                  i = end + 1

              else:

                  i += 1


          if len(blocks) < 2:

              raise SystemExit(
                  'Expected at least 2 V11 blocks, found '
                  + str(len(blocks))
              )


          print(
              '======================================'
          )

          print(
              'REPLAY EXACT V11 #33'
          )

          print(
              '======================================'
          )


          exec(
              compile(
                  blocks[0],
                  'v11-33-source.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          api = Path(
              'api.cpp'
          ).read_text()


          if 'BUILD=A55-HOTCORE-V11' not in api:

              raise SystemExit(
                  'Exact V11 #33 replay failed'
              )


          print(
              'EXACT V11 #33 REPLAY: PASS'
          )

          PY


      # ==============================================================
      # QCFAST V12
      # ==============================================================

      - name: Patch QCFAST V12
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path


          path = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          )


          s = path.read_text()


          exact_name = (
              '__verusclmulwithoutreduction64alignedrepeat_v2_1'
          )


          fast_name = (
              '__verusclmulwithoutreduction64alignedrepeat_v12_fast'
          )


          # ==========================================================
          # LOCATE EXACT V11 HOT FUNCTION
          # ==========================================================

          name_pos = s.index(
              exact_name
          )


          function_start = s.rfind(
              '__m128i ',
              0,
              name_pos + 1
          )


          if function_start < 0:

              raise SystemExit(
                  'Could not locate V11 exact function start'
              )


          function_end = s.index(
              '// verus intermediate hash extra - v2.2',
              name_pos
          )


          exact_function = s[
              function_start:
              function_end
          ]


          exact_mulhrs_count = exact_function.count(
              '_mm_mulhrs_epi16_emu('
          )


          if exact_mulhrs_count != 13:

              raise SystemExit(
                  'Expected 13 static mulhrs sites in V11, found '
                  + str(exact_mulhrs_count)
              )


          print(
              'V11 exact mulhrs sites:',
              exact_mulhrs_count
          )


          # ==========================================================
          # RAW VQRDMULH
          #
          # This is deliberately NOT x86-exact when ARM saturation
          # occurs.
          #
          # FPSCR.QC catches that exceptional case.
          # ==========================================================

          helpers = r'''

          // ==========================================================
          // A55 QCFAST V12
          // ==========================================================

          #define V12_FPSCR_QC 0x08000000u


          static inline
          __attribute__((always_inline))
          __m128i v12_mulhrs_fast(
              __m128i a,
              __m128i b
          )
          {
              const int16x8_t va =
                  vreinterpretq_s16_m128i(
                      a
                  );


              const int16x8_t vb =
                  vreinterpretq_s16_m128i(
                      b
                  );


              const int16x8_t result =
                  vqrdmulhq_s16(
                      va,
                      vb
                  );


              return
                  vreinterpretq_m128i_s16(
                      result
                  );
          }


          static inline
          __attribute__((always_inline))
          uint32_t v12_read_fpscr()
          {
              uint32_t value;


              __asm__ volatile(
                  "vmrs %0, fpscr"
                  : "=r"(value)
              );


              return value;
          }


          static inline
          __attribute__((always_inline))
          void v12_write_fpscr(
              uint32_t value
          )
          {
              __asm__ volatile(
                  "vmsr fpscr, %0"
                  :
                  : "r"(value)
                  : "memory"
              );
          }


          static inline
          __attribute__((always_inline))
          void v12_clear_qc()
          {
              const uint32_t fpscr =
                  v12_read_fpscr();


              v12_write_fpscr(
                  fpscr &
                  ~V12_FPSCR_QC
              );
          }


          // Force a real VQRDMULH saturation once per mining thread.
          // If the hardware/OS does not expose QC correctly,
          // QCFAST is disabled automatically.
          static volatile int16_t
          v12_probe_operand = (int16_t)-32768;


          static inline
          __attribute__((noinline))
          int v12_probe_qc()
          {
              v12_clear_qc();


              const int16_t probe_value =
                  v12_probe_operand;


              const int16x8_t probe_vector =
                  vdupq_n_s16(
                      probe_value
                  );


              const int16x8_t probe_result =
                  vqrdmulhq_s16(
                      probe_vector,
                      probe_vector
                  );


              volatile int16_t sink =
                  vgetq_lane_s16(
                      probe_result,
                      0
                  );


              (void)sink;


              const uint32_t flags =
                  v12_read_fpscr();


              v12_clear_qc();


              return
                  (flags & V12_FPSCR_QC)
                      ? 1
                      : 0;
          }


          // Roll back the mutations produced by a failed FAST attempt.
          // This is only used:
          //   - during one-time validation
          //   - if QC reports a rare saturation.
          static inline
          __attribute__((always_inline))
          void v12_rollback_key(
              __m128i *randomsource,
              uint32_t *fixrand,
              uint32_t *fixrandex,
              __m128i *g_prand,
              __m128i *g_prandex
          )
          {
          #pragma clang loop unroll(full)
              for (
                  int i = 31;
                  i >= 0;
                  --i
              )
              {
                  randomsource[
                      fixrandex[i]
                  ] =
                      g_prandex[i];


                  randomsource[
                      fixrand[i]
                  ] =
                      g_prand[i];
              }
          }


          static __thread int
          v12_qc_mode = 0;

          //  0 = hardware QC not tested yet
          //  1 = QCFAST validated and enabled
          //  2 = QC works; waiting for clean fast/exact validation hash
          // -1 = permanent exact V11 fallback


          '''


          # ==========================================================
          # CREATE FAST CLHASH COPY
          #
          # Everything stays IDENTICAL to V11 except mulhrs.
          # ==========================================================

          fast_function = exact_function.replace(
              exact_name,
              fast_name,
              1
          )


          fast_function = fast_function.replace(
              '_mm_mulhrs_epi16_emu(',
              'v12_mulhrs_fast('
          )


          if (
              fast_function.count(
                  'v12_mulhrs_fast('
              )
              != 13
          ):

              raise SystemExit(
                  'V12 fast function did not replace all mulhrs sites'
              )


          if (
              '_mm_mulhrs_epi16_emu('
              in fast_function
          ):

              raise SystemExit(
                  'Exact mulhrs survived inside V12 FAST copy'
              )


          # Insert helpers + duplicate immediately before v2.2 wrapper.
          s = (
              s[:function_end]
              + helpers
              + '\n'
              + fast_function
              + '\n'
              + s[function_end:]
          )


          # ==========================================================
          # REPLACE v2.2 WRAPPER
          #
          # Normal hash:
          #   FAST CLHash
          #   one FPSCR read
          #
          # If QC=1:
          #   rollback FAST mutations
          #   rerun exact V11 CLHash
          #
          # First clean hash:
          #   FAST + exact are both computed and compared.
          # ==========================================================

          wrapper_start = s.index(
              'uint64_t verusclhashv2_2('
          )


          wrapper_close = s.index(
              '\n}',
              wrapper_start
          ) + 2


          wrapper = r'''uint64_t verusclhashv2_2(
              void *random,
              const unsigned char buf[64],
              uint64_t keyMask,
              uint32_t * __restrict fixrand,
              uint32_t * __restrict fixrandex,
              __m128i *g_prand,
              __m128i *g_prandex
          )
          {
              __m128i *rs64 =
                  (__m128i *)random;


              const __m128i *string =
                  (const __m128i *)buf;


              // ======================================================
              // ONE-TIME HARDWARE QC PROBE
              // ======================================================

              if (__builtin_expect(
                      v12_qc_mode == 0,
                      0
                  ))
              {
                  if (v12_probe_qc())
                  {
                      v12_qc_mode = 2;
                  }
                  else
                  {
                      v12_qc_mode = -1;
                  }
              }


              __m128i acc;


              // ======================================================
              // SAFE PERMANENT FALLBACK
              // ======================================================

              if (__builtin_expect(
                      v12_qc_mode < 0,
                      0
                  ))
              {
                  acc =
                      __verusclmulwithoutreduction64alignedrepeat_v2_1(
                          rs64,
                          string,
                          keyMask,
                          fixrand,
                          fixrandex,
                          g_prand,
                          g_prandex
                      );
              }

              // ======================================================
              // ONE-TIME FAST-vs-EXACT VALIDATION
              // ======================================================

              else if (__builtin_expect(
                           v12_qc_mode == 2,
                           0
                       ))
              {
                  v12_clear_qc();


                  const __m128i fast_acc =
                      __verusclmulwithoutreduction64alignedrepeat_v12_fast(
                          rs64,
                          string,
                          keyMask,
                          fixrand,
                          fixrandex,
                          g_prand,
                          g_prandex
                      );


                  const uint32_t flags =
                      v12_read_fpscr();


                  // Restore the key before exact replay.
                  v12_rollback_key(
                      rs64,
                      fixrand,
                      fixrandex,
                      g_prand,
                      g_prandex
                  );


                  v12_clear_qc();


                  const __m128i exact_acc =
                      __verusclmulwithoutreduction64alignedrepeat_v2_1(
                          rs64,
                          string,
                          keyMask,
                          fixrand,
                          fixrandex,
                          g_prand,
                          g_prandex
                      );


                  // Exact V11 itself can legitimately set QC while
                  // correcting the result in software.
                  v12_clear_qc();


                  // If the validation hash itself saturated,
                  // try validation again on the next hash.
                  if (flags & V12_FPSCR_QC)
                  {
                      v12_qc_mode = 2;
                  }
                  else
                  {
                      if (
                          memcmp(
                              &fast_acc,
                              &exact_acc,
                              sizeof(__m128i)
                          )
                          == 0
                      )
                      {
                          v12_qc_mode = 1;
                      }
                      else
                      {
                          // Any unexplained mismatch permanently
                          // disables QCFAST.
                          v12_qc_mode = -1;
                      }
                  }


                  acc = exact_acc;
              }

              // ======================================================
              // NORMAL QCFAST HOT PATH
              // ======================================================

              else
              {
                  acc =
                      __verusclmulwithoutreduction64alignedrepeat_v12_fast(
                          rs64,
                          string,
                          keyMask,
                          fixrand,
                          fixrandex,
                          g_prand,
                          g_prandex
                      );


                  const uint32_t flags =
                      v12_read_fpscr();


                  if (__builtin_expect(
                          (flags & V12_FPSCR_QC) != 0,
                          0
                      ))
                  {
                      // The fast ARM instruction saturated.
                      //
                      // Restore every key mutation from this attempt,
                      // then replay the exact V11 function.
                      v12_rollback_key(
                          rs64,
                          fixrand,
                          fixrandex,
                          g_prand,
                          g_prandex
                      );


                      v12_clear_qc();


                      acc =
                          __verusclmulwithoutreduction64alignedrepeat_v2_1(
                              rs64,
                              string,
                              keyMask,
                              fixrand,
                              fixrandex,
                              g_prand,
                              g_prandex
                          );


                      // Exact function may set QC while correcting
                      // saturation itself. Clear it before next hash.
                      v12_clear_qc();
                  }
              }


              // V11 constant-folded lazyLengthHash.
              acc =
                  _mm_xor_si128_emu(
                      acc,
                      _mm_cvtsi64_si128_emu(
                          0x10000ULL
                      )
                  );


              return
                  precompReduction64_port(
                      acc
                  );
          }'''


          s = (
              s[:wrapper_start]
              + wrapper
              + s[wrapper_close:]
          )


          path.write_text(
              s
          )


          # ==========================================================
          # API BUILD ID
          # ==========================================================

          api_path = Path(
              'api.cpp'
          )


          api = api_path.read_text()


          if (
              'BUILD=A55-HOTCORE-V11'
              not in api
          ):

              raise SystemExit(
                  'V11 BUILD ID missing before V12 patch'
              )


          api = api.replace(
              'BUILD=A55-HOTCORE-V11',
              'BUILD=A55-QCFAST-V12',
              1
          )


          api_path.write_text(
              api
          )


          # ==========================================================
          # FINAL SOURCE SANITY
          # ==========================================================

          final = path.read_text()


          if fast_name not in final:

              raise SystemExit(
                  'V12 FAST function missing'
              )


          if (
              final.count(
                  'v12_mulhrs_fast('
              )
              < 14
          ):

              raise SystemExit(
                  'V12 raw mulhrs helper/calls missing'
              )


          if (
              'vmrs %0, fpscr'
              not in final
          ):

              raise SystemExit(
                  'V12 VMRS missing'
              )


          if (
              'vmsr fpscr, %0'
              not in final
          ):

              raise SystemExit(
                  'V12 VMSR missing'
              )


          if (
              'v12_rollback_key'
              not in final
          ):

              raise SystemExit(
                  'V12 rollback missing'
              )


          if (
              'memcmp('
              not in final
          ):

              raise SystemExit(
                  'V12 runtime validation missing'
              )


          print(
              '======================================'
          )

          print(
              'A55 QCFAST V12 PATCH: PASS'
          )

          print(
              '======================================'
          )

          print(
              'Base V11 #33        : PRESERVED'
          )

          print(
              'Exact mulhrs path   : PRESERVED'
          )

          print(
              'FAST mulhrs sites   : 13'
          )

          print(
              'Per-call correction : REMOVED FROM FAST'
          )

          print(
              'FPSCR.QC check      : ONCE PER HASH'
          )

          print(
              'QC saturation       : EXACT REPLAY'
          )

          print(
              'Hardware QC probe   : YES'
          )

          print(
              'FAST-vs-EXACT test  : YES'
          )

          print(
              'Automatic fallback  : YES'
          )

          print(
              'BUILD=A55-QCFAST-V12'
          )

          PY


      # ==============================================================
      # SEMANTIC MODEL TEST
      # ==============================================================

      - name: Verify QCFAST V12 model
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import random


          def signed16(x):
              x &= 0xffff

              return (
                  x - 0x10000
                  if x & 0x8000
                  else x
              )


          def x86_mulhrs(a, b):
              product = a * b

              value = (
                  product + 0x4000
              ) >> 15

              return signed16(
                  value
              )


          def arm_vqrdmulh_model(a, b):
              value = (
                  (a * b) + 0x4000
              ) >> 15

              saturated = False


              if value > 32767:
                  value = 32767
                  saturated = True


              if value < -32768:
                  value = -32768
                  saturated = True


              return value, saturated


          # ==========================================================
          # CRITICAL SPECIAL CASE
          # ==========================================================

          x86 = x86_mulhrs(
              -32768,
              -32768
          )


          arm, saturated = arm_vqrdmulh_model(
              -32768,
              -32768
          )


          assert x86 == -32768

          assert arm == 32767

          assert saturated


          print(
              'Known saturation divergence: PASS'
          )


          # ==========================================================
          # RANDOM EQUIVALENCE
          #
          # Whenever ARM does NOT saturate,
          # raw VQRDMULH must equal exact x86 PMULHRSW.
          # ==========================================================

          random.seed(
              0xA5512
          )


          for _ in range(
              2000000
          ):
              a = random.randint(
                  -32768,
                  32767
              )


              b = random.randint(
                  -32768,
                  32767
              )


              exact = x86_mulhrs(
                  a,
                  b
              )


              fast, sat = arm_vqrdmulh_model(
                  a,
                  b
              )


              if not sat:

                  assert fast == exact


          print(
              '2,000,000 non-saturation equivalence tests: PASS'
          )


          # ==========================================================
          # ROLLBACK MODEL
          # ==========================================================

          for _ in range(
              5000
          ):
              original = [
                  random.getrandbits(64)
                  for _ in range(512)
              ]


              key = list(
                  original
              )


              fix = []

              fixex = []

              old = []

              oldex = []


              for i in range(32):

                  a = random.randrange(
                      512
                  )


                  b = random.randrange(
                      512
                  )


                  fix.append(a)

                  fixex.append(b)


                  old.append(
                      key[a]
                  )


                  oldex.append(
                      key[b]
                  )


                  key[a] ^=
                      random.getrandbits(64)


                  key[b] ^=
                      random.getrandbits(64)


              for i in range(
                  31,
                  -1,
                  -1
              ):

                  key[
                      fixex[i]
                  ] = oldex[i]


                  key[
                      fix[i]
                  ] = old[i]


              assert key == original


          print(
              '5,000 reverse rollback tests: PASS'
          )


          print(
              '======================================'
          )

          print(
              'QCFAST V12 MODEL: PASS'
          )

          print(
              '======================================'
          )

          PY


      # ==============================================================
      # SOURCE VERIFICATION
      # ==============================================================

      - name: Verify V12 source
        shell: bash
        run: |
          set -euo pipefail

          cd src


          echo "===== BUILD ====="

          grep -n \
            "A55-QCFAST-V12" \
            api.cpp


          echo "===== RAW VQRDMULH FAST ====="

          grep -n \
            "v12_mulhrs_fast" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== FPSCR QC ====="

          grep -n \
            "V12_FPSCR_QC" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== VMRS ====="

          grep -n \
            "vmrs %0, fpscr" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== VMSR ====="

          grep -n \
            "vmsr fpscr, %0" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== ROLLBACK ====="

          grep -n \
            "v12_rollback_key" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== FAST FUNCTION ====="

          grep -n \
            "v12_fast" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== EXACT V11 STILL PRESENT ====="

          grep -n \
            "_mm_mulhrs_epi16_emu" \
            verus/armv7/verus_clhash_portable.cpp |
            head -n 25


      # ==============================================================
      # BUILD
      # ==============================================================

      - name: Make build script executable
        shell: bash
        run: |
          set -euo pipefail

          cd src

          chmod +x \
            scripts/build-android-ccminer.sh


      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          cd src

          docker build \
            -t ccminer-firestick-a55-v12 \
            -f build.Dockerfile \
            .


      - name: Build QCFAST V12 armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            build-output


          mkdir -p \
            build-output


          docker run \
            --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v12 \
            arm


          echo "===== OUTPUT ====="

          find \
            build-output \
            -maxdepth 4 \
            -type f \
            -print


          echo "===== BUILD LOG ====="

          tail -n 450 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log


          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer


      # ==============================================================
      # BINARY INSPECTION
      # ==============================================================

      - name: Inspect QCFAST V12 binary
        shell: bash
        run: |
          set -euo pipefail

          cd src


          BIN="build-output/ccminer-armeabi-v7a/bin/ccminer"


          echo "===== FILE ====="

          file \
            "$BIN"


          echo "===== BUILD ID ====="

          strings \
            "$BIN" |
            grep \
              "A55-QCFAST-V12"


          echo "===== BINARY SIZE ====="

          ls -lh \
            "$BIN"


          echo "===== AEABI LDIVMOD ====="

          readelf \
            -Ws \
            "$BIN" |
            grep \
              "__aeabi_ldivmod" ||
            true


      # ==============================================================
      # PACKAGE
      # ==============================================================

      - name: Prepare QCFAST V12 package
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            dist


          mkdir -p \
            dist


          BIN="build-output/ccminer-armeabi-v7a/bin"


          cp \
            "$BIN/ccminer" \
            dist/ccminer-a55-qcfast-v12


          if test -f "$BIN/libc++_shared.so"
          then

              cp \
                "$BIN/libc++_shared.so" \
                dist/

          fi


