      - name: Verify MULHRS semantics
        shell: bash
        run: |
          python3 - <<'PY'
          def wrap16(x):
              x &= 0xffff
              return (
                  x - 0x10000
                  if x & 0x8000
                  else x
              )

          def reference(a, b):
              return wrap16(
                  ((a * b) + 0x4000) >> 15
              )

          def arm_model(a, b):
              x = (
                  ((a * b) + 0x4000)
                  >> 15
              )

              if x > 32767:
                  x = 32767

              if x < -32768:
                  x = -32768

              if (
                  a == -32768 and
                  b == -32768
              ):
                  x = -32768

              return x


          tests = [
              (-32768, -32768),
              (-32768, 32767),
              (32767, 32767),
              (32767, -32768),
              (0, 0),
              (1, 1),
              (-1, -1),
              (12345, -23456),
              (-22222, 11111),
          ]

          for a, b in tests:
              r = reference(a, b)
              n = arm_model(a, b)

              print(
                  a,
                  b,
                  r,
                  n
              )

              if r != n:
                  raise SystemExit(
                      f'MULHRS mismatch: {a}, {b}'
                  )

          print(
              'MULHRS semantic tests PASSED'
          )
          PY


      - name: Make Android build script executable
        run: |
          chmod +x \
            scripts/build-android-ccminer.sh


      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t ccminer-firestick-a55-v8 \
            -f build.Dockerfile \
            .


      - name: Build armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-output
          mkdir -p build-output

          docker run --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v8 \
            arm

          echo "===== OUTPUT ====="

          find \
            build-output \
            -maxdepth 4 \
            -type f \
            -print

          echo "===== BUILD LOG ====="

          tail -n 250 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log

          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer


      - name: Inspect V8 binary
        shell: bash
        run: |
          set -euo pipefail

          BIN="build-output/ccminer-armeabi-v7a/bin/ccminer"

          echo "===== FILE ====="
          file "$BIN"

          echo "===== BUILD ID ====="
          strings "$BIN" |
            grep "A55-HOTPATH-V8"

          echo "===== 64-BIT DIVISION ====="
          readelf -Ws "$BIN" |
            grep "__aeabi_ldivmod" || true

          echo "===== SIZE ====="
          ls -lh "$BIN"


      - name: Prepare V8 package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          BIN="build-output/ccminer-armeabi-v7a/bin"

          cp \
            "$BIN/ccminer" \
            dist/ccminer-a55-hotpath-v8

          test -f "$BIN/libc++_shared.so" && \
            cp "$BIN/libc++_shared.so" dist/ || true

          test -f "$BIN/libomp.so" && \
            cp "$BIN/libomp.so" dist/ || true

          chmod +x \
            dist/ccminer-a55-hotpath-v8

          cat > dist/BUILDINFO.txt <<EOF
          Build:
          A55-HOTPATH-V8

          Source commit:
          7f30d6bfb64d0f3ba010191c5a185016ba46f454

          ABI:
          armeabi-v7a / AArch32

          CPU:
          Cortex-A55

          ARMv8 crypto:
          enabled

          Hardware AES:
          enabled

          Hardware PMULL:
          enabled

          Zero-copy PMULL:
          enabled

          VQRDMULH:
          enabled

          MULHRS overflow correction:
          enabled

          CLHash register AES:
          enabled

          Partial keyed Haraka:
          enabled

          Hot Haraka AES rounds:
          34 instead of 40

          Full candidate replay:
          enabled

          First-hash self-test:
          enabled per thread

          PSHUFB:
          NEON VTBL2

          FixKey:
          fully unrolled

          hashes_done:
          moved out of per-hash loop

          Frame pointer:
          omitted

          API:
          BUILD=A55-HOTPATH-V8

          Stable champion baseline:
          V7 approximately 430 kH/s
          EOF

          echo "===== FILE ====="
          file \
            dist/ccminer-a55-hotpath-v8

          echo "===== SHA256 ====="

          sha256sum \
            dist/* |
            tee \
              dist/SHA256SUMS.txt


      - name: Upload V8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestick-a55-hotpath-v8-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
