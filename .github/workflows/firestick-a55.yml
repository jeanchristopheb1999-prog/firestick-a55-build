name: FireStick A55 HOTCORE V11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==============================================================
      # EXACT HISTORICAL BASES
      # ==============================================================

      - name: Checkout exact V8 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 6cf06bdd8f85afef8793180e6dd68b4a1a4fd9f0
          path: v8-base


      - name: Checkout exact V10 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 73446a48e954bcc579c302d5a01e3dfb71b2bd30
          path: v10-base


      - name: Checkout V11 run 30 source workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 7f92ff0f8788f54781704ce8414915584450bd78
          path: v11-base


      - name: Checkout pinned ccminer source
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454
          path: src


      # ==============================================================
      # REPLAY V10 + V11, FIXING ONLY THE FAILED STORE DETECTOR
      # ==============================================================

      - name: Apply corrected HOTCORE V11
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path
          import textwrap


          workflow = Path(
              '../v11-base/.github/workflows/firestick-a55.yml'
          ).read_text()


          lines = workflow.splitlines()

          blocks = []

          i = 0

          while i < len(lines):

              if lines[i].strip() == "python3 - <<'PY'":

                  start = i + 1
                  end = None


                  for j in range(start, len(lines)):

                      if lines[j].strip() == 'PY':

                          end = j
                          break


                  if end is None:

                      raise SystemExit(
                          'Unterminated Python block'
                      )


                  blocks.append(
                      textwrap.dedent(
                          '\n'.join(
                              lines[start:end]
                          )
                      )
                  )


                  i = end + 1

              else:

                  i += 1


          if len(blocks) < 3:

              raise SystemExit(
                  'Expected 3 V11 Python blocks, found '
                  + str(len(blocks))
              )


          # ==========================================================
          # BLOCK 1:
          # exact V10 replay from successful V11 #30
          # ==========================================================

          print(
              '======================================'
          )

          print(
              'REPLAY EXACT V10'
          )

          print(
              '======================================'
          )


          exec(
              compile(
                  blocks[0],
                  'v11-replay-v10.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          # ==========================================================
          # BLOCK 2:
          # V11 patch from run #30
          #
          # Run #30 reached only the duplicate-store detector.
          # Replace that fragile regex section with robust
          # last-occurrence removal.
          # ==========================================================

          patch = blocks[1]


          section_start = patch.index(
              '# ==========================================================\n'
              '# REMOVE DUPLICATE FIXRAND STORES'
          )


          section_end = patch.index(
              '# ==========================================================\n'
              '# SANITY',
              section_start
          )


          robust_fix = r'''# ==========================================================
          # REMOVE DUPLICATE FIXRAND STORES
          #
          # The active CLHash function contains two writes of each
          # index per iteration:
          #
          #     fixrand[i] = prand_idx;
          #     fixrandex[i] = prandex_idx;
          #
          # The first pair occurs before the switch and is required.
          # The second pair occurs after the switch and is redundant.
          #
          # Remove the LAST physical line containing each assignment.
          # This deliberately ignores whitespace/indentation.
          # ==========================================================

          def remove_last_assignment(
              source,
              token
          ):
              positions = []

              pos = 0

              while True:

                  found = source.find(
                      token,
                      pos
                  )


                  if found < 0:
                      break


                  positions.append(
                      found
                  )


                  pos = (
                      found +
                      len(token)
                  )


              if len(positions) != 2:

                  raise SystemExit(
                      'Expected exactly 2 occurrences of '
                      + token
                      + ', found '
                      + str(len(positions))
                  )


              target = positions[-1]


              line_start = source.rfind(
                  '\n',
                  0,
                  target
              )


              if line_start < 0:
                  line_start = 0
              else:
                  line_start += 1


              line_end = source.find(
                  '\n',
                  target
              )


              if line_end < 0:
                  line_end = len(source)
              else:
                  line_end += 1


              return (
                  source[:line_start] +
                  source[line_end:]
              )


          active = remove_last_assignment(
              active,
              'fixrand[i] = prand_idx;'
          )


          active = remove_last_assignment(
              active,
              'fixrandex[i] = prandex_idx;'
          )


          print(
              'Duplicate fixrand/fixrandex stores removed'
          )


          '''


          patch = (
              patch[:section_start] +
              robust_fix +
              patch[section_end:]
          )


          print(
              '======================================'
          )

          print(
              'APPLY V11 HOTCORE PATCH'
          )

          print(
              '======================================'
          )


          exec(
              compile(
                  patch,
                  'v11-hotcore-fixed.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          # ==========================================================
          # BLOCK 3:
          # exact V11 semantic tests from run #30
          # ==========================================================

          print(
              '======================================'
          )

          print(
              'RUN V11 SEMANTIC TESTS'
          )

          print(
              '======================================'
          )


          exec(
              compile(
                  blocks[2],
                  'v11-semantics.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          # ==========================================================
          # FINAL SOURCE CHECKS
          # ==========================================================

          clhash = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          ).read_text()


          api = Path(
              'api.cpp'
          ).read_text()


          makefile = Path(
              'Makefile.am'
          ).read_text()


          if (
              'BUILD=A55-HOTCORE-V11'
              not in api
          ):

              raise SystemExit(
                  'V11 BUILD ID missing'
              )


          if (
              clhash.count(
                  'fixrand[i] = prand_idx;'
              )
              < 1
          ):

              raise SystemExit(
                  'Required fixrand store disappeared'
              )


          active_start = clhash.index(
              '__verusclmulwithoutreduction64alignedrepeat_v2_1'
          )


          active_end = clhash.index(
              '// verus intermediate hash extra - v2.2',
              active_start
          )


          active = clhash[
              active_start:
              active_end
          ]


          if (
              active.count(
                  'fixrand[i] = prand_idx;'
              )
              != 1
          ):

              raise SystemExit(
                  'Active fixrand write count is not 1'
              )


          if (
              active.count(
                  'fixrandex[i] = prandex_idx;'
              )
              != 1
          ):

              raise SystemExit(
                  'Active fixrandex write count is not 1'
              )


          if (
              'v11_smod64_ctx'
              not in active
          ):

              raise SystemExit(
                  'V11 hoisted FASTMOD missing'
              )


          if (
              'selector_words'
              not in active
          ):

              raise SystemExit(
                  'V11 32-bit selector missing'
              )


          if (
              'pbuf_v'
              not in active or
              'buftmp_v'
              not in active
          ):

              raise SystemExit(
                  'V11 cached pbuf vectors missing'
              )


          if (
              'lazyLengthHash_port(1024, 64)'
              in clhash
          ):

              raise SystemExit(
                  'Constant PMULL still present'
              )


          if (
              '0x10000ULL'
              not in clhash
          ):

              raise SystemExit(
                  'Constant lazy hash missing'
              )


          if (
              '-flto=thin'
              not in makefile
          ):

              raise SystemExit(
                  'ThinLTO flag missing'
              )


          print(
              '======================================'
          )

          print(
              'V11 SOURCE VALIDATION: PASS'
          )

          print(
              '======================================'
          )

          PY


      # ==============================================================
      # SHOW IMPORTANT PATCHES
      # ==============================================================

      - name: Verify V11 source
        shell: bash
        run: |
          set -euo pipefail

          cd src


          echo "===== BUILD ====="

          grep -n \
            "A55-HOTCORE-V11" \
            api.cpp


          echo "===== FASTMOD V10 ====="

          grep -n \
            "v10_umod64_ctx" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== V11 FASTMOD CTX ====="

          grep -n \
            "v11_smod64_ctx" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== V11 SELECTOR ====="

          grep -n \
            "selector_words" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== BUFFER CACHE ====="

          grep -n \
            "pbuf_v" \
            verus/armv7/verus_clhash_portable.cpp


          grep -n \
            "buftmp_v" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== LOW32 XOR ====="

          grep -n \
            "v11_xor_low32" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== FIXRAND ====="

          grep -n \
            "fixrand\[i\] = prand_idx" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== CONSTANT PMULL REMOVAL ====="

          grep -n \
            "0x10000ULL" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== THIN LTO ====="

          grep -n \
            "flto=thin" \
            Makefile.am


      # ==============================================================
      # BUILD
      # ==============================================================

      - name: Make build script executable
        shell: bash
        run: |
          set -euo pipefail

          cd src

          chmod +x \
            scripts/build-android-ccminer.sh


      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          cd src

          docker build \
            -t ccminer-firestick-a55-v11 \
            -f build.Dockerfile \
            .


      - name: Build HOTCORE V11 armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            build-output


          mkdir -p \
            build-output


          docker run \
            --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v11 \
            arm


          echo "===== OUTPUT ====="

          find \
            build-output \
            -maxdepth 4 \
            -type f \
            -print


          echo "===== BUILD LOG ====="

          tail -n 400 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log


          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer


      # ==============================================================
      # BINARY INSPECTION
      # ==============================================================

      - name: Inspect HOTCORE V11 binary
        shell: bash
        run: |
          set -euo pipefail

          cd src


          BIN="build-output/ccminer-armeabi-v7a/bin/ccminer"


          echo "===== FILE ====="

          file \
            "$BIN"


          echo "===== BUILD ID ====="

          strings \
            "$BIN" |
            grep \
              "A55-HOTCORE-V11"


          echo "===== DIVISION HELPER ====="

          readelf \
            -Ws \
            "$BIN" |
            grep \
              "__aeabi_ldivmod" ||
            true


          echo "===== UDIV ====="

          if command -v llvm-objdump >/dev/null 2>&1
          then

              llvm-objdump \
                -d \
                "$BIN" |
                grep -m 30 \
                  -E "\budiv\b" ||
                true

          fi


          echo "===== SIZE ====="

          ls -lh \
            "$BIN"


      # ==============================================================
      # PACKAGE
      # ==============================================================

      - name: Prepare HOTCORE V11 package
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            dist


          mkdir -p \
            dist


          BIN="build-output/ccminer-armeabi-v7a/bin"


          cp \
            "$BIN/ccminer" \
            dist/ccminer-a55-hotcore-v11


          if test -f "$BIN/libc++_shared.so"
          then

              cp \
                "$BIN/libc++_shared.so" \
                dist/

          fi


          if test -f "$BIN/libomp.so"
          then

              cp \
                "$BIN/libomp.so" \
                dist/

          fi


          chmod +x \
            dist/ccminer-a55-hotcore-v11


          cat > dist/BUILDINFO.txt <<EOF
          Build:
          A55-HOTCORE-V11

          Stable base:
          A55-FASTMOD-V10

          V10 measured baseline:
          approximately 1.16 MH/s sustained

          V10 workflow commit:
          73446a48e954bcc579c302d5a01e3dfb71b2bd30

          V11 run-30 workflow:
          7f92ff0f8788f54781704ce8414915584450bd78

          ccminer source:
          7f30d6bfb64d0f3ba010191c5a185016ba46f454

          ABI:
          armeabi-v7a / AArch32

          CPU:
          Cortex-A55

          FASTMOD V10:
          preserved

          Hardware AES:
          preserved

          Hardware PMULL:
          preserved

          VQRDMULH:
          preserved

          Partial Haraka:
          preserved

          Full candidate replay:
          preserved

          Runtime Haraka validation:
          preserved

          V11 selector:
          split into 32-bit NEON lanes

          V11 outer loop:
          32-bit

          V11 rounds:
          32-bit

          V11 pbuf neighbour:
          precomputed

          V11 case 0x14:
          pbuf and buftmp vectors cached

          V11 case 0x14:
          control bits cached

          V11 case 0x18:
          pbuf and buftmp vectors cached

          V11 case 0x18:
          control bits cached

          V11 case 0x18:
          FASTMOD context hoisted outside rounds loop

          V11 modulo XOR:
          direct low32 NEON lane

          Duplicate fixrand stores:
          removed

          Duplicate fixrandex stores:
          removed

          lazyLengthHash(1024,64):
          constant 0x10000

          Constant per-hash PMULL:
          removed

          ThinLTO:
          enabled

          API:
          BUILD=A55-HOTCORE-V11
          EOF


          echo "===== SHA256 ====="

          sha256sum \
            dist/* |
            tee \
              dist/SHA256SUMS.txt


      # ==============================================================
      # UPLOAD
      # ==============================================================

      - name: Upload HOTCORE V11 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestick-a55-hotcore-v11-${{ github.run_number }}
          path: src/dist/
          if-no-files-found: error
          retention-days: 30
