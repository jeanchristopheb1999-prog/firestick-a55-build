      # ================================================================
      # V7 MULHRS CORRECTNESS
      # ================================================================

      - name: Verify MULHRS semantics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          def wrap16(x):
              x &= 0xffff

              return (
                  x - 0x10000
                  if x & 0x8000
                  else x
              )


          def reference(a, b):
              return wrap16(
                  (
                      (a * b) +
                      0x4000
                  ) >> 15
              )


          def arm_model(a, b):
              x = (
                  (
                      (a * b) +
                      0x4000
                  ) >> 15
              )


              if x > 32767:
                  x = 32767


              if x < -32768:
                  x = -32768


              if (
                  a == -32768 and
                  b == -32768
              ):
                  x = -32768


              return x


          tests = [
              (-32768, -32768),
              (-32768, 32767),
              (32767, 32767),
              (32767, -32768),
              (0, 0),
              (1, 1),
              (-1, -1),
              (12345, -23456),
              (-22222, 11111),
          ]


          for a, b in tests:
              r = reference(
                  a,
                  b
              )

              n = arm_model(
                  a,
                  b
              )


              print(
                  a,
                  b,
                  'reference=',
                  r,
                  'v8=',
                  n
              )


              if r != n:
                  raise SystemExit(
                      f'MULHRS mismatch: '
                      f'{a}, {b}'
                  )


          print(
              'MULHRS semantics PASSED'
          )

          PY


