name: FireStick A55 HOTCORE V11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==============================================================
      # BASES EXACTES VALIDÉES
      # ==============================================================

      - name: Checkout exact V8 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 6cf06bdd8f85afef8793180e6dd68b4a1a4fd9f0
          path: v8-base

      - name: Checkout exact V10 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 73446a48e954bcc579c302d5a01e3dfb71b2bd30
          path: v10-base

      - name: Checkout V11 run 30 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 7f92ff0f8788f54781704ce8414915584450bd78
          path: v11-base

      - name: Checkout pinned ccminer source
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454
          path: src


      # ==============================================================
      # RECONSTRUIT V10 EXACT + V11
      # ==============================================================

      - name: Apply corrected HOTCORE V11
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path
          import textwrap


          workflow = Path(
              '../v11-base/.github/workflows/firestick-a55.yml'
          ).read_text()


          lines = workflow.splitlines()

          blocks = []

          i = 0


          while i < len(lines):

              if lines[i].strip() == "python3 - <<'PY'":

                  start = i + 1

                  end = None


                  for j in range(start, len(lines)):

                      if lines[j].strip() == 'PY':

                          end = j

                          break


                  if end is None:

                      raise SystemExit(
                          'Unterminated Python block'
                      )


                  blocks.append(
                      textwrap.dedent(
                          '\n'.join(
                              lines[start:end]
                          )
                      )
                  )


                  i = end + 1

              else:

                  i += 1


          if len(blocks) < 3:

              raise SystemExit(
                  'Expected 3 V11 Python blocks, found '
                  + str(len(blocks))
              )


          # ==========================================================
          # BLOCK 1
          # RECONSTRUIT EXACTEMENT V10
          # ==========================================================

          print(
              '======================================'
          )

          print(
              'REPLAY EXACT V10'
          )

          print(
              '======================================'
          )


          exec(
              compile(
                  blocks[0],
                  'v10-replay.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          api = Path(
              'api.cpp'
          ).read_text()


          if 'BUILD=A55-FASTMOD-V10' not in api:

              raise SystemExit(
                  'Exact V10 replay failed'
              )


          # ==========================================================
          # BLOCK 2
          # PATCH V11 DU RUN #30
          #
          # On enlève seulement la fausse optimisation fixrand.
          # V10 contient déjà exactement un store nécessaire.
          # ==========================================================

          patch = blocks[1]


          section_start = patch.index(
              '# ==========================================================\n'
              '# REMOVE DUPLICATE FIXRAND STORES'
          )


          section_end = patch.index(
              '# ==========================================================\n'
              '# SANITY',
              section_start
          )


          replacement = r'''# ==========================================================
          # FIXRAND / FIXRANDEX
          #
          # Verified against actual V10:
          # exactly one required store each.
          # Keep them unchanged.
          # ==========================================================

          fix_count_before =
              active.count(
                  'fixrand[i] = prand_idx;'
              )


          fixex_count_before =
              active.count(
                  'fixrandex[i] = prandex_idx;'
              )


          if fix_count_before != 1:

              raise SystemExit(
                  'Expected one active fixrand store, got '
                  + str(fix_count_before)
              )


          if fixex_count_before != 1:

              raise SystemExit(
                  'Expected one active fixrandex store, got '
                  + str(fixex_count_before)
              )


          print(
              'fixrand bookkeeping already optimal'
          )


          '''


          # Python itself cannot split "=" this way,
          # so correct these two local statements before compilation.
          replacement = replacement.replace(
              '''fix_count_before =
              active.count(''',
              '''fix_count_before = active.count('''
          )


          replacement = replacement.replace(
              '''fixex_count_before =
              active.count(''',
              '''fixex_count_before = active.count('''
          )


          patch = (
              patch[:section_start]
              + replacement
              + patch[section_end:]
          )


          print(
              '======================================'
          )

          print(
              'APPLY HOTCORE V11'
          )

          print(
              '======================================'
          )


          compile(
              patch,
              'v11-hotcore.py',
              'exec'
          )


          exec(
              compile(
                  patch,
                  'v11-hotcore.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          # ==========================================================
          # IMPORTANT PRE-COMPILE FIX
          #
          # MIX2_EMU uses a local variable named "tmp":
          #
          #   tmp = _mm_unpacklo_epi32(...)
          #
          # The rewritten V11 case 0x14 must therefore declare:
          #
          #   __m128i tmp;
          #
          # The original code had it.
          # ==========================================================

          clhash_path = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          )


          clhash = clhash_path.read_text()


          active_start = clhash.index(
              '__verusclmulwithoutreduction64alignedrepeat_v2_1'
          )


          active_end = clhash.index(
              '// verus intermediate hash extra - v2.2',
              active_start
          )


          active = clhash[
              active_start:
              active_end
          ]


          case14_start = active.index(
              'case 0x14:'
          )


          case18_start = active.index(
              'case 0x18:',
              case14_start
          )


          case14 = active[
              case14_start:
              case18_start
          ]


          if 'MIX2_EMU' not in case14:

              raise SystemExit(
                  'case 0x14 MIX2_EMU missing'
              )


          if '__m128i tmp;' not in case14:

              brace = case14.index('{') + 1


              case14 = (
                  case14[:brace]
                  + '\n'
                  + '        __m128i tmp;\n'
                  + case14[brace:]
              )


              active = (
                  active[:case14_start]
                  + case14
                  + active[case18_start:]
              )


              clhash = (
                  clhash[:active_start]
                  + active
                  + clhash[active_end:]
              )


              clhash_path.write_text(
                  clhash
              )


              print(
                  'Added required __m128i tmp to case 0x14'
              )


          # ==========================================================
          # FINAL SOURCE VALIDATION
          # ==========================================================

          clhash = clhash_path.read_text()


          api = Path(
              'api.cpp'
          ).read_text()


          makefile = Path(
              'Makefile.am'
          ).read_text()


          active_start = clhash.index(
              '__verusclmulwithoutreduction64alignedrepeat_v2_1'
          )


          active_end = clhash.index(
              '// verus intermediate hash extra - v2.2',
              active_start
          )


          active = clhash[
              active_start:
              active_end
          ]


          # ----------------------------------------------------------
          # BUILD ID
          # ----------------------------------------------------------

          if 'BUILD=A55-HOTCORE-V11' not in api:

              raise SystemExit(
                  'V11 BUILD ID missing'
              )


          # ----------------------------------------------------------
          # V10 FASTMOD
          # ----------------------------------------------------------

          if 'v10_umod64_ctx' not in clhash:

              raise SystemExit(
                  'V10 FASTMOD core missing'
              )


          # ----------------------------------------------------------
          # V11 FASTMOD context hoisting
          # ----------------------------------------------------------

          if 'v11_smod64_ctx' not in active:

              raise SystemExit(
                  'V11 FASTMOD context helper missing'
              )


          if 'const v10_div32_ctx divctx' not in active:

              raise SystemExit(
                  'V11 hoisted division context missing'
              )


          # ----------------------------------------------------------
          # Selector split
          # ----------------------------------------------------------

          if 'selector_words' not in active:

              raise SystemExit(
                  '32-bit selector split missing'
              )


          if 'sel_lo' not in active:

              raise SystemExit(
                  'sel_lo missing'
              )


          if 'sel_hi' not in active:

              raise SystemExit(
                  'sel_hi missing'
              )


          # ----------------------------------------------------------
          # Cached buffers
          # ----------------------------------------------------------

          if active.count('pbuf_v') < 2:

              raise SystemExit(
                  'pbuf cache missing'
              )


          if active.count('buftmp_v') < 2:

              raise SystemExit(
                  'buftmp cache missing'
              )


          # ----------------------------------------------------------
          # Direct low32 XOR
          # ----------------------------------------------------------

          if 'v11_xor_low32' not in active:

              raise SystemExit(
                  'Direct low32 XOR missing'
              )


          # ----------------------------------------------------------
          # Required MIX2 temp
          # ----------------------------------------------------------

          case14_start = active.index(
              'case 0x14:'
          )


          case18_start = active.index(
              'case 0x18:',
              case14_start
          )


          case14 = active[
              case14_start:
              case18_start
          ]


          if '__m128i tmp;' not in case14:

              raise SystemExit(
                  'case14 tmp declaration missing'
              )


          # ----------------------------------------------------------
          # fixrand bookkeeping
          # ----------------------------------------------------------

          if (
              active.count(
                  'fixrand[i] = prand_idx;'
              )
              != 1
          ):

              raise SystemExit(
                  'Active fixrand store count != 1'
              )


          if (
              active.count(
                  'fixrandex[i] = prandex_idx;'
              )
              != 1
          ):

              raise SystemExit(
                  'Active fixrandex store count != 1'
              )


          # ----------------------------------------------------------
          # Constant PMULL eliminated
          # ----------------------------------------------------------

          if (
              'lazyLengthHash_port(1024, 64)'
              in clhash
          ):

              raise SystemExit(
                  'Constant lazyLengthHash PMULL survived'
              )


          if '0x10000ULL' not in clhash:

              raise SystemExit(
                  'Constant lazyLengthHash replacement missing'
              )


          # ----------------------------------------------------------
          # ThinLTO
          # ----------------------------------------------------------

          if '-flto=thin' not in makefile:

              raise SystemExit(
                  'ThinLTO flags missing'
              )


          print(
              '======================================'
          )

          print(
              'HOTCORE V11 SOURCE PREFLIGHT: PASS'
          )

          print(
              '======================================'
          )

          print(
              'V10 FASTMOD            : YES'
          )

          print(
              'V11 selector 32-bit    : YES'
          )

          print(
              'V11 cached buffers     : YES'
          )

          print(
              'V11 div context hoist  : YES'
          )

          print(
              'V11 direct low32 XOR   : YES'
          )

          print(
              'case14 MIX2 tmp        : YES'
          )

          print(
              'constant PMULL removed : YES'
          )

          print(
              'ThinLTO                : YES'
          )

          print(
              'BUILD=A55-HOTCORE-V11'
          )

          PY


      # ==============================================================
      # SEMANTIC TESTS
      #
      # Completely rewritten.
      # Does NOT reuse the broken Python from run #30/#32.
      # ==============================================================

      - name: Verify HOTCORE V11 semantics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import random


          MASK32 = 0xffffffff
          MASK64 = 0xffffffffffffffff


          # ==========================================================
          # CARRYLESS MULTIPLICATION CONSTANT
          # ==========================================================

          def clmul64(a, b):

              result = 0

              for shift in range(64):

                  if (a >> shift) & 1:

                      result ^= b << shift


              return result


          assert clmul64(
              64,
              1024
          ) == 0x10000


          print(
              'constant CLMUL: PASS'
          )


          # ==========================================================
          # SELECTOR 64 -> 2x32 EQUIVALENCE
          # ==========================================================

          random.seed(
              0xA5511
          )


          for _ in range(
              1000000
          ):

              selector = random.getrandbits(
                  64
              )


              lo = selector & MASK32

              hi = selector >> 32

              keymask = 511


              assert (
                  ((selector >> 5) & keymask)
                  ==
                  ((lo >> 5) & keymask)
              )


              assert (
                  ((selector >> 32) & keymask)
                  ==
                  (hi & keymask)
              )


              assert (
                  (selector & 3)
                  ==
                  (lo & 3)
              )


              assert (
                  (selector & 0x1c)
                  ==
                  (lo & 0x1c)
              )


              assert (
                  (selector >> 61)
                  ==
                  (hi >> 29)
              )


              original_delta = (
                  ((selector & 1) << 1)
                  - 1
              )


              new_delta = (
                  1
                  if lo & 1
                  else -1
              )


              assert (
                  original_delta
                  ==
                  new_delta
              )


              control_bits = (
                  (lo >> 28)
                  |
                  ((hi << 4) & MASK32)
              )


              for rounds in range(8):

                  old = bool(
                      selector
                      &
                      (
                          0x10000000
                          << rounds
                      )
                  )


                  new = bool(
                      control_bits
                      &
                      (
                          1
                          << rounds
                      )
                  )


                  assert old == new


          print(
              '1,000,000 selector equivalence tests: PASS'
          )


          # ==========================================================
          # DIRECT LOW32 XOR
          # ==========================================================

          for _ in range(
              250000
          ):

              lanes = [
                  random.getrandbits(32)
                  for _ in range(4)
              ]


              value = random.getrandbits(
                  32
              )


              expected = [
                  lanes[0] ^ value,
                  lanes[1],
                  lanes[2],
                  lanes[3],
              ]


              actual = list(
                  lanes
              )


              actual[0] ^= value


              assert (
                  actual
                  ==
                  expected
              )


          print(
              '250,000 low32 XOR tests: PASS'
          )


          # ==========================================================
          # V10/V11 FAST MODULO MODEL
          # ==============================================================

          def u32(x):

              return x & MASK32


          def umod32(n, d):

              q = n // d

              return u32(
                  n - q * d
              )


          def fast_umod64_32(
              numerator,
              d
          ):

              if d == 1:

                  return 0


              u1 = (
                  numerator
                  >> 32
              ) & MASK32


              u0 = (
                  numerator
                  & MASK32
              )


              if u1 >= d:

                  u1 = umod32(
                      u1,
                      d
                  )


              if u1 == 0:

                  return umod32(
                      u0,
                      d
                  )


              shift = (
                  32
                  -
                  d.bit_length()
              )


              vn = u32(
                  d << shift
              )


              vn1 = vn >> 16

              vn0 = vn & 0xffff


              if shift:

                  un32 = u32(
                      (u1 << shift)
                      |
                      (
                          u0
                          >>
                          (
                              32
                              -
                              shift
                          )
                      )
                  )


                  un10 = u32(
                      u0 << shift
                  )

              else:

                  un32 = u1

                  un10 = u0


              un1 = un10 >> 16

              un0 = un10 & 0xffff


              q1 = un32 // vn1

              rhat = u32(
                  un32
                  -
                  q1 * vn1
              )


              while (
                  q1 >= 0x10000
                  or
                  q1 * vn0
                  >
                  (
                      (rhat << 16)
                      +
                      un1
                  )
              ):

                  q1 = u32(
                      q1 - 1
                  )


                  rhat = u32(
                      rhat + vn1
                  )


                  if rhat >= 0x10000:

                      break


              un21 = u32(
                  (un32 << 16)
                  +
                  un1
                  -
                  q1 * vn
              )


              q0 = un21 // vn1

              rhat = u32(
                  un21
                  -
                  q0 * vn1
              )


              while (
                  q0 >= 0x10000
                  or
                  q0 * vn0
                  >
                  (
                      (rhat << 16)
                      +
                      un0
                  )
              ):

                  q0 = u32(
                      q0 - 1
                  )


                  rhat = u32(
                      rhat + vn1
                  )


                  if rhat >= 0x10000:

                      break


              rem = u32(
                  (un21 << 16)
                  +
                  un0
                  -
                  q0 * vn
              )


              return rem >> shift


          def c_remainder(
              dividend,
              divisor
          ):

              quotient = (
                  abs(dividend)
                  //
                  abs(divisor)
              )


              if (
                  (dividend < 0)
                  !=
                  (divisor < 0)
              ):

                  quotient = -quotient


              return (
                  dividend
                  -
                  quotient * divisor
              )


          def fast_signed_mod(
              dividend,
              divisor
          ):

              raw = (
                  dividend
                  & MASK64
              )


              if dividend < 0:

                  magnitude = (
                      (~raw + 1)
                      & MASK64
                  )

              else:

                  magnitude = raw


              d = (
                  -divisor
                  if divisor < 0
                  else divisor
              )


              remainder = fast_umod64_32(
                  magnitude,
                  d
              )


              if dividend < 0:

                  return -remainder


              return remainder


          # Edge cases
          edge_dividends = [
              -(1 << 63),
              -(1 << 63) + 1,
              -0x7fffffffffffffff,
              -1234567890123456789,
              -0x100000000,
              -1,
              0,
              1,
              0xffffffff,
              0x100000000,
              1234567890123456789,
              (1 << 63) - 1,
          ]


          edge_divisors = [
              -(1 << 31),
              -2147483647,
              -65536,
              -3,
              -2,
              -1,
              1,
              2,
              3,
              65536,
              2147483646,
              2147483647,
          ]


          for dividend in edge_dividends:

              for divisor in edge_divisors:

                  assert (
                      fast_signed_mod(
                          dividend,
                          divisor
                      )
                      ==
                      c_remainder(
                          dividend,
                          divisor
                      )
                  )


          print(
              'FASTMOD edge cases: PASS'
          )


          for _ in range(
              500000
          ):

              dividend = random.randint(
                  -(1 << 63),
                  (1 << 63) - 1
              )


              divisor = random.randint(
                  -(1 << 31),
                  (1 << 31) - 1
              )


              if divisor == 0:

                  divisor = 1


              assert (
                  fast_signed_mod(
                      dividend,
                      divisor
                  )
                  ==
                  c_remainder(
                      dividend,
                      divisor
                  )
              )


          print(
              '500,000 FASTMOD tests: PASS'
          )


          print(
              '======================================'
          )

          print(
              'HOTCORE V11 SEMANTICS: PASS'
          )

          print(
              '======================================'
          )

          PY


      # ==============================================================
      # SOURCE CHECK
      # ==============================================================

      - name: Verify HOTCORE V11 source
        shell: bash
        run: |
          set -euo pipefail

          cd src


          echo "===== BUILD ====="

          grep -n \
            "A55-HOTCORE-V11" \
            api.cpp


          echo "===== HARDWARE AES ====="

          grep -n \
            "v8_aesenc_vec" \
            verus/armv7/haraka_portable.h


          echo "===== HARDWARE PMULL ====="

          grep -n \
            "vmull.p64" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== VQRDMULH ====="

          grep -n \
            "vqrdmulhq_s16" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== FASTMOD V10 ====="

          grep -n \
            "v10_umod64_ctx" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== FASTMOD V11 CONTEXT ====="

          grep -n \
            "v11_smod64_ctx" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== SELECTOR 32 BIT ====="

          grep -n \
            "selector_words" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== CACHED PBUF ====="

          grep -n \
            "pbuf_v" \
            verus/armv7/verus_clhash_portable.cpp


          grep -n \
            "buftmp_v" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== MIX2 TMP ====="

          grep -n \
            "__m128i tmp;" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== DIRECT LOW32 XOR ====="

          grep -n \
            "v11_xor_low32" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== CONSTANT CLMUL ====="

          grep -n \
            "0x10000ULL" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== THIN LTO ====="

          grep -n \
            "flto=thin" \
            Makefile.am


      # ==============================================================
      # BUILD
      # ==============================================================

      - name: Make build script executable
        shell: bash
        run: |
          set -euo pipefail

          cd src

          chmod +x \
            scripts/build-android-ccminer.sh


      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          cd src

          docker build \
            -t ccminer-firestick-a55-v11 \
            -f build.Dockerfile \
            .


      - name: Build HOTCORE V11 armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf build-output

          mkdir -p build-output


          docker run \
            --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v11 \
            arm


          echo "===== OUTPUT ====="

          find \
            build-output \
            -maxdepth 4 \
            -type f \
            -print


          echo "===== BUILD LOG ====="

          tail -n 400 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log


          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer


      # ==============================================================
      # BINARY INSPECTION
      # ==============================================================

      - name: Inspect HOTCORE V11 binary
        shell: bash
        run: |
          set -euo pipefail

          cd src


          BIN="build-output/ccminer-armeabi-v7a/bin/ccminer"


          echo "===== FILE ====="

          file "$BIN"


          echo "===== BUILD ID ====="

          strings "$BIN" |
            grep \
              "A55-HOTCORE-V11"


          echo "===== UDIV ====="

          if command -v llvm-objdump >/dev/null 2>&1
          then

              llvm-objdump \
                -d \
                "$BIN" |
                grep -m 40 \
                  -E "\budiv\b" ||
                true

          fi


          echo "===== REMAINING AEABI LDIVMOD ====="

          readelf \
            -Ws \
            "$BIN" |
            grep \
              "__aeabi_ldivmod" ||
            true


          echo "===== SIZE ====="

          ls -lh "$BIN"


      # ==============================================================
      # PACKAGE
      # ==============================================================

      - name: Prepare HOTCORE V11 package
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf dist

          mkdir -p dist


          BIN="build-output/ccminer-armeabi-v7a/bin"


          cp \
            "$BIN/ccminer" \
            dist/ccminer-a55-hotcore-v11


          if test -f "$BIN/libc++_shared.so"
          then

              cp \
                "$BIN/libc++_shared.so" \
                dist/

          fi


          if test -f "$BIN/libomp.so"
          then

              cp \
                "$BIN/libomp.so" \
                dist/

          fi


          chmod +x \
            dist/ccminer-a55-hotcore-v11


          cat > dist/BUILDINFO.txt <<EOF
          Build:
