name: FireStick A55 HOTPATH V8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pinned ccminer ARM source
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454

      - name: Patch FireStick A55 V8
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(
                      f'Expected code not found in {path}: {old}'
                  )
              p.write_text(s.replace(old, new, 1))

          # ============================================================
          # CPU TARGET
          # AArch32 + ARMv8 crypto + Cortex-A55
          # Free frame pointer register for the very register-heavy path.
          # ============================================================
          replace_once(
              'Makefile.am',
              'SHARED_CPPFLAGS += -march=armv7-a -mfpu=neon -mfloat-abi=softfp',
              'SHARED_CPPFLAGS += -march=armv8-a+crypto -mtune=cortex-a55 -mfpu=crypto-neon-fp-armv8 -mfloat-abi=softfp -fomit-frame-pointer'
          )

          # ============================================================
          # V3 SIGBUS / ALIGNMENT FIXES
          # ============================================================
          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t _ALIGN(4)  blockhash_half[64] = { 0 };',
              'alignas(32) uint8_t blockhash_half[64] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              '__m128i *data_key =  (__m128i*)malloc(VERUS_KEY_SIZE + 1024);',
              '''__m128i *data_key = NULL;
              if (posix_memalign(
                      (void **)&data_key,
                      64,
                      VERUS_KEY_SIZE + 1024
                  ) != 0 || !data_key)
              {
                  return 0;
              }'''
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t  full_data[140 + 3 + 1344] = { 0 };',
              'alignas(16) uint8_t full_data[140 + 3 + 1344] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t nonceSpace[15] = {0};',
              'alignas(16) uint8_t nonceSpace[16] = {0};'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint32_t  vhash[8] = { 0 };',
              'alignas(16) uint32_t vhash[8] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              '((uint32_t *)(&nonceSpace[11]))[0] = nonce_buf;',
              'memcpy(&nonceSpace[11], &nonce_buf, sizeof(nonce_buf));'
          )

          # Align CLHash mutation indices.
          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint32_t fixrand[32];',
              'alignas(64) uint32_t fixrand[32];'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint32_t fixrandex[32];',
              'alignas(64) uint32_t fixrandex[32];'
          )

          # ============================================================
          # V4 HARDWARE AES
          # Keep original full Haraka path as known-good cold/reference.
          # ============================================================
          p = Path('verus/armv7/haraka_portable.c')
          s = p.read_text()

          start = s.index(
              'void aesenc(unsigned char *s, const unsigned char *rk)'
          )

          end = s.index(
              '\n// Simulate _mm_unpacklo_epi32',
              start
          )

          hw_aes = r'''void aesenc(
              unsigned char *s,
              const unsigned char *rk
          )
          {
              uint8x16_t state =
                  vld1q_u8((const uint8_t *)s);

              const uint8x16_t zero =
                  vdupq_n_u8(0);

              state =
                  vaeseq_u8(state, zero);

              state =
                  vaesmcq_u8(state);

              state =
                  veorq_u8(
                      state,
                      vld1q_u8((const uint8_t *)rk)
                  );

              vst1q_u8(
                  (uint8_t *)s,
                  state
              );
          }
          '''

          p.write_text(
              s[:start] +
              hw_aes +
              s[end:]
          )

          # ============================================================
          # HARAKA HEADER
          # Preserve SIGBUS-safe returns from V3.
          # ============================================================
          p = Path('verus/armv7/haraka_portable.h')
          s = p.read_text()

          unsafe = 'return *(__m128i *)result;'

          if s.count(unsafe) != 2:
              raise SystemExit(
                  f'Expected 2 unsafe Haraka returns, '
                  f'found {s.count(unsafe)}'
              )

          s = s.replace(
              unsafe,
              'return vreinterpretq_m128i_u32(vld1q_u32(result));'
          )

          # ============================================================
          # V8 CLHASH AES
          #
          # OLD:
          #   call aesenc()
          #   load vector from memory
          #   AES
          #   store vector
          #   repeat...
          #
          # NEW:
          #   vector stays in NEON register
          #   AESE + AESMC + XOR directly
          # ============================================================
          start = s.index(
              'void aesenc(unsigned char *s, const unsigned char *rk)'
          )

          end = s.index(
              '\ntypedef unsigned int uint32_t;',
              start
          )

          fast_aes_header = r'''void aesenc(
              unsigned char *s,
              const unsigned char *rk
          );

          static inline __attribute__((always_inline))
          __m128i v8_aesenc_vec(
              __m128i state,
              __m128i round_key
          )
          {
              uint8x16_t v =
                  vreinterpretq_u8_s32(state);

              const uint8x16_t zero =
                  vdupq_n_u8(0);

              v =
                  vaeseq_u8(
                      v,
                      zero
                  );

              v =
                  vaesmcq_u8(v);

              v =
                  veorq_u8(
                      v,
                      vreinterpretq_u8_s32(round_key)
                  );

              return
                  vreinterpretq_s32_u8(v);
          }

          #define AES2_EMU(s0, s1, rci) do { \
              (s0) = v8_aesenc_vec((s0), rc[(rci)]); \
              (s1) = v8_aesenc_vec((s1), rc[(rci) + 1]); \
              (s0) = v8_aesenc_vec((s0), rc[(rci) + 2]); \
              (s1) = v8_aesenc_vec((s1), rc[(rci) + 3]); \
          } while (0)
          '''

          s = (
              s[:start] +
              fast_aes_header +
              s[end:]
          )

          p.write_text(s)

          # ============================================================
          # CLHASH V8
          # ============================================================
          p = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          )

          s = p.read_text()

          # ------------------------------------------------------------
          # Preserve safe vector returns.
          # ------------------------------------------------------------
          unsafe = 'return *(__m128i *)result;'

          if s.count(unsafe) != 3:
              raise SystemExit(
                  f'Expected 3 unsafe CLHash returns, '
                  f'found {s.count(unsafe)}'
              )

          s = s.replace(
              unsafe,
              '''__m128i out;
              memcpy(&out, result, sizeof(out));
              return out;'''
          )

          # ------------------------------------------------------------
          # Force tiny hot helpers inline.
          # ------------------------------------------------------------
          s = s.replace(
              '__m128i _mm_setr_epi8_emu(',
              'static inline __attribute__((always_inline)) '
              '__m128i _mm_setr_epi8_emu(',
              1
          )

          s = s.replace(
              '__m128i _mm_xor_si128_emu(',
              'static inline __attribute__((always_inline)) '
              '__m128i _mm_xor_si128_emu(',
              1
          )

          # ------------------------------------------------------------
          # Safe + forced-inline unaligned NEON load.
          # ------------------------------------------------------------
          start = s.index(
              '__m128i _mm_load_si128_emu(const void *p)'
          )

          end = s.index(
              '\n void _mm_store_si128_emu',
              start
          )

          safe_load = r'''static inline __attribute__((always_inline))
          __m128i _mm_load_si128_emu(const void *p)
          {
              return
                  vreinterpretq_s32_u8(
                      vld1q_u8(
                          (const uint8_t *)p
                      )
                  );
          }
          '''

          s = (
              s[:start] +
              safe_load +
              s[end:]
          )

          # ------------------------------------------------------------
          # Safe + forced-inline store.
          # ------------------------------------------------------------
          start = s.index(
              'void _mm_store_si128_emu(void *p, __m128i val)'
          )

          end = s.index(
              '\n__m128i _mm_shuffle_epi8_emu',
              start
          )

          safe_store = r'''static inline __attribute__((always_inline))
          void _mm_store_si128_emu(
              void *p,
              __m128i val
          )
          {
              vst1q_u8(
                  (uint8_t *)p,
                  vreinterpretq_u8_s32(val)
              );
          }
          '''

          s = (
              s[:start] +
              safe_store +
              s[end:]
          )

          # ------------------------------------------------------------
          # V8 NEON PSHUFB
          #
          # Replaces the scalar 16-iteration byte shuffle with
          # AArch32 VTBL on two 64-bit halves.
          # ------------------------------------------------------------
          start = s.index(
              '__m128i _mm_shuffle_epi8_emu'
          )

          end = s.index(
              '\n// portable\n__m128i lazyLengthHash_port',
              start
          )

          neon_shuffle = r'''static inline __attribute__((always_inline))
          __m128i _mm_shuffle_epi8_emu(
              __m128i a,
              __m128i b
          )
          {
              const uint8x16_t av =
                  vreinterpretq_u8_s32(a);

              const uint8x16_t bv =
                  vreinterpretq_u8_s32(b);

              uint8x8x2_t table;

              table.val[0] =
                  vget_low_u8(av);

              table.val[1] =
                  vget_high_u8(av);

              // x86 PSHUFB uses low 4 bits as table index.
              uint8x16_t index =
                  vandq_u8(
                      bv,
                      vdupq_n_u8(0x0f)
                  );

              // If input selector bit 7 is set,
              // x86 PSHUFB returns zero.
              const uint8x16_t zero_mask =
                  vcgeq_u8(
                      bv,
                      vdupq_n_u8(0x80)
                  );

              index =
                  vbslq_u8(
                      zero_mask,
                      vdupq_n_u8(0xff),
                      index
                  );

              const uint8x8_t lo =
                  vtbl2_u8(
                      table,
                      vget_low_u8(index)
                  );

              const uint8x8_t hi =
                  vtbl2_u8(
                      table,
                      vget_high_u8(index)
                  );

              return
                  vreinterpretq_s32_u8(
                      vcombine_u8(
                          lo,
                          hi
                      )
                  );
          }
          '''

          s = (
              s[:start] +
              neon_shuffle +
              s[end:]
          )

          # ============================================================
          # V5 ZERO-COPY HARDWARE PMULL
          # ============================================================
          start = s.index(
              '__m128i _mm_clmulepi64_si128_emu'
          )

          end = s.index(
              '\n__m128i _mm_mulhrs_epi16_emu',
              start
          )

          zero_copy_pmull = r'''static inline __attribute__((always_inline))
          __m128i _mm_clmulepi64_si128_emu(
              const __m128i &a,
              const __m128i &b,
              int imm
          )
          {
              const uint64x2_t av =
                  vreinterpretq_u64_s32(a);

              const uint64x2_t bv =
                  vreinterpretq_u64_s32(b);

              const uint64x1_t va =
                  (imm & 1)
                      ? vget_high_u64(av)
                      : vget_low_u64(av);

              const uint64x1_t vb =
                  (imm & 0x10)
                      ? vget_high_u64(bv)
                      : vget_low_u64(bv);

              uint64x2_t product;

              __asm__ volatile(
                  "vmull.p64 %q0, %P1, %P2"
                  : "=w"(product)
                  : "w"(va), "w"(vb)
              );

              return
                  vreinterpretq_s32_u64(product);
          }
          '''

          s = (
              s[:start] +
              zero_copy_pmull +
              s[end:]
          )

          # ============================================================
          # V7 VQRDMULH — preserve champion implementation.
          # ============================================================
          start = s.index(
              '__m128i _mm_mulhrs_epi16_emu'
          )

          end = s.index(
              '__m128i _mm_set_epi64x_emu',
              start
          )

          vqrdmulh = r'''static inline __attribute__((always_inline))
          __m128i _mm_mulhrs_epi16_emu(
              __m128i a,
              __m128i b
          )
          {
              const int16x8_t va =
                  vreinterpretq_s16_s32(a);

              const int16x8_t vb =
                  vreinterpretq_s16_s32(b);

              int16x8_t result =
                  vqrdmulhq_s16(
                      va,
                      vb
                  );

              const int16x8_t min16 =
                  vdupq_n_s16(
                      (int16_t)-32768
                  );

              const uint16x8_t a_min =
                  vceqq_s16(
                      va,
                      min16
                  );

              const uint16x8_t b_min =
                  vceqq_s16(
                      vb,
                      min16
                  );

              const uint16x8_t overflow =
                  vandq_u16(
                      a_min,
                      b_min
                  );

              result =
                  vbslq_s16(
                      overflow,
                      min16,
                      result
                  );

              return
                  vreinterpretq_s32_s16(result);
          }

          '''

          s = (
              s[:start] +
              vqrdmulh +
              s[end:]
          )

          # ------------------------------------------------------------
          # V8 register-only scalar/vector bridge helpers.
          #
          # Selector extraction happens every CLHash round.
          # Remove pointer aliasing / stack roundtrips.
          # ------------------------------------------------------------
          start = s.index(
              '__m128i _mm_set_epi64x_emu'
          )

          end = s.index(
              '\n__m128i _mm_cvtsi32_si128_emu',
              start
          )

          register_bridges = r'''static inline __attribute__((always_inline))
          __m128i _mm_set_epi64x_emu(
              uint64_t hi,
              uint64_t lo
          )
          {
              const uint64x2_t v =
                  vcombine_u64(
                      vcreate_u64(lo),
                      vcreate_u64(hi)
                  );

              return
                  vreinterpretq_s32_u64(v);
          }

          static inline __attribute__((always_inline))
          __m128i _mm_cvtsi64_si128_emu(
              uint64_t lo
          )
          {
              const uint64x2_t v =
                  vcombine_u64(
                      vcreate_u64(lo),
                      vdup_n_u64(0)
                  );

              return
                  vreinterpretq_s32_u64(v);
          }

          static inline __attribute__((always_inline))
          int64_t _mm_cvtsi128_si64_emu(
              __m128i &a
          )
          {
              return
                  vget_lane_s64(
                      vget_low_s64(
                          vreinterpretq_s64_s32(a)
                      ),
                      0
                  );
          }

          static inline __attribute__((always_inline))
          int32_t _mm_cvtsi128_si32_emu(
              __m128i &a
          )
          {
              return
                  vgetq_lane_s32(
                      a,
                      0
                  );
          }
          '''

          s = (
              s[:start] +
              register_bridges +
              s[end:]
          )

          p.write_text(s)

          # ============================================================
          # VERUSSCAN V8 HOT PATH
          # ============================================================
          p = Path(
              'verus/armv7/verusscan.cpp'
          )

          s = p.read_text()

          # ------------------------------------------------------------
          # No TLS variable needed for a constant throughput of 1.
          # ------------------------------------------------------------
          s = s.replace(
              'static __thread uint32_t throughput = 0;',
              '/* V8: throughput is a compile-time constant of one. */',
              1
          )

          # ------------------------------------------------------------
          # FixKey:
          # force inline + fully unroll the 32 mutation restorations.
          # ------------------------------------------------------------
          start = s.index(
              'extern "C" inline void FixKey'
          )

          end = s.index(
              'extern "C" inline void VerusHashHalf',
              start
          )

          fixkey_and_v8_haraka = r'''extern "C"
          __attribute__((always_inline))
          inline void FixKey(
              uint32_t *fixrand,
              uint32_t *fixrandex,
              __m128i *keyback,
              __m128i *g_prand,
              __m128i *g_prandex
          )
          {
          #pragma clang loop unroll(full)
              for (int i = 31; i >= 0; --i)
              {
                  keyback[fixrandex[i]] =
                      g_prandex[i];

                  keyback[fixrand[i]] =
                      g_prand[i];
              }
          }


          // ==========================================================
          // V8 FAST KEYED HARAKA WORD-7
          //
          // Mining hot loop only compares vhash[7].
          //
          // Full Haraka does:
          //   5 x (8 AES operations + MIX4)
          //
          // To obtain output word 7 we only need:
          //   - rounds 1..3 complete
          //   - round 4 AES complete
          //   - only the dependency feeding state-2 from round-4 MIX
          //   - only state-2's two AES operations in round 5
          //   - one 32-bit feed-forward XOR
          //
          // 34 AES operations instead of 40,
          // all state held in NEON registers.
          // ==========================================================

          static inline __attribute__((always_inline))
          uint8x16_t v8_haraka_aes(
              uint8x16_t state,
              uint8x16_t key
          )
          {
              const uint8x16_t zero =
                  vdupq_n_u8(0);

              state =
                  vaeseq_u8(
                      state,
                      zero
                  );

              state =
                  vaesmcq_u8(state);

              return
                  veorq_u8(
                      state,
                      key
                  );
          }


          static inline __attribute__((always_inline))
          uint8x16_t v8_unpacklo32(
              uint8x16_t a,
              uint8x16_t b
          )
          {
              const int32x4_t ai =
                  vreinterpretq_s32_u8(a);

              const int32x4_t bi =
                  vreinterpretq_s32_u8(b);

              const int32x2x2_t z =
                  vzip_s32(
                      vget_low_s32(ai),
                      vget_low_s32(bi)
                  );

              return
                  vreinterpretq_u8_s32(
                      vcombine_s32(
                          z.val[0],
                          z.val[1]
                      )
                  );
          }


          static inline __attribute__((always_inline))
          uint8x16_t v8_unpackhi32(
              uint8x16_t a,
              uint8x16_t b
          )
          {
              const int32x4_t ai =
                  vreinterpretq_s32_u8(a);

              const int32x4_t bi =
                  vreinterpretq_s32_u8(b);

              const int32x2x2_t z =
                  vzip_s32(
                      vget_high_s32(ai),
                      vget_high_s32(bi)
                  );

              return
                  vreinterpretq_u8_s32(
                      vcombine_s32(
                          z.val[0],
                          z.val[1]
                      )
                  );
          }


          static inline __attribute__((always_inline))
          void v8_haraka512_word7(
              unsigned char *out,
              const unsigned char *in,
              const __m128i *rc
          )
          {
              uint8x16_t s0 =
                  vld1q_u8(in);

              uint8x16_t s1 =
                  vld1q_u8(in + 16);

              uint8x16_t s2 =
                  vld1q_u8(in + 32);

              uint8x16_t s3 =
                  vld1q_u8(in + 48);

              // Rounds 0, 1, 2: complete.
          #pragma clang loop unroll(full)
              for (int round = 0; round < 3; ++round)
              {
                  const int r =
                      round * 8;

                  s0 = v8_haraka_aes(
                      s0,
                      vreinterpretq_u8_s32(rc[r + 0])
                  );

                  s1 = v8_haraka_aes(
                      s1,
                      vreinterpretq_u8_s32(rc[r + 1])
                  );

                  s2 = v8_haraka_aes(
                      s2,
                      vreinterpretq_u8_s32(rc[r + 2])
                  );

                  s3 = v8_haraka_aes(
                      s3,
                      vreinterpretq_u8_s32(rc[r + 3])
                  );

                  s0 = v8_haraka_aes(
                      s0,
                      vreinterpretq_u8_s32(rc[r + 4])
                  );

                  s1 = v8_haraka_aes(
                      s1,
                      vreinterpretq_u8_s32(rc[r + 5])
                  );

                  s2 = v8_haraka_aes(
                      s2,
                      vreinterpretq_u8_s32(rc[r + 6])
                  );

                  s3 = v8_haraka_aes(
                      s3,
                      vreinterpretq_u8_s32(rc[r + 7])
                  );

                  const uint8x16_t t =
                      v8_unpacklo32(
                          s0,
                          s1
                      );

                  const uint8x16_t a =
                      v8_unpackhi32(
                          s0,
                          s1
                      );

                  const uint8x16_t b =
                      v8_unpacklo32(
                          s2,
                          s3
                      );

                  const uint8x16_t c =
                      v8_unpackhi32(
                          s2,
                          s3
                      );

                  s3 =
                      v8_unpacklo32(
                          a,
                          c
                      );

                  s0 =
                      v8_unpackhi32(
                          a,
                          c
                      );

                  s2 =
                      v8_unpackhi32(
                          b,
                          t
                      );

                  s1 =
                      v8_unpacklo32(
                          b,
                          t
                      );
              }

              // Round 3 AES layer: complete.
              const int r = 24;

              s0 = v8_haraka_aes(
                  s0,
                  vreinterpretq_u8_s32(rc[r + 0])
              );

              s1 = v8_haraka_aes(
                  s1,
                  vreinterpretq_u8_s32(rc[r + 1])
              );

              s2 = v8_haraka_aes(
                  s2,
                  vreinterpretq_u8_s32(rc[r + 2])
              );

              s3 = v8_haraka_aes(
                  s3,
                  vreinterpretq_u8_s32(rc[r + 3])
              );

              s0 = v8_haraka_aes(
                  s0,
                  vreinterpretq_u8_s32(rc[r + 4])
              );

              s1 = v8_haraka_aes(
                  s1,
                  vreinterpretq_u8_s32(rc[r + 5])
              );

              s2 = v8_haraka_aes(
                  s2,
                  vreinterpretq_u8_s32(rc[r + 6])
              );

              s3 = v8_haraka_aes(
                  s3,
                  vreinterpretq_u8_s32(rc[r + 7])
              );

              // From round-3 MIX we only need the vector that
              // becomes state 2 for the final AES round.
              const uint8x16_t t =
                  v8_unpacklo32(
                      s0,
                      s1
                  );

              const uint8x16_t b =
                  v8_unpacklo32(
                      s2,
                      s3
                  );

              s2 =
                  v8_unpackhi32(
                      b,
                      t
                  );

              // Final Haraka round:
              // output word 7 depends only on state 2.
              s2 = v8_haraka_aes(
                  s2,
                  vreinterpretq_u8_s32(rc[34])
              );

              s2 = v8_haraka_aes(
                  s2,
                  vreinterpretq_u8_s32(rc[38])
              );

              // Final MIX maps pre-mix state2 lane 2
              // into output bytes 28..31.
              uint32_t word7 =
                  vgetq_lane_u32(
                      vreinterpretq_u32_u8(s2),
                      2
                  );

              uint32_t input_word7;

              memcpy(
                  &input_word7,
                  in + 52,
                  sizeof(input_word7)
              );

              word7 ^=
                  input_word7;

              memcpy(
                  out + 28,
                  &word7,
                  sizeof(word7)
              );
          }


          '''

          s = (
              s[:start] +
              fixkey_and_v8_haraka +
              s[end:]
          )

          # ------------------------------------------------------------
          # Replace Verus2hash with:
          #
          #   HOT: partial register Haraka word7
          #   COLD: original complete Haraka for candidate resolution
          #
          # The first call PER THREAD cross-checks V8 against the
          # original full Haraka implementation automatically.
          # ------------------------------------------------------------
          start = s.index(
              'extern "C" void inline Verus2hash'
          )

          end = s.index(
              '#ifdef _WIN32',
              start
          )

          verus2_v8 = r'''static __thread int
          v8_haraka_fast_state = 0;
          //  0 = not tested
          //  1 = fast path verified
          // -1 = automatic fallback to full reference path


          extern "C"
          __attribute__((always_inline))
          inline void Verus2hash(
              unsigned char *hash,
              unsigned char *curBuf,
              unsigned char *nonce,
              __m128i * __restrict data_key,
              uint8_t *gpu_init,
              uint32_t *fixrand,
              uint32_t *fixrandex,
              __m128i *g_prand,
              __m128i *g_prandex,
              int version
          )
          {
              (void)gpu_init;
              (void)version;

              memcpy(
                  curBuf + 47,
                  curBuf,
                  16
              );

              memcpy(
                  curBuf + 63,
                  curBuf,
                  1
              );

              memcpy(
                  curBuf + 32,
                  nonce,
                  15
              );

              uint64_t intermediate =
                  verusclhashv2_2(
                      data_key,
                      curBuf,
                      511,
                      fixrand,
                      fixrandex,
                      g_prand,
                      g_prandex
                  );

              memcpy(
                  curBuf + 47,
                  &intermediate,
                  8
              );

              memcpy(
                  curBuf + 55,
                  &intermediate,
                  8
              );

              memcpy(
                  curBuf + 63,
                  &intermediate,
                  1
              );

              intermediate &=
                  511;

              const __m128i *round_keys =
                  data_key + intermediate;

              if (__builtin_expect(
                      v8_haraka_fast_state < 0,
                      0
                  ))
              {
                  // Automatic correctness fallback.
                  haraka512_port_keyed(
                      hash,
                      curBuf,
                      round_keys
                  );
              }
              else
              {
                  // V8 hot path.
                  v8_haraka512_word7(
                      hash,
                      curBuf,
                      round_keys
                  );

                  // One-time per-thread bit-exact self-test.
                  if (__builtin_expect(
                          v8_haraka_fast_state == 0,
                          0
                      ))
                  {
                      alignas(16)
                      uint32_t reference_hash[8] =
                          { 0 };

                      haraka512_port_keyed(
                          (unsigned char *)
                              reference_hash,
                          curBuf,
                          round_keys
                      );

                      uint32_t fast_word7;

                      memcpy(
                          &fast_word7,
                          hash + 28,
                          sizeof(fast_word7)
                      );

                      if (fast_word7 ==
                          reference_hash[7])
                      {
                          v8_haraka_fast_state =
                              1;
                      }
                      else
                      {
                          // Never mine with a path that failed
                          // the self-test.
                          memcpy(
                              hash,
                              reference_hash,
                              32
                          );

                          v8_haraka_fast_state =
                              -1;
                      }
                  }
              }

              FixKey(
                  fixrand,
                  fixrandex,
                  data_key,
                  g_prand,
                  g_prandex
              );
          }


          // Cold candidate resolver.
          //
          // CLHash mutates key slots during a hash, so after the hot
          // path restored them we replay the complete hash to recreate
          // exactly the same keyed-Haraka state.
          extern "C"
          __attribute__((noinline))
          void Verus2hashFullV8(
              unsigned char *hash,
              unsigned char *curBuf,
              unsigned char *nonce,
              __m128i * __restrict data_key,
              uint8_t *gpu_init,
              uint32_t *fixrand,
              uint32_t *fixrandex,
              __m128i *g_prand,
              __m128i *g_prandex,
              int version
          )
          {
              (void)gpu_init;
              (void)version;

              memcpy(
                  curBuf + 47,
                  curBuf,
                  16
              );

              memcpy(
                  curBuf + 63,
                  curBuf,
                  1
              );

              memcpy(
                  curBuf + 32,
                  nonce,
                  15
              );

              uint64_t intermediate =
                  verusclhashv2_2(
                      data_key,
                      curBuf,
                      511,
                      fixrand,
                      fixrandex,
                      g_prand,
                      g_prandex
                  );

              memcpy(
                  curBuf + 47,
                  &intermediate,
                  8
              );

              memcpy(
                  curBuf + 55,
                  &intermediate,
                  8
              );

              memcpy(
                  curBuf + 63,
                  &intermediate,
                  1
              );

              intermediate &=
                  511;

              haraka512_port_keyed(
                  hash,
                  curBuf,
                  data_key + intermediate
              );

              FixKey(
                  fixrand,
                  fixrandex,
                  data_key,
                  g_prand,
                  g_prandex
              );
          }

          '''

          s = (
              s[:start] +
              verus2_v8 +
              s[end:]
          )

          # ------------------------------------------------------------
          # Candidate path:
          #
          # Hot loop only owns a real word7.
          # A candidate is replayed with full 256-bit Haraka before
          # difficulty accounting / submission.
          # ------------------------------------------------------------
          start = s.index(
              '\t\tif (vhash[7] <= Htarg )'
          )

          end = s.index(
              '\n\t\tif ((uint64_t)throughput',
              start
          )

          candidate_v8 = r'''		if (__builtin_expect(
                      vhash[7] <= Htarg,
                      0
                  ))
                  {
                      alignas(16)
                      uint32_t fullhash[8] =
                          { 0 };

                      Verus2hashFullV8(
                          (unsigned char *)fullhash,
                          (unsigned char *)blockhash_half,
                          nonceSpace,
                          data_key,
                          &gpuinit,
                          fixrand,
                          fixrandex,
                          data_key_prand,
                          data_key_prandex,
                          version
                      );

                      // Hard correctness gate.
                      // Never submit if hot word7 and full replay differ.
                      if (fullhash[7] == vhash[7])
                      {
                          work->valid_nonces++;

                          ((uint32_t*)full_data)[NONCE_OFT] =
                              nonce_buf;

                          memcpy(
                              work->data,
                              full_data,
                              140
                          );

                          int nonce =
                              work->valid_nonces - 1;

                          memcpy(
                              work->extra,
                              sol_data,
                              1347
                          );

                          memcpy(
                              work->extra + 1332,
                              nonceSpace,
                              15
                          );

                          bn_store_hash_target_ratio(
                              fullhash,
                              work->target,
                              work,
                              nonce
                          );

                          work->nonces[
                              work->valid_nonces - 1
                          ] = nonce_buf;

                          goto out;
                      }
                  }
          '''

          s = (
              s[:start] +
              candidate_v8 +
              s[end:]
          )

          # ------------------------------------------------------------
          # HOT LOOP BOOKKEEPING
          #
          # throughput has always been exactly 1.
          # Stop loading thread-local "throughput" every hash.
          #
          # hashes_done only needs to be committed when this scan call
          # returns; don't write through a pointer every single hash.
          # ------------------------------------------------------------
          s = s.replace(
              'struct timeval tv_start, tv_end;',
              '',
              1
          )

          s = s.replace(
              'gettimeofday(&tv_start, NULL);',
              '',
              1
          )

          s = s.replace(
              'throughput = 1;',
              '',
              1
          )

          s = s.replace(
              '*hashes_done = nonce_buf - start_nonce + throughput;',
              '',
              1
          )

          s = s.replace(
              'if ((uint64_t)throughput + (uint64_t)nonce_buf >= (uint64_t)max_nonce)',
              'if ((uint64_t)nonce_buf + 1ULL >= (uint64_t)max_nonce)',
              1
          )

          s = s.replace(
              'nonce_buf += throughput;',
              '++nonce_buf;',
              1
          )

          s = s.replace(
              '''out:
          	gettimeofday(&tv_end, NULL);''',
              '''out:
          	*hashes_done =
          	    nonce_buf - start_nonce + 1;''',
              1
          )

          p.write_text(s)

          # ============================================================
          # API BUILD IDENTIFIER
          # ============================================================
          p = Path('api.cpp')
          s = p.read_text()

          old = '''sprintf(buffer, "NAME=%s;VER=%s;API=%s;"'''

          new = '''sprintf(buffer, "NAME=%s;VER=%s;BUILD=A55-HOTPATH-V8;API=%s;"'''

          if old not in s:
              raise SystemExit(
                  'API summary signature not found'
              )

          p.write_text(
              s.replace(
                  old,
                  new,
                  1
              )
          )

          print('========================================')
          print('FireStick A55 HOTPATH V8')
          print('========================================')
          print('V3 alignment/SIGBUS      : PRESERVED')
          print('V4 ARMv8 AES             : PRESERVED')
          print('V5 zero-copy PMULL       : PRESERVED')
          print('V7 VQRDMULH              : PRESERVED')
          print('V8 CLHash register AES   : ENABLED')
          print('V8 partial Haraka word7  : ENABLED')
          print('V8 full candidate replay : ENABLED')
          print('V8 runtime self-test     : ENABLED')
          print('V8 NEON VTBL shuffle     : ENABLED')
          print('V8 register bridges      : ENABLED')
          print('V8 FixKey full unroll    : ENABLED')
          print('V8 hashes_done hoist     : ENABLED')
          print('V8 TLS throughput remove : ENABLED')
          print('V8 omit frame pointer    : ENABLED')
          print('API BUILD                : A55-HOTPATH-V8')
          PY

