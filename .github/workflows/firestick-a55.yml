name: FireStick A55 VQRDMULH V7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pinned ccminer ARM source
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454

      - name: Patch FireStick A55 V7
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected code not found in {path}: {old}')
              p.write_text(s.replace(old, new, 1))

          # ============================================================
          # Cortex-A55 / ARMv8 crypto / AArch32
          # ============================================================
          replace_once(
              'Makefile.am',
              'SHARED_CPPFLAGS += -march=armv7-a -mfpu=neon -mfloat-abi=softfp',
              'SHARED_CPPFLAGS += -march=armv8-a+crypto -mtune=cortex-a55 -mfpu=crypto-neon-fp-armv8 -mfloat-abi=softfp'
          )

          # ============================================================
          # V3 SIGBUS FIXES — PRESERVE
          # ============================================================
          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t _ALIGN(4)  blockhash_half[64] = { 0 };',
              'alignas(32) uint8_t blockhash_half[64] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              '__m128i *data_key =  (__m128i*)malloc(VERUS_KEY_SIZE + 1024);',
              '''__m128i *data_key = NULL;
              if (posix_memalign((void **)&data_key, 64, VERUS_KEY_SIZE + 1024) != 0 || !data_key)
              {
                  return 0;
              }'''
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t  full_data[140 + 3 + 1344] = { 0 };',
              'alignas(16) uint8_t full_data[140 + 3 + 1344] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t nonceSpace[15] = {0};',
              'alignas(16) uint8_t nonceSpace[16] = {0};'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint32_t  vhash[8] = { 0 };',
              'alignas(16) uint32_t vhash[8] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              '((uint32_t *)(&nonceSpace[11]))[0] = nonce_buf;',
              'memcpy(&nonceSpace[11], &nonce_buf, sizeof(nonce_buf));'
          )

          # ============================================================
          # V4 HARDWARE AES — PRESERVE
          # ============================================================
          p = Path('verus/armv7/haraka_portable.c')
          s = p.read_text()

          start = s.index(
              'void aesenc(unsigned char *s, const unsigned char *rk)'
          )

          end = s.index(
              '\n// Simulate _mm_unpacklo_epi32',
              start
          )

          hw_aes = r'''void aesenc(unsigned char *s, const unsigned char *rk)
          {
              uint8x16_t state =
                  vld1q_u8((const uint8_t *)s);

              const uint8x16_t zero =
                  vdupq_n_u8(0);

              state =
                  vaeseq_u8(state, zero);

              state =
                  vaesmcq_u8(state);

              state =
                  veorq_u8(
                      state,
                      vld1q_u8((const uint8_t *)rk)
                  );

              vst1q_u8(
                  (uint8_t *)s,
                  state
              );
          }
          '''

          p.write_text(
              s[:start] +
              hw_aes +
              s[end:]
          )

          # ============================================================
          # SAFE HARAKA RETURNS — SIGBUS FIX
          # ============================================================
          p = Path('verus/armv7/haraka_portable.h')
          s = p.read_text()

          unsafe = 'return *(__m128i *)result;'

          if s.count(unsafe) != 2:
              raise SystemExit(
                  f'Expected 2 unsafe Haraka returns, found {s.count(unsafe)}'
              )

          s = s.replace(
              unsafe,
              'return vreinterpretq_m128i_u32(vld1q_u32(result));'
          )

          p.write_text(s)

          # ============================================================
          # CLHASH SAFE RETURNS / LOAD / STORE
          # ============================================================
          p = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          )

          s = p.read_text()

          unsafe = 'return *(__m128i *)result;'

          if s.count(unsafe) != 3:
              raise SystemExit(
                  f'Expected 3 unsafe CLHash returns, found {s.count(unsafe)}'
              )

          s = s.replace(
              unsafe,
              '''__m128i out;
              memcpy(&out, result, sizeof(out));
              return out;'''
          )

          # Safe load
          start = s.index(
              '__m128i _mm_load_si128_emu(const void *p)'
          )

          end = s.index(
              '\n void _mm_store_si128_emu',
              start
          )

          safe_load = r'''__m128i _mm_load_si128_emu(const void *p)
          {
              return vreinterpretq_m128i_u8(
                  vld1q_u8(
                      (const uint8_t *)p
                  )
              );
          }
          '''

          s = (
              s[:start] +
              safe_load +
              s[end:]
          )

          # Safe store
          start = s.index(
              'void _mm_store_si128_emu(void *p, __m128i val)'
          )

          end = s.index(
              '\n__m128i _mm_shuffle_epi8_emu',
              start
          )

          safe_store = r'''void _mm_store_si128_emu(void *p, __m128i val)
          {
              vst1q_u8(
                  (uint8_t *)p,
                  vreinterpretq_u8_m128i(val)
              );
          }
          '''

          s = (
              s[:start] +
              safe_store +
              s[end:]
          )

          # ============================================================
          # V5 ZERO-COPY HARDWARE PMULL — PRESERVE EXACTLY
          # ============================================================
          start = s.index(
              '__m128i _mm_clmulepi64_si128_emu'
          )

          end = s.index(
              '\n__m128i _mm_mulhrs_epi16_emu',
              start
          )

          zero_copy_pmull = r'''static inline __attribute__((always_inline))
          __m128i _mm_clmulepi64_si128_emu(
              const __m128i &a,
              const __m128i &b,
              int imm
          )
          {
              const uint64x2_t av =
                  vreinterpretq_u64_s32(a);

              const uint64x2_t bv =
                  vreinterpretq_u64_s32(b);

              const uint64x1_t va =
                  (imm & 1)
                      ? vget_high_u64(av)
                      : vget_low_u64(av);

              const uint64x1_t vb =
                  (imm & 0x10)
                      ? vget_high_u64(bv)
                      : vget_low_u64(bv);

              uint64x2_t product;

              __asm__ volatile(
                  "vmull.p64 %q0, %P1, %P2"
                  : "=w"(product)
                  : "w"(va), "w"(vb)
              );

              return
                  vreinterpretq_s32_u64(product);
          }
          '''

          s = (
              s[:start] +
              zero_copy_pmull +
              s[end:]
          )

          # ============================================================
          # V7 — DIRECT NEON VQRDMULH
          #
          # SSE behavior:
          #
          #   ((a * b) + 0x4000) >> 15
          #
          # ARM vqrdmulhq_s16 performs the same rounded scaled
          # multiply for normal lanes.
          #
          # Difference:
          #
          #   -32768 * -32768
          #
          # SSE/source result:
          #   -32768
          #
          # ARM saturating result:
          #   +32767
          #
          # Therefore correct only that exact lane.
          # ============================================================
          start = s.index(
              '__m128i _mm_mulhrs_epi16_emu'
          )

          end = s.index(
              '__m128i _mm_set_epi64x_emu',
              start
          )

          vqrdmulh = r'''static inline __attribute__((always_inline))
          __m128i _mm_mulhrs_epi16_emu(
              __m128i a,
              __m128i b
          )
          {
              const int16x8_t va =
                  vreinterpretq_s16_m128i(a);

              const int16x8_t vb =
                  vreinterpretq_s16_m128i(b);

              int16x8_t result =
                  vqrdmulhq_s16(
                      va,
                      vb
                  );

              // vqrdmulh saturates the single overflow case.
              // PMULHRSW / original ccminer wraps that lane
              // to INT16_MIN instead.
              const int16x8_t min16 =
                  vdupq_n_s16(
                      (int16_t)-32768
                  );

              const uint16x8_t a_min =
                  vceqq_s16(
                      va,
                      min16
                  );

              const uint16x8_t b_min =
                  vceqq_s16(
                      vb,
                      min16
                  );

              const uint16x8_t overflow =
                  vandq_u16(
                      a_min,
                      b_min
                  );

              result =
                  vbslq_s16(
                      overflow,
                      min16,
                      result
                  );

              return
                  vreinterpretq_m128i_s16(result);
          }

          '''

          s = (
              s[:start] +
              vqrdmulh +
              s[end:]
          )

          p.write_text(s)

          # ============================================================
          # V7 IDENTIFIER IN API
          # ============================================================
          p = Path('api.cpp')
          s = p.read_text()

          old = '''sprintf(buffer, "NAME=%s;VER=%s;API=%s;"'''

          new = '''sprintf(buffer, "NAME=%s;VER=%s;BUILD=A55-VQRDMULH-V7;API=%s;"'''

          if old not in s:
              raise SystemExit(
                  'API summary signature not found'
              )

          p.write_text(
              s.replace(
                  old,
                  new,
                  1
              )
          )

          print('======================================')
          print('FireStick A55 VQRDMULH V7')
          print('======================================')
          print('V3 SIGBUS fixes      : PRESERVED')
          print('V4 AES hardware      : PRESERVED')
          print('V4 PMULL hardware    : PRESERVED')
          print('V5 zero-copy PMULL   : PRESERVED')
          print('V6 MULHRS code       : NOT USED')
          print('V7 vqrdmulhq_s16     : ENABLED')
          print('SSE overflow fix     : ENABLED')
          print('API BUILD            : A55-VQRDMULH-V7')
          PY

      - name: Verify V7 patches
        shell: bash
        run: |
          set -euo pipefail

          echo "===== CPU TARGET ====="
          grep -n "cortex-a55" \
            Makefile.am

          echo "===== AES ====="
          grep -n "vaeseq_u8" \
            verus/armv7/haraka_portable.c

          echo "===== PMULL ====="
          grep -n "vmull.p64" \
            verus/armv7/verus_clhash_portable.cpp

          echo "===== ZERO COPY PMULL ====="
          grep -n "vget_high_u64" \
            verus/armv7/verus_clhash_portable.cpp

          echo "===== VQRDMULH ====="
          grep -n "vqrdmulhq_s16" \
            verus/armv7/verus_clhash_portable.cpp

          echo "===== EDGE CORRECTION ====="
          grep -n "vbslq_s16" \
            verus/armv7/verus_clhash_portable.cpp

          grep -n "vceqq_s16" \
            verus/armv7/verus_clhash_portable.cpp

          echo "===== API ID ====="
          grep -n "A55-VQRDMULH-V7" \
            api.cpp

          echo "===== ALIGNMENT ====="
          grep -n "posix_memalign" \
            verus/armv7/verusscan.cpp

          grep -n "alignas" \
            verus/armv7/verusscan.cpp

      - name: Verify MULHRS edge semantics
        shell: bash
        run: |
          python3 - <<'PY'
          def wrap16(x):
              x &= 0xffff
              return x - 0x10000 if x & 0x8000 else x

          def reference(a, b):
              return wrap16(
                  ((a * b) + 0x4000) >> 15
              )

          def arm_model(a, b):
              x = ((a * b) + 0x4000) >> 15

              if x > 32767:
                  x = 32767

              if x < -32768:
                  x = -32768

              # V7 correction
              if a == -32768 and b == -32768:
                  x = -32768

              return x

          tests = [
              (-32768, -32768),
              (-32768, 32767),
              (32767, 32767),
              (32767, -32768),
              (0, 0),
              (1, 1),
              (-1, -1),
              (12345, -23456),
              (-22222, 11111),
          ]

          for a, b in tests:
              r = reference(a, b)
              n = arm_model(a, b)

              print(
                  a,
                  b,
                  "reference=",
                  r,
                  "v7=",
                  n
              )

              if r != n:
                  raise SystemExit(
                      f'MULHRS mismatch for {a}, {b}'
                  )

          print(
              'MULHRS semantic edge tests PASSED'
          )
          PY

      - name: Make Android build script executable
        run: |
          chmod +x \
            scripts/build-android-ccminer.sh

      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t ccminer-firestick-a55-v7 \
            -f build.Dockerfile \
            .

      - name: Build armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-output
          mkdir -p build-output

          docker run --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v7 \
            arm

          echo "===== OUTPUT ====="

          find \
            build-output \
            -maxdepth 4 \
            -type f \
            -print

          echo "===== BUILD LOG ====="

          tail -n 200 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log

          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer

      - name: Prepare V7 package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          BIN="build-output/ccminer-armeabi-v7a/bin"

          cp \
            "$BIN/ccminer" \
            dist/ccminer-a55-vqrdmulh-v7

          test -f "$BIN/libc++_shared.so" && \
            cp "$BIN/libc++_shared.so" dist/ || true

          test -f "$BIN/libomp.so" && \
            cp "$BIN/libomp.so" dist/ || true

          chmod +x \
            dist/ccminer-a55-vqrdmulh-v7

          cat > dist/BUILDINFO.txt <<EOF
          Build: A55-VQRDMULH-V7

          Source:
          7f30d6bfb64d0f3ba010191c5a185016ba46f454

          ABI:
          armeabi-v7a / AArch32

          Android API:
          23

          Cortex-A55 tune:
          enabled

          ARMv8 crypto:
          enabled

          Hardware AES:
          enabled

          Hardware PMULL:
          enabled

          Zero-copy PMULL:
          enabled

          VQRDMULH:
          enabled

          SSE INT16_MIN overflow correction:
          enabled

          V3 SIGBUS fixes:
          preserved

          API identifier:
          BUILD=A55-VQRDMULH-V7

          Champion baseline:
          V5 approximately 425 kH/s

          V6 approximately 409 kH/s
          rejected for performance
          EOF

          echo "===== BINARY ====="

          file \
            dist/ccminer-a55-vqrdmulh-v7

          echo "===== SHA256 ====="

          sha256sum \
            dist/* |
            tee \
              dist/SHA256SUMS.txt

      - name: Upload V7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestick-a55-vqrdmulh-v7-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
