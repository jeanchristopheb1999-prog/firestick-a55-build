name: FireStick A55 SHADOWKEY V13

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==============================================================
      # HISTORICAL BASES REQUIRED BY THE PROVEN V13 #36 PATCH
      # ==============================================================

      - name: Checkout exact V8 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 6cf06bdd8f85afef8793180e6dd68b4a1a4fd9f0
          path: v8-base


      - name: Checkout exact V10 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 73446a48e954bcc579c302d5a01e3dfb71b2bd30
          path: v10-base


      - name: Checkout V11 development base
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 7f92ff0f8788f54781704ce8414915584450bd78
          path: v11-base


      - name: Checkout exact V11 builder
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: c98f006a974ccee5be50ea5982311c05774432bc
          path: v11-builder


      - name: Checkout V12 source patch base
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 50ac3037b54d6f045e534af8b04a2ddf571ae844
          path: v12-base


      - name: Checkout exact successful V12 builder
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 5f9aa55a96369f8da93561e0c839ed81bc3e15c2
          path: v12-builder


      # ==============================================================
      # EXACT FAILED V13 #36 WORKFLOW
      #
      # Its V13 patch + semantic model already passed.
      # ==============================================================

      - name: Checkout proven V13 36 patch
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 3d9da4b5b0a837975e23c1ef38c37e28b04331f7
          path: v13-base


      - name: Checkout pinned ccminer source
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454
          path: src


      # ==============================================================
      # REPLAY THE EXACT PATCHES THAT PASSED IN RUN #36
      # ==============================================================

      - name: Replay proven V13 source
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path
          import textwrap


          workflow = Path(
              '../v13-base/.github/workflows/firestick-a55.yml'
          ).read_text()


          lines = workflow.splitlines()

          blocks = []

          i = 0


          while i < len(lines):

              if lines[i].strip() == "python3 - <<'PY'":

                  start = i + 1

                  end = None


                  for j in range(
                      start,
                      len(lines)
                  ):

                      if lines[j].strip() == 'PY':

                          end = j

                          break


                  if end is None:

                      raise SystemExit(
                          'Unterminated V13 Python block'
                      )


                  blocks.append(
                      textwrap.dedent(
                          '\n'.join(
                              lines[start:end]
                          )
                      )
                  )


                  i = end + 1

              else:

                  i += 1


          if len(blocks) != 3:

              raise SystemExit(
                  'Expected exactly 3 V13 blocks, found '
                  + str(len(blocks))
              )


          # ----------------------------------------------------------
          # Block 0:
          # exact V12 #35 reconstruction
          # ----------------------------------------------------------

          print(
              '======================================'
          )

          print(
              'REPLAY EXACT V12 #35'
          )

          print(
              '======================================'
          )


          exec(
              compile(
                  blocks[0],
                  'v13-replay-v12.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          if (
              'BUILD=A55-QCFAST-V12'
              not in
              Path('api.cpp').read_text()
          ):

              raise SystemExit(
                  'V12 replay failed'
              )


          # ----------------------------------------------------------
          # Block 1:
          # SHADOWKEY V13 source patch
          #
          # This PASSED in run #36.
          # ----------------------------------------------------------

          print(
              '======================================'
          )

          print(
              'REPLAY PROVEN SHADOWKEY V13 PATCH'
          )

          print(
              '======================================'
          )


          exec(
              compile(
                  blocks[1],
                  'v13-shadowkey.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          if (
              'BUILD=A55-SHADOWKEY-V13'
              not in
              Path('api.cpp').read_text()
          ):

              raise SystemExit(
                  'V13 source replay failed'
              )


          # ----------------------------------------------------------
          # Block 2:
          # SHADOWKEY semantic model
          #
          # This also PASSED in run #36.
          # ----------------------------------------------------------

          print(
              '======================================'
          )

          print(
              'REPLAY V13 MODEL TESTS'
          )

          print(
              '======================================'
          )


          exec(
              compile(
                  blocks[2],
                  'v13-model.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          print(
              '======================================'
          )

          print(
              'PROVEN V13 #36 SOURCE REPLAY: PASS'
          )

          print(
              '======================================'
          )

          PY


      # ==============================================================
      # COMPILE FIXES
      #
      # Fix ONLY the 3 compiler failures from V13 run #36.
      # ==============================================================

      - name: Fix V13 compile ordering
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path
          import re


          # ==========================================================
          # FIX 1
          #
          # Run #36 inserted:
          #
          #   memcpy(data_key_base, data_key, VERUS_KEY_SIZE)
          #
          # after the FIRST "GenNewCLKey(" in the file.
          #
          # That was the FUNCTION DEFINITION near the top,
          # not the call inside scanhash_verus().
          #
          # Remove it and insert it after the REAL call.
          # ==========================================================

          scan_path = Path(
              'verus/armv7/verusscan.cpp'
          )


          scan = scan_path.read_text()


          misplaced_pattern = re.compile(
              r'\s*memcpy\s*\(\s*'
              r'data_key_base\s*,\s*'
              r'data_key\s*,\s*'
              r'VERUS_KEY_SIZE\s*'
              r'\)\s*;',
              re.MULTILINE
          )


          matches = list(
              misplaced_pattern.finditer(
                  scan
              )
          )


          if len(matches) != 1:

              raise SystemExit(
                  'Expected exactly one misplaced base-key memcpy, found '
                  + str(len(matches))
              )


          # Remove incorrect occurrence.
          scan = misplaced_pattern.sub(
              '',
              scan,
              count=1
          )


          # Find actual mining function.
          scan_func = scan.index(
              'extern "C" int scanhash_verus'
          )


          # Find REAL GenNewCLKey CALL only after scanhash starts.
          gen_call = scan.index(
              'GenNewCLKey(',
              scan_func
          )


          gen_end = scan.index(
              ';',
              gen_call
          ) + 1


          correct_copy = r'''

              // ======================================================
              // V13 IMMUTABLE SHADOW KEY
              //
              // Generated once per work unit.
              // Never mutated inside nonce hot loop.
              // ======================================================

              memcpy(
                  data_key_base,
                  data_key,
                  VERUS_KEY_SIZE
              );
          '''


          scan = (
              scan[:gen_end]
              + correct_copy
              + scan[gen_end:]
          )


          scan_path.write_text(
              scan
          )


          # ==========================================================
          # VERIFY FIX #1
          # ==========================================================

          scan = scan_path.read_text()


          scan_func = scan.index(
              'extern "C" int scanhash_verus'
          )


          copy_pos = scan.index(
              'memcpy(\n'
              '                  data_key_base'
          )


          if copy_pos < scan_func:

              raise SystemExit(
                  'Immutable-key memcpy is still outside scanhash'
              )


          gen_call = scan.index(
              'GenNewCLKey(',
              scan_func
          )


          if copy_pos < gen_call:

              raise SystemExit(
                  'Immutable-key copy occurs before GenNewCLKey'
              )


          print(
              'FIX 1 PASS: base key copy moved into scanhash'
          )


          # ==========================================================
          # FIX 2 + FIX 3
          #
          # V13 wrapper was emitted before:
          #
          #   verusclhashv2_2()
          #   __...v13_shadow()
          #
          # Their definitions exist, but C++ needs declarations first.
          #
          # Add exact forward declarations before V13 wrapper.
          # ==========================================================

          cl_path = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          )


          cl = cl_path.read_text()


          wrapper_token = (
              'uint64_t verusclhashv13_shadow('
          )


          wrapper_pos = cl.index(
              wrapper_token
          )


          extern_pos = cl.rfind(
              'extern "C"',
              0,
              wrapper_pos
          )


          if extern_pos < 0:

              declaration_pos = wrapper_pos

          else:

              declaration_pos = extern_pos


          forward = r'''

          // ==========================================================
          // SHADOWKEY V13 FORWARD DECLARATIONS
          //
          // Required because the optimized wrapper intentionally lives
          // before these implementations in this translation unit.
          // ==========================================================

          extern "C"
          uint64_t verusclhashv2_2(
              void *random,
              const unsigned char buf[64],
              uint64_t keyMask,
              uint32_t * __restrict fixrand,
              uint32_t * __restrict fixrandex,
              __m128i *g_prand,
              __m128i *g_prandex
          );


          static
          __m128i
          __verusclmulwithoutreduction64alignedrepeat_v13_shadow(
              __m128i *randomsource,
              const __m128i buf[4],
              uint64_t keyMask,
              uint16_t * __restrict v13_idx_a,
              uint16_t * __restrict v13_idx_b
          );


          '''


          cl = (
              cl[:declaration_pos]
              + forward
              + cl[declaration_pos:]
          )


          cl_path.write_text(
              cl
          )


          # ==========================================================
          # FINAL COMPILE-PREFLIGHT CHECKS
          # ==========================================================

          cl = cl_path.read_text()


          wrapper_pos = cl.index(
              wrapper_token
          )


          v2_decl = cl.index(
              'uint64_t verusclhashv2_2('
          )


          shadow_decl = cl.index(
              '__verusclmulwithoutreduction64alignedrepeat_v13_shadow('
          )


          if v2_decl > wrapper_pos:

              raise SystemExit(
                  'verusclhashv2_2 declaration still too late'
              )


          if shadow_decl > wrapper_pos:

              raise SystemExit(
                  'V13 shadow-core declaration still too late'
              )


          # Ensure implementation still exists too.
          shadow_occurrences = cl.count(
              '__verusclmulwithoutreduction64alignedrepeat_v13_shadow('
          )


          if shadow_occurrences < 3:

              # prototype + wrapper call + definition
              raise SystemExit(
                  'Unexpected V13 shadow symbol occurrence count: '
                  + str(shadow_occurrences)
              )


          if (
              'BUILD=A55-SHADOWKEY-V13'
              not in
              Path('api.cpp').read_text()
          ):

              raise SystemExit(
                  'V13 build ID disappeared'
              )


          print(
              'FIX 2 PASS: verusclhashv2_2 forward declared'
          )


          print(
              'FIX 3 PASS: V13 shadow core forward declared'
          )


          print(
              '======================================'
          )

          print(
              'V13 COMPILER PREFLIGHT: PASS'
          )

          print(
              '======================================'
          )

          PY


      # ==============================================================
      # SHOW IMPORTANT SOURCE LOCATIONS
      # ==============================================================

      - name: Verify corrected V13 source
        shell: bash
        run: |
          set -euo pipefail

          cd src


          echo "===== BUILD ID ====="

          grep -n \
            "A55-SHADOWKEY-V13" \
            api.cpp


          echo "===== DATA KEY BASE ====="

          grep -n \
            "data_key_base" \
            verus/armv7/verusscan.cpp


          echo "===== REAL KEY GENERATION ====="

          grep -n \
            "GenNewCLKey" \
            verus/armv7/verusscan.cpp


          echo "===== V13 RESTORE ====="

          grep -n \
            "verusclhashv13_restore" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== V13 SHADOW CORE ====="

          grep -n \
            "__verusclmulwithoutreduction64alignedrepeat_v13_shadow" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== V2.2 DECLARATIONS ====="

          grep -n \
            "verusclhashv2_2" \
            verus/armv7/verus_clhash_portable.cpp |
            head -n 20


          echo "===== COMPACT INDEXES ====="

          grep -n \
            "v13_idx_a" \
            verus/armv7/verusscan.cpp


          grep -n \
            "v13_idx_b" \
            verus/armv7/verusscan.cpp


      # ==============================================================
      # BUILD
      # ==============================================================

      - name: Make build script executable
        shell: bash
        run: |
          set -euo pipefail

          cd src

          chmod +x \
            scripts/build-android-ccminer.sh


      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          cd src


          docker build \
            -t ccminer-firestick-a55-v13 \
            -f build.Dockerfile \
            .


      - name: Build SHADOWKEY V13 armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            build-output


          mkdir -p \
            build-output


          docker run \
            --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v13 \
            arm


          echo "===== OUTPUT ====="

          find \
            build-output \
            -maxdepth 4 \
            -type f \
            -print


          echo "===== BUILD LOG ====="

          tail -n 550 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log


          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer


      # ==============================================================
      # BINARY CHECK
      # ==============================================================

      - name: Inspect SHADOWKEY V13 binary
        shell: bash
        run: |
          set -euo pipefail

          cd src


          BIN="build-output/ccminer-armeabi-v7a/bin/ccminer"


          echo "===== FILE ====="

          file \
            "$BIN"


          echo "===== BUILD ID ====="

          strings \
            "$BIN" |
            grep \
              "A55-SHADOWKEY-V13"


          echo "===== SIZE ====="

          ls -lh \
            "$BIN"


          echo "===== AEABI LDIVMOD ====="

          readelf \
            -Ws \
            "$BIN" |
            grep \
              "__aeabi_ldivmod" ||
            true


      # ==============================================================
      # PACKAGE
      # ==============================================================

      - name: Prepare SHADOWKEY V13 package
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            dist


          mkdir -p \
            dist


          BIN="build-output/ccminer-armeabi-v7a/bin"


          cp \
            "$BIN/ccminer" \
            dist/ccminer-a55-shadowkey-v13


          if test -f "$BIN/libc++_shared.so"
          then

              cp \
                "$BIN/libc++_shared.so" \
                dist/

          fi


          if test -f "$BIN/libomp.so"
          then

              cp \
                "$BIN/libomp.so" \
                dist/

          fi


          chmod +x \
            dist/ccminer-a55-shadowkey-v13


          cat > dist/BUILDINFO.txt <<EOF
          Build:
          A55-SHADOWKEY-V13

          Stable base:
          exact A55-QCFAST-V12 #35

          V12 measured:
          approximately 1.26 MH/s

          V13 source base:
          run #36

          V13 failed-run commit:
          3d9da4b5b0a837975e23c1ef38c37e28b04331f7

          ccminer source:
          7f30d6bfb64d0f3ba010191c5a185016ba46f454

          ABI:
          armeabi-v7a / AArch32

          CPU:
          Cortex-A55

          V10 FASTMOD:
          preserved

          V11 HOTCORE:
          preserved

          V12 QCFAST:
          preserved

          V13 immutable base key:
          enabled

          V13 vector-value backup stores:
          removed from validated fast path

          V13 touched indexes:
          uint16

          V13 restore:
          immutable base key

          V13 validation:
          intermediate + 40 Haraka round keys

          V13 fallback:
          exact V12

          Run 36 compile fixes:
          base-key memcpy moved into scanhash
          verusclhashv2_2 forward declaration
          V13 shadow-core forward declaration

          API:
          BUILD=A55-SHADOWKEY-V13
          EOF


          echo "===== PACKAGE ====="

          ls -lh \
            dist/


          echo "===== SHA256 ====="

          sha256sum \
            dist/* |
            tee \
              dist/SHA256SUMS.txt


      # ==============================================================
      # ARTIFACT
      # ==============================================================

      - name: Upload SHADOWKEY V13 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestick-a55-shadowkey-v13-${{ github.run_number }}
          path: src/dist/
          if-no-files-found: error
          retention-days: 30
