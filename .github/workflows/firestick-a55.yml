name: FireStick A55 HOTCORE V11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==============================================================
      # EXACT V8 + EXACT V10 HISTORY
      # ==============================================================

      - name: Checkout exact V8 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 6cf06bdd8f85afef8793180e6dd68b4a1a4fd9f0
          path: v8-base

      - name: Checkout exact V10 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 73446a48e954bcc579c302d5a01e3dfb71b2bd30
          path: v10-base

      - name: Checkout pinned ccminer source
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454
          path: src


      # ==============================================================
      # REBUILD EXACT V10 SOURCE
      #
      # The V10 workflow contains:
      #   Python block #1 = exact V8 patch
      #   Python block #2 = FASTMOD V10 patch
      #
      # Replay BOTH without rewriting them.
      # ==============================================================

      - name: Replay exact V10 champion
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path
          import textwrap


          workflow = Path(
              '../v10-base/.github/workflows/firestick-a55.yml'
          ).read_text()


          lines = workflow.splitlines()

          blocks = []

          i = 0

          while i < len(lines):

              if lines[i].strip() == "python3 - <<'PY'":

                  start = i + 1

                  end = None

                  for j in range(start, len(lines)):

                      if lines[j].strip() == 'PY':
                          end = j
                          break


                  if end is None:
                      raise SystemExit(
                          'Unterminated Python block in V10 workflow'
                      )


                  blocks.append(
                      textwrap.dedent(
                          '\n'.join(
                              lines[start:end]
                          )
                      )
                  )


                  i = end + 1

              else:
                  i += 1


          if len(blocks) < 2:
              raise SystemExit(
                  f'Expected at least 2 V10 Python blocks, '
                  f'found {len(blocks)}'
              )


          print(
              '======================================'
          )

          print(
              'REPLAYING EXACT V10 CHAMPION'
          )

          print(
              'V10 commit:'
          )

          print(
              '73446a48e954bcc579c302d5a01e3dfb71b2bd30'
          )

          print(
              '======================================'
          )


          for index in range(2):

              print(
                  f'Executing V10 patch block #{index + 1}'
              )


              exec(
                  compile(
                      blocks[index],
                      f'v10-block-{index + 1}.py',
                      'exec'
                  ),
                  {
                      '__name__': '__main__',
                  }
              )


          api = Path(
              'api.cpp'
          ).read_text()


          if (
              'BUILD=A55-FASTMOD-V10'
              not in api
          ):
              raise SystemExit(
                  'Exact V10 rebuild failed: BUILD ID missing'
              )


          print(
              'Exact V10 source rebuild: PASS'
          )

          PY


      # ==============================================================
      # V11 HOTCORE PATCH
      # ==============================================================

      - name: Patch HOTCORE V11
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path


          # ==========================================================
          # COMPILER / LINKER
          #
          # ThinLTO lets clang optimize across:
          #   verusscan.cpp
          #   verus_clhash_portable.cpp
          #   haraka_portable.c
          #
          # V10 already uses O3.
          # ==========================================================

          p = Path(
              'Makefile.am'
          )

          makefile = p.read_text()


          makefile += r'''

          # ==========================================================
          # A55 HOTCORE V11
          # ==========================================================
          SHARED_CPPFLAGS += -flto=thin
          SHARED_CPPFLAGS += -fno-semantic-interposition
          SHARED_CPPFLAGS += -falign-loops=16
          SHARED_LDFLAGS += -flto=thin
          SHARED_LDFLAGS += -Wl,--lto-O3
          '''


          p.write_text(
              makefile
          )


          # ==========================================================
          # CLHASH
          # ==========================================================

          p = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          )

          s = p.read_text()


          # ==========================================================
          # V11 HELPERS
          # ==========================================================

          marker = (
              '__m128i '
              '__verusclmulwithoutreduction64alignedrepeat_v2_1'
          )


          if marker not in s:
              raise SystemExit(
                  'V11 active CLHash marker not found'
              )


          helper = r'''

          // ==========================================================
          // HOTCORE V11
          // ==========================================================

          static inline
          __attribute__((always_inline))
          int32_t v11_smod64_ctx(
              int64_t dividend,
              const v10_div32_ctx *ctx
          )
          {
              const uint64_t raw =
                  (uint64_t)dividend;


              const int negative =
                  dividend < 0;


              const uint64_t magnitude =
                  negative
                      ? (~raw + 1ULL)
                      : raw;


              const uint32_t remainder =
                  v10_umod64_ctx(
                      magnitude,
                      ctx
                  );


              const int32_t signed_remainder =
                  (int32_t)remainder;


              return
                  negative
                      ? -signed_remainder
                      : signed_remainder;
          }


          static inline
          __attribute__((always_inline))
          __m128i v11_xor_low32(
              __m128i acc,
              uint32_t value
          )
          {
              uint32x4_t v =
                  vreinterpretq_u32_s32(
                      acc
                  );


              v =
                  vsetq_lane_u32(
                      vgetq_lane_u32(
                          v,
                          0
                      ) ^ value,
                      v,
                      0
                  );


              return
                  vreinterpretq_s32_u32(
                      v
                  );
          }


          '''


          insert_at = s.index(
              marker
          )


          s = (
              s[:insert_at] +
              helper +
              s[insert_at:]
          )


          # ==========================================================
          # MANUALLY CONSTANT-FOLD:
          #
          # lazyLengthHash_port(1024, 64)
          #
          # _mm_set_epi64x(1024,64)
          # CLMUL low64(64) x high64(1024)
          #
          # 64   = x^6
          # 1024 = x^10
          #
          # result = x^16 = 0x10000
          #
          # Saves one hardware PMULL per hash.
          # ==========================================================

          lazy_call = (
              'lazyLengthHash_port(1024, 64)'
          )


          lazy_count = s.count(
              lazy_call
          )


          if lazy_count != 2:
              raise SystemExit(
                  'Expected 2 lazyLengthHash constant calls, found '
                  + str(lazy_count)
              )


          s = s.replace(
              lazy_call,
              '_mm_cvtsi64_si128_emu(0x10000ULL)'
          )


          # ==========================================================
          # ACTIVE V2.1 CORE ONLY
          # ==============================================================

          func_start = s.index(
              marker
          )


          func_end = s.index(
              '// verus intermediate hash extra - v2.2',
              func_start
          )


          active = s[
              func_start:
              func_end
          ]


          def replace_active(
              old,
              new,
              expected
          ):
              global active

              count = active.count(
                  old
              )


              if count != expected:
                  raise SystemExit(
                      'V11 active replacement count mismatch: '
                      + repr(old)
                      + ' expected='
                      + str(expected)
                      + ' actual='
                      + str(count)
                  )


              active = active.replace(
                  old,
                  new
              )


          # ==========================================================
          # HOT FUNCTION ALIGNMENT
          # ==========================================================

          replace_active(
              marker,
              '''__attribute__((hot, aligned(64)))
          __m128i __verusclmulwithoutreduction64alignedrepeat_v2_1''',
              1
          )


          # ==========================================================
          # 32-BIT LOOP COUNTER
          #
          # Original used int64_t for a fixed loop 0..31.
          # ==========================================================

          replace_active(
              '    for (int64_t i = 0; i < 32; i++)',
              '''    const uint32_t keyMask32 =
                  (uint32_t)keyMask;


              for (int i = 0; i < 32; ++i)''',
              1
          )


          # ==========================================================
          # SELECTOR
          #
          # Original:
          #   extract one 64-bit value
          #   repeatedly perform 64-bit shifts/ANDs
          #
          # V11:
          #   read low/high 32-bit NEON lanes directly.
          #
          # This is especially useful on AArch32.
          # ==========================================================

          replace_active(
              '        const uint64_t selector = '
              '_mm_cvtsi128_si64_emu(acc);',
              '''        const uint32x4_t selector_words =
                      vreinterpretq_u32_s32(
                          acc
                      );


                  const uint32_t sel_lo =
                      vgetq_lane_u32(
                          selector_words,
                          0
                      );


                  const uint32_t sel_hi =
                      vgetq_lane_u32(
                          selector_words,
                          1
                      );''',
              1
          )


          replace_active(
              'uint32_t prand_idx = '
              '(selector >> 5) & keyMask;',
              '''uint32_t prand_idx =
                      (sel_lo >> 5) &
                      keyMask32;''',
              1
          )


          replace_active(
              'uint32_t prandex_idx = '
              '(selector >>32) & keyMask;',
              '''uint32_t prandex_idx =
                      sel_hi &
                      keyMask32;''',
              1
          )


          replace_active(
              'pbuf = pbuf_copy + (selector & 3);',
              '''pbuf =
                      pbuf_copy +
                      (sel_lo & 3u);


                  const int pbuf_delta =
                      (sel_lo & 1u)
                          ? 1
                          : -1;''',
              1
          )


          replace_active(
              'switch (selector & 0x1c)',
              'switch (sel_lo & 0x1cu)',
              1
          )


          # ==========================================================
          # ELIMINATE REPEATED 64-BIT selector bit arithmetic
          # ==========================================================

          replace_active(
              '(((selector & 1) << 1) - 1)',
              'pbuf_delta',
              8
          )


          replace_active(
              'uint64_t rounds = selector >> 61;',
              'uint32_t rounds = sel_hi >> 29;',
              2
          )


          replace_active(
              'uint64_t aesround = 0;',
              'uint32_t aesround = 0;',
              1
          )


          replace_active(
              'const uint64_t roundidx = aesround++ << 2;',
              'const uint32_t roundidx = aesround++ << 2;',
              1
          )


          # ==========================================================
          # CASE 0x0c / 0x18 divisor comes directly from low32.
          # ==========================================================

          replace_active(
              'const int32_t divisor = '
              '(uint32_t)selector;',
              'const int32_t divisor = (int32_t)sel_lo;',
              2
          )


          # ==========================================================
          # CASE 0x14 + 0x18
          #
          # Compute selector bits 28..35 ONCE.
          #
          # Cache both 128-bit buffer vectors ONCE before the
          # random 1..8 iteration loop instead of reloading them.
          # ==========================================================

          buffer_anchor = (
              'const __m128i *buftmp = '
              'pbuf - pbuf_delta;'
          )


          buffer_insert = '''const __m128i *buftmp =
                      pbuf - pbuf_delta;


                  const uint32_t control_bits =
                      (sel_lo >> 28) |
                      (sel_hi << 4);


                  const __m128i pbuf_v =
                      _mm_load_si128_emu(
                          pbuf
                      );


                  const __m128i buftmp_v =
                      _mm_load_si128_emu(
                          buftmp
                      );'''


          replace_active(
              buffer_anchor,
              buffer_insert,
              2
          )


          replace_active(
              'selector & '
              '(((uint64_t)0x10000000) << rounds)',
              'control_bits & (1u << rounds)',
              2
          )


          replace_active(
              '_mm_load_si128_emu('
              'rounds & 1 ? pbuf : buftmp)',
              '''((rounds & 1u)
                              ? pbuf_v
                              : buftmp_v)''',
              2
          )


          replace_active(
              '_mm_load_si128_emu('
              'rounds & 1 ? buftmp : pbuf)',
              '''((rounds & 1u)
                              ? buftmp_v
                              : pbuf_v)''',
              2
          )


          # ==========================================================
          # CASE 0x18:
          #
          # V10 reconstructs normalized divisor context every time
          # the modulo branch is selected inside the 1..8 loop.
          #
          # V11 computes it ONCE before the loop.
          # ==========================================================

          case18_start = active.index(
              'case 0x18:'
          )


          case1c_start = active.index(
              'case 0x1c:',
              case18_start
          )


          case18 = active[
              case18_start:
              case1c_start
          ]


          onekey_anchor = '''                __m128i *rc = prand;
                  __m128i onekey;

                  do
          '''


          onekey_count = case18.count(
              onekey_anchor
          )


          if onekey_count != 1:
              raise SystemExit(
                  'V11 case18 onekey anchor count = '
                  + str(onekey_count)
              )


          onekey_new = '''                __m128i *rc = prand;
                  __m128i onekey;


                  const int32_t divisor =
                      (int32_t)sel_lo;


                  const v10_div32_ctx divctx =
                      v10_make_div32_ctx(
                          divisor
                      );


                  do
          '''


          case18 = case18.replace(
              onekey_anchor,
              onekey_new,
              1
          )


          # Remove divisor reconstruction from inner loop.
          inner_divisor = (
              'const int32_t divisor = '
              '(int32_t)sel_lo;'
          )


          if case18.count(
                  inner_divisor
              ) != 2:
              # One hoisted + one original inner declaration.
              raise SystemExit(
                  'V11 case18 divisor declaration sanity failed: '
                  + str(
                      case18.count(
                          inner_divisor
                      )
                  )
              )


          # Remove the LAST occurrence = old inner-loop declaration.
          pos = case18.rfind(
              inner_divisor
          )


          case18 = (
              case18[:pos] +
              case18[
                  pos +
                  len(inner_divisor):
              ]
          )


          old_call = '''v10_smod64(
                          dividend,
                          divisor
                      )'''


          new_call = '''v11_smod64_ctx(
                          dividend,
                          &divctx
                      )'''


          if old_call not in case18:
              raise SystemExit(
                  'V11 case18 V10 modulo call not found'
              )


          case18 = case18.replace(
              old_call,
              new_call,
              1
          )


          active = (
              active[:case18_start] +
              case18 +
              active[case1c_start:]
          )


          # ==========================================================
          # DIRECT LOW32 XOR
          #
          # V10:
          #   build temporary __m128i from remainder
          #   XOR vectors
          #
          # V11:
          #   modify lane 0 directly.
          #
          # Exactly two active modulo sites.
          # ==========================================================

          old_modxor = '''const __m128i modulo =
                      _mm_cvtsi32_si128_emu(
                          (uint32_t)v10_remainder
                      );'''


          # V10 formatting has this block twice but indentation before
          # "const" differs depending on original source. Replace
          # structurally below instead.
          active = active.replace(
              '''const __m128i modulo =
                    _mm_cvtsi32_si128_emu(
                        (uint32_t)v10_remainder
                    );
                acc = _mm_xor_si128_emu(modulo, acc);''',
              '''acc =
                    v11_xor_low32(
                        acc,
                        (uint32_t)v10_remainder
                    );'''
          )


          # Handle normal indentation form if compiler source block
          # preserved additional spaces.
          active = active.replace(
              '''const __m128i modulo =
                        _mm_cvtsi32_si128_emu(
                            (uint32_t)v10_remainder
                        );
                    acc = _mm_xor_si128_emu(modulo, acc);''',
              '''acc =
                        v11_xor_low32(
                            acc,
                            (uint32_t)v10_remainder
                        );'''
          )


          # We must have removed BOTH active modulo vectors.
          if (
              'const __m128i modulo' in active
          ):
              raise SystemExit(
                  'V11 active modulo vector still present'
              )


          # ==========================================================
          # SANITY: no old selector arithmetic remains
          # ==========================================================

          forbidden = [
              'selector >>',
              'selector &',
              '(uint32_t)selector',
              '(uint64_t)selector',
          ]


          for token in forbidden:

              if token in active:
                  raise SystemExit(
                      'Old selector arithmetic survived: '
                      + token
                  )


          # Put optimized active function back.
          s = (
              s[:func_start] +
              active +
              s[func_end:]
          )


          p.write_text(
              s
          )


          # ==========================================================
          # API BUILD ID
          # ==========================================================

          p = Path(
              'api.cpp'
          )


          api = p.read_text()


          if (
              'BUILD=A55-FASTMOD-V10'
              not in api
          ):
              raise SystemExit(
                  'V10 build ID missing before V11 patch'
              )


          api = api.replace(
              'BUILD=A55-FASTMOD-V10',
              'BUILD=A55-HOTCORE-V11',
              1
          )


          p.write_text(
              api
          )


          print(
              '======================================'
          )

          print(
              'FIRESTICK A55 HOTCORE V11'
          )

          print(
              '======================================'
          )

          print(
              'Base exact V10          : YES'
          )

          print(
              'FASTMOD V10             : PRESERVED'
          )

          print(
              'Selector low/high lanes : 32-bit'
          )

          print(
              'Outer counter           : 32-bit'
          )

          print(
              'Rounds counters         : 32-bit'
          )

          print(
              'pbuf direction cached   : YES'
          )

          print(
              'case14 buffer cache     : YES'
          )

          print(
              'case18 buffer cache     : YES'
          )

          print(
              'case18 FASTMOD ctx      : HOISTED'
          )

          print(
              'Modulo lane XOR         : DIRECT NEON'
          )

          print(
              'Constant PMULL/hash     : REMOVED'
          )

          print(
              'ThinLTO                 : ENABLED'
          )

          print(
              'BUILD=A55-HOTCORE-V11'
          )

          PY


      # ==============================================================
      # SOURCE VALIDATION
      # ==============================================================

      - name: Verify V11 patches
        shell: bash
        run: |
          set -euo pipefail

          cd src


          echo "===== BUILD ====="

          grep -n \
            "A55-HOTCORE-V11" \
            api.cpp


          echo "===== V10 FASTMOD PRESERVED ====="

          grep -n \
            "v10_umod64_ctx" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== V11 CTX FASTMOD ====="

          grep -n \
            "v11_smod64_ctx" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== DIRECT LOW32 XOR ====="

          grep -n \
            "v11_xor_low32" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== 32 BIT SELECTOR ====="

          grep -n \
            "selector_words" \
            verus/armv7/verus_clhash_portable.cpp


          grep -n \
            "sel_lo" \
            verus/armv7/verus_clhash_portable.cpp


          grep -n \
            "sel_hi" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== BUFFER CACHE ====="

          grep -n \
            "pbuf_v" \
            verus/armv7/verus_clhash_portable.cpp


          grep -n \
            "buftmp_v" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== CONSTANT LAZY HASH ====="

          grep -n \
            "0x10000ULL" \
            verus/armv7/verus_clhash_portable.cpp


          if grep -n \
            "lazyLengthHash_port(1024, 64)" \
            verus/armv7/verus_clhash_portable.cpp
          then
              echo "ERROR: constant PMULL survived"
              exit 1
          else
              echo "PASS: constant PMULL removed"
          fi


          echo "===== THIN LTO ====="

          grep -n \
            "flto=thin" \
            Makefile.am


      # ==============================================================
      # V11 SEMANTIC TESTS
      # ==============================================================

      - name: Verify V11 semantics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import random


          # ==========================================================
          # CLMUL CONSTANT
          # ==========================================================

          def clmul64(a, b):
              r = 0

              for i in range(64):
                  if (a >> i) & 1:
                      r ^= b << i

              return r


          result = clmul64(
              64,
              1024
          )


          assert (
              result ==
              0x10000
          )


          print(
              'lazyLengthHash constant: PASS'
          )


          # ==========================================================
          # SELECTOR DECOMPOSITION
          # ==========================================================

          random.seed(
              0xA5511
          )


          for _ in range(
              1000000
          ):
              selector = random.getrandbits(
                  64
              )


              sel_lo = (
                  selector &
                  0xffffffff
              )


              sel_hi = (
                  selector >>
                  32
              )


              keymask = 511


              old_prand = (
                  (selector >> 5) &
                  keymask
              )


              new_prand = (
                  (sel_lo >> 5) &
                  keymask
              )


              assert (
                  old_prand ==
                  new_prand
              )


              old_prandex = (
                  (selector >> 32) &
                  keymask
              )


              new_prandex = (
                  sel_hi &
                  keymask
              )


              assert (
                  old_prandex ==
                  new_prandex
              )


              assert (
                  (selector & 3) ==
                  (sel_lo & 3)
              )


              assert (
                  (selector & 0x1c) ==
                  (sel_lo & 0x1c)
              )


              old_rounds = (
                  selector >>
                  61
              )


              new_rounds = (
                  sel_hi >>
                  29
              )


              assert (
                  old_rounds ==
                  new_rounds
              )


              delta = (
                  1
                  if sel_lo & 1
                  else -1
              )


              # Original expression intended:
              # bit 0 => neighbour +1
              # bit 1 => neighbour -1
              old_neighbor_offset = (
                  -1
                  if selector & 1
                  else 1
              )


              new_neighbor_offset = (
                  -delta
              )


              assert (
                  old_neighbor_offset ==
                  new_neighbor_offset
              )


              control_bits = (
                  (sel_lo >> 28) |
                  (sel_hi << 4)
              ) & 0xffffffff


              for rounds in range(8):

                  old_bit = bool(
                      selector &
                      (
                          0x10000000 <<
                          rounds
                      )
                  )


                  new_bit = bool(
                      control_bits &
                      (
                          1 <<
                          rounds
                      )
                  )


                  assert (
                      old_bit ==
                      new_bit
                  )


          print(
              '1,000,000 selector tests: PASS'
          )


          # ==========================================================
          # DIRECT LOW32 XOR
          # ==========================================================

          for _ in range(
              250000
          ):
              lanes = [
                  random.getrandbits(32)
                  for _ in range(4)
              ]


              value = random.getrandbits(
                  32
              )


              original = [
                  lanes[0] ^ value,
                  lanes[1],
                  lanes[2],
                  lanes[3],
              ]


              direct = lanes[:]

              direct[0] ^=
                  value


              assert (
                  direct ==
                  original
              )


          print(
              '250,000 low32 XOR tests: PASS'
          )


          # ==========================================================
          # FASTMOD V10/V11 CONTEXT SEMANTICS
          # ==========================================================

          MASK32 = (
              1 << 32
          ) - 1


          MASK64 = (
              1 << 64
          ) - 1


          def u32(x):
              return (
                  x &
                  MASK32
              )


          def fast_umod64_32(
              numerator,
              d
          ):
              if d == 1:
                  return 0


              u1 = (
                  numerator >>
                  32
              ) & MASK32


              u0 = (
                  numerator &
                  MASK32
              )


              if u1 >= d:
                  q = u1 // d

                  u1 = u32(
                      u1 -
                      q * d
                  )


              if u1 == 0:
                  q = u0 // d

                  return u32(
                      u0 -
                      q * d
                  )


              shift = (
                  32 -
                  d.bit_length()
              )


              vn = u32(
                  d <<
                  shift
              )


              vn1 = (
                  vn >>
                  16
              )


              vn0 = (
                  vn &
                  0xffff
              )


              if shift:

                  un32 = u32(
                      (u1 << shift) |
                      (
                          u0 >>
                          (
                              32 -
                              shift
                          )
                      )
                  )


                  un10 = u32(
                      u0 <<
                      shift
                  )

              else:

                  un32 = u1

                  un10 = u0


              un1 = (
                  un10 >>
                  16
              )


              un0 = (
                  un10 &
                  0xffff
              )


              q1 = (
                  un32 //
                  vn1
              )


              rhat = u32(
                  un32 -
                  q1 * vn1
              )


              while (
                  q1 >= 0x10000 or
                  q1 * vn0 >
                      (
                          (rhat << 16) +
                          un1
                      )
              ):
                  q1 = u32(
                      q1 -
                      1
                  )


                  rhat = u32(
                      rhat +
                      vn1
                  )


                  if (
                      rhat >=
                      0x10000
                  ):
                      break


              un21 = u32(
                  (un32 << 16) +
                  un1 -
                  q1 * vn
              )


              q0 = (
                  un21 //
                  vn1
              )


              rhat = u32(
                  un21 -
                  q0 * vn1
              )


              while (
                  q0 >= 0x10000 or
                  q0 * vn0 >
                      (
                          (rhat << 16) +
                          un0
                      )
              ):
                  q0 = u32(
                      q0 -
                      1
                  )


                  rhat = u32(
                      rhat +
                      vn1
                  )


                  if (
                      rhat >=
                      0x10000
                  ):
                      break


              rem_normalized = u32(
                  (un21 << 16) +
                  un0 -
                  q0 * vn
              )


              return (
                  rem_normalized >>
                  shift
              )


          def c_remainder(
              dividend,
              divisor
          ):
              q = (
                  abs(dividend) //
                  abs(divisor)
              )


              if (
                  (dividend < 0) !=
                  (divisor < 0)
              ):
                  q = -q


              return (
                  dividend -
                  q * divisor
              )


          def fast_signed(
              dividend,
              divisor
          ):
              raw = (
                  dividend &
                  MASK64
              )


              magnitude = (
                  ((~raw + 1) & MASK64)
                  if dividend < 0
                  else raw
              )


              d = (
                  -divisor
                  if divisor < 0
                  else divisor
              )


              rem = fast_umod64_32(
                  magnitude,
                  d
              )


              return (
                  -rem
                  if dividend < 0
                  else rem
              )


          for _ in range(
              500000
          ):
              dividend = random.randint(
                  -(1 << 63),
                  (1 << 63) - 1
              )


              divisor = random.randint(
                  -(1 << 31),
                  (1 << 31) - 1
              )


              if divisor == 0:
                  divisor = 1


              assert (
                  fast_signed(
                      dividend,
                      divisor
                  )
                  ==
                  c_remainder(
                      dividend,
                      divisor
                  )
              )


          print(
              '500,000 FASTMOD context tests: PASS'
          )


          print(
              'HOTCORE V11 semantics: PASS'
          )

          PY


      # ==============================================================
      # BUILD
      # ==============================================================

      - name: Make Android build script executable
        shell: bash
        run: |
          set -euo pipefail

          cd src

          chmod +x \
            scripts/build-android-ccminer.sh


      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          cd src

          docker build \
            -t ccminer-firestick-a55-v11 \
            -f build.Dockerfile \
            .


      - name: Build HOTCORE V11 armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            build-output


          mkdir -p \
            build-output


          docker run \
            --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v11 \
            arm


          echo "===== OUTPUT ====="

          find \
            build-output \
            -maxdepth 4 \
            -type f \
            -print


          echo "===== BUILD LOG ====="

          tail -n 350 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log


          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer


      # ==============================================================
      # INSPECT GENERATED BINARY
      # ==============================================================

      - name: Inspect HOTCORE V11 binary
        shell: bash
        run: |
          set -euo pipefail

          cd src


          BIN="build-output/ccminer-armeabi-v7a/bin/ccminer"


          echo "===== FILE ====="

          file \
            "$BIN"


          echo "===== BUILD ID ====="

          strings \
            "$BIN" |
            grep \
              "A55-HOTCORE-V11"


          echo "===== UDIV ====="

          if command -v llvm-objdump >/dev/null 2>&1
          then

              llvm-objdump \
                -d \
                "$BIN" |
                grep -m 30 \
                  -E "\budiv\b" ||
                true

          fi


          echo "===== REMAINING AEABI 64 DIV ====="

          readelf \
            -Ws \
            "$BIN" |
            grep \
              "__aeabi_ldivmod" ||
            true


          echo "===== CALLS AROUND AEABI LDIV ====="

          if command -v llvm-objdump >/dev/null 2>&1
          then

              llvm-objdump \
                -d \
                "$BIN" |
                grep \
                  -B 5 \
                  -A 5 \
                  "__aeabi_ldivmod" ||
                true

          fi


          echo "===== BINARY SIZE ====="

          ls -lh \
            "$BIN"


      # ==============================================================
