name: FireStick A55 SHADOWKEY V13

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==============================================================
      # HISTORICAL BASES REQUIRED BY V13
      # ==============================================================

      - name: Checkout exact V8 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 6cf06bdd8f85afef8793180e6dd68b4a1fd9f0
          path: v8-base

      - name: Checkout exact V10 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 73446a48e954bcc579c302d5a01e3dfb71b2bd30
          path: v10-base

      - name: Checkout V11 development base
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 7f92ff0f8788f54781704ce8414915584450bd78
          path: v11-base

      - name: Checkout exact V11 builder
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: c98f006a974ccee5be50ea5982311c05774432bc
          path: v11-builder

      - name: Checkout V12 source base
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 50ac3037b54d6f045e534af8b04a2ddf571ae844
          path: v12-base

      - name: Checkout exact V12 35 builder
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 5f9aa55a96369f8da93561e0c839ed81bc3e15c2
          path: v12-builder

      - name: Checkout proven V13 36
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 3d9da4b5b0a837975e23c1ef38c37e28b04331f7
          path: v13-base

      # Run #38:
      # all structural fixes passed and compilation reached the linker.
      - name: Checkout V13 38 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: c5862bdc34885f4b29252d12b1c7f1b51e52cadd
          path: v13-38

      - name: Checkout pinned ccminer
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454
          path: src


      # ==============================================================
      # REPLAY EXACT SOURCE STATE FROM RUN #38
      #
      # Run #38:
      # - V13 patch PASS
      # - semantic model PASS
      # - compile fixes PASS
      # - every translation unit compiled
      # - only final linker failed
      # ==============================================================

      - name: Replay V13 38 source
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path
          import textwrap


          workflow = Path(
              '../v13-38/.github/workflows/firestick-a55.yml'
          ).read_text()


          lines = workflow.splitlines()

          blocks = []

          i = 0


          while i < len(lines):

              if lines[i].strip() == "python3 - <<'PY'":

                  start = i + 1
                  end = None


                  for j in range(
                      start,
                      len(lines)
                  ):

                      if lines[j].strip() == 'PY':

                          end = j
                          break


                  if end is None:

                      raise SystemExit(
                          'Unterminated V13-38 Python block'
                      )


                  blocks.append(
                      textwrap.dedent(
                          '\n'.join(
                              lines[start:end]
                          )
                      )
                  )


                  i = end + 1

              else:

                  i += 1


          if len(blocks) != 2:

              raise SystemExit(
                  'Expected exactly 2 V13-38 blocks, found '
                  + str(len(blocks))
              )


          print(
              '======================================'
          )

          print(
              'REPLAY V13 #38 SOURCE'
          )

          print(
              '======================================'
          )


          # Block 0:
          # reconstructs proven V13 #36.
          exec(
              compile(
                  blocks[0],
                  'v13-38-replay.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          # Block 1:
          # fixes memcpy placement + declarations.
          exec(
              compile(
                  blocks[1],
                  'v13-38-repairs.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          if (
              'BUILD=A55-SHADOWKEY-V13'
              not in
              Path('api.cpp').read_text()
          ):

              raise SystemExit(
                  'V13 #38 source replay failed'
              )


          print(
              '======================================'
          )

          print(
              'V13 #38 SOURCE REPLAY: PASS'
          )

          print(
              '======================================'
          )

          PY


      # ==============================================================
      # RUN #38 LINKER FIX
      #
      # Exact failure:
      #
      # undefined symbol: verusclhashv13_restore
      #
      # Cause:
      # external function was defined as always_inline + inline.
      # No external implementation was emitted for verusscan.cpp.
      #
      # Fix:
      # convert it to a normal external C function.
      # ==============================================================

      - name: Fix V13 restore linkage
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path
          import re


          path = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          )


          source = path.read_text()


          # ==========================================================
          # FIND THE ACTUAL DEFINITION
          # ==============================================================

          pattern = re.compile(
              r'extern\s+"C"\s*'
              r'__attribute__\s*\(\(\s*always_inline\s*\)\)\s*'
              r'inline\s+void\s+'
              r'verusclhashv13_restore\s*\(',
              re.MULTILINE
          )


          matches = list(
              pattern.finditer(
                  source
              )
          )


          if len(matches) != 1:

              raise SystemExit(
                  'Expected exactly one inline V13 restore definition, found '
                  + str(len(matches))
              )


          # ==========================================================
          # REAL EXTERNAL FUNCTION
          #
          # noinline is intentional:
          # make absolutely sure an external symbol exists.
          # ==============================================================

          replacement = '''extern "C"
          __attribute__((noinline))
          void verusclhashv13_restore(
          '''


          source = pattern.sub(
              replacement,
              source,
              count=1
          )


          path.write_text(
              source
          )


          # ==========================================================
          # PREFLIGHT
          # ==============================================================

          source = path.read_text()


          if (
              'inline void verusclhashv13_restore'
              in source
          ):

              raise SystemExit(
                  'Old inline restore survived'
              )


          if (
              'void verusclhashv13_restore('
              not in source
          ):

              raise SystemExit(
                  'External restore definition missing'
              )


          header = Path(
              'verus/armv7/verus_clhash.h'
          ).read_text()


          if (
              'void verusclhashv13_restore('
              not in header
          ):

              raise SystemExit(
                  'Restore declaration missing from header'
              )


          print(
              '======================================'
          )

          print(
              'V13 LINKAGE FIX: PASS'
          )

          print(
              '======================================'
          )

          print(
              'restore inline      : REMOVED'
          )

          print(
              'restore external    : YES'
          )

          print(
              'restore noinline    : YES'
          )

          print(
              'header declaration  : YES'
          )

          PY


      # ==============================================================
      # SHOW SOURCE BEFORE BUILD
      # ==============================================================

      - name: Verify final V13 source
        shell: bash
        run: |
          set -euo pipefail

          cd src


          echo "===== BUILD ====="

          grep -n \
            "A55-SHADOWKEY-V13" \
            api.cpp


          echo "===== RESTORE DECLARATION ====="

          grep -n \
            "verusclhashv13_restore" \
            verus/armv7/verus_clhash.h


          echo "===== RESTORE IMPLEMENTATION ====="

          grep -n -A8 -B4 \
            "void verusclhashv13_restore" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== IMMUTABLE BASE ====="

          grep -n \
            "data_key_base" \
            verus/armv7/verusscan.cpp


          echo "===== SHADOW CORE ====="

          grep -n \
            "__verusclmulwithoutreduction64alignedrepeat_v13_shadow" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== V13 WRAPPER ====="

          grep -n \
            "verusclhashv13_shadow" \
            verus/armv7/verus_clhash_portable.cpp


      # ==============================================================
      # BUILD IMAGE
      # ==============================================================

      - name: Make build script executable
        shell: bash
        run: |
          set -euo pipefail

          cd src

          chmod +x \
            scripts/build-android-ccminer.sh


      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          cd src


          docker build \
            -t ccminer-firestick-a55-v13 \
            -f build.Dockerfile \
            .


      # ==============================================================
      # BUILD ARM32
      # ==============================================================

      - name: Build SHADOWKEY V13 armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            build-output


          mkdir -p \
            build-output


          docker run \
            --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v13 \
            arm


          echo "===== OUTPUT ====="

          find \
            build-output \
            -maxdepth 4 \
            -type f \
            -print


          echo "===== BUILD LOG ====="

          tail -n 650 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log


          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer


      # ==============================================================
      # BINARY VALIDATION
      # ==============================================================

      - name: Inspect SHADOWKEY V13 binary
        shell: bash
        run: |
          set -euo pipefail

          cd src


          BIN="build-output/ccminer-armeabi-v7a/bin/ccminer"


          echo "===== FILE ====="

          file \
            "$BIN"


          echo "===== BUILD ID ====="

          strings \
            "$BIN" |
            grep \
              "A55-SHADOWKEY-V13"


          echo "===== RESTORE SYMBOL ====="

          readelf \
            -Ws \
            "$BIN" |
            grep \
              "verusclhashv13_restore"


          echo "===== BINARY SIZE ====="

          ls -lh \
            "$BIN"


          echo "===== AEABI LDIVMOD ====="

          readelf \
            -Ws \
            "$BIN" |
            grep \
              "__aeabi_ldivmod" ||
            true


      # ==============================================================
      # PACKAGE
      # ==============================================================

      - name: Prepare SHADOWKEY V13 package
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            dist


          mkdir -p \
            dist


          BIN="build-output/ccminer-armeabi-v7a/bin"


          cp \
            "$BIN/ccminer" \
            dist/ccminer-a55-shadowkey-v13


          if test -f "$BIN/libc++_shared.so"
          then

              cp \
                "$BIN/libc++_shared.so" \
                dist/

          fi


          if test -f "$BIN/libomp.so"
          then

              cp \
                "$BIN/libomp.so" \
                dist/

          fi


          chmod +x \
            dist/ccminer-a55-shadowkey-v13


          cat > dist/BUILDINFO.txt <<EOF
          Build:
          A55-SHADOWKEY-V13

          Stable base:
          exact A55-QCFAST-V12 #35

          V12 baseline:
          approximately 1.26 MH/s

          V13 optimization:
          SHADOWKEY immutable-base restore

          V13 source:
          run #36

          V13 structural repair:
          run #38

          V13 run #38 result:
          all source files compiled
          final linker failed only on verusclhashv13_restore

          V13 run #39 repair:
          restore function changed from inline to real external noinline function

          V10 FASTMOD:
          preserved

          V11 HOTCORE:
          preserved

          V12 QCFAST:
          preserved

          V13 immutable base:
          enabled

          V13 hot-path vector backup stores:
          removed

          V13 touched indexes:
          uint16

          V13 theoretical bookkeeping reduction:
          approximately 35.7 percent

          V13 automatic validation:
          intermediate + 40 Haraka keys

          V13 exact fallback:
          preserved

          API:
          BUILD=A55-SHADOWKEY-V13
          EOF


          echo "===== PACKAGE ====="

          ls -lh \
            dist/


          echo "===== SHA256 ====="

          sha256sum \
            dist/* |
            tee \
              dist/SHA256SUMS.txt


      # ==============================================================
      # ARTIFACT
      # ==============================================================

      - name: Upload SHADOWKEY V13 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestick-a55-shadowkey-v13-${{ github.run_number }}
          path: src/dist/
          if-no-files-found: error
          retention-days: 30
