name: FireStick A55 HOTCORE V11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==============================================================
      # EXACT KNOWN-GOOD BASES
      # ==============================================================

      - name: Checkout exact V8 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 6cf06bdd8f85afef8793180e6dd68b4a1a4fd9f0
          path: v8-base

      - name: Checkout exact V10 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 73446a48e954bcc579c302d5a01e3dfb71b2bd30
          path: v10-base

      - name: Checkout V11 run 30 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 7f92ff0f8788f54781704ce8414915584450bd78
          path: v11-base

      - name: Checkout pinned ccminer source
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454
          path: src


      # ==============================================================
      # REPLAY EXACT V10 + CORRECTED V11
      # ==============================================================

      - name: Apply corrected HOTCORE V11
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path
          import textwrap


          workflow = Path(
              '../v11-base/.github/workflows/firestick-a55.yml'
          ).read_text()


          lines = workflow.splitlines()

          blocks = []

          i = 0

          while i < len(lines):

              if lines[i].strip() == "python3 - <<'PY'":

                  start = i + 1
                  end = None


                  for j in range(start, len(lines)):

                      if lines[j].strip() == 'PY':

                          end = j
                          break


                  if end is None:

                      raise SystemExit(
                          'Unterminated Python block'
                      )


                  blocks.append(
                      textwrap.dedent(
                          '\n'.join(
                              lines[start:end]
                          )
                      )
                  )


                  i = end + 1

              else:

                  i += 1


          if len(blocks) < 3:

              raise SystemExit(
                  'Expected at least 3 V11 Python blocks, found '
                  + str(len(blocks))
              )


          # ==========================================================
          # BLOCK 1 = exact V10 reconstruction
          # ==========================================================

          print(
              '======================================'
          )

          print(
              'REPLAY EXACT V10'
          )

          print(
              '======================================'
          )


          exec(
              compile(
                  blocks[0],
                  'v10-replay.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          # ==========================================================
          # BLOCK 2 = V11 patch from run #30
          #
          # Run #30 only failed because we incorrectly assumed
          # there were duplicate fixrand/fixrandex stores.
          #
          # Actual V10 active core already has exactly ONE pair.
          #
          # Remove that attempted optimization entirely.
          # ==========================================================

          patch = blocks[1]


          section_start = patch.index(
              '# ==========================================================\n'
              '# REMOVE DUPLICATE FIXRAND STORES'
          )


          section_end = patch.index(
              '# ==========================================================\n'
              '# SANITY',
              section_start
          )


          corrected_section = r'''# ==========================================================
          # FIXRAND/FIXRANDEX
          #
          # Verified on the real V10 source:
          #
          # The active v2.1 function already contains exactly
          # one required fixrand assignment and one required
          # fixrandex assignment.
          #
          # Do NOT remove them.
          # ==========================================================

          if (
              active.count(
                  'fixrand[i] = prand_idx;'
              )
              != 1
          ):
              raise SystemExit(
                  'Unexpected active fixrand count before final sanity: '
                  + str(
                      active.count(
                          'fixrand[i] = prand_idx;'
                      )
                  )
              )


          if (
              active.count(
                  'fixrandex[i] = prandex_idx;'
              )
              != 1
          ):
              raise SystemExit(
                  'Unexpected active fixrandex count before final sanity: '
                  + str(
                      active.count(
                          'fixrandex[i] = prandex_idx;'
                      )
                  )
              )


          print(
              'fixrand/fixrandex already optimal: 1 store each'
          )


          '''


          patch = (
              patch[:section_start] +
              corrected_section +
              patch[section_end:]
          )


          print(
              '======================================'
          )

          print(
              'APPLY CORRECTED V11 HOTCORE'
          )

          print(
              '======================================'
          )


          exec(
              compile(
                  patch,
                  'v11-hotcore-corrected.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          # ==========================================================
          # BLOCK 3 = semantic tests from V11
          # ==========================================================

          print(
              '======================================'
          )

          print(
              'RUN V11 SEMANTIC TESTS'
          )

          print(
              '======================================'
          )


          exec(
              compile(
                  blocks[2],
                  'v11-semantics.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          # ==========================================================
          # FINAL SOURCE VALIDATION
          # ==========================================================

          clhash_path = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          )


          clhash = clhash_path.read_text()


          api = Path(
              'api.cpp'
          ).read_text()


          makefile = Path(
              'Makefile.am'
          ).read_text()


          if (
              'BUILD=A55-HOTCORE-V11'
              not in api
          ):

              raise SystemExit(
                  'V11 BUILD ID missing'
              )


          func_start = clhash.index(
              '__verusclmulwithoutreduction64alignedrepeat_v2_1'
          )


          func_end = clhash.index(
              '// verus intermediate hash extra - v2.2',
              func_start
          )


          active = clhash[
              func_start:
              func_end
          ]


          # ----------------------------------------------------------
          # Exact V10 FASTMOD still present
          # ----------------------------------------------------------

          if (
              'v10_umod64_ctx'
              not in clhash
          ):

              raise SystemExit(
                  'FASTMOD V10 core missing'
              )


          # ----------------------------------------------------------
          # V11 hoisted modulo context
          # ----------------------------------------------------------

          if (
              'v11_smod64_ctx'
              not in active
          ):

              raise SystemExit(
                  'V11 hoisted FASTMOD missing'
              )


          # ----------------------------------------------------------
          # Selector optimization
          # ----------------------------------------------------------

          if (
              'selector_words'
              not in active
          ):

              raise SystemExit(
                  'V11 32-bit selector missing'
              )


          if (
              'sel_lo'
              not in active or
              'sel_hi'
              not in active
          ):

              raise SystemExit(
                  'V11 selector lanes missing'
              )


          # ----------------------------------------------------------
          # Cached case 0x14 / 0x18 buffers
          # ----------------------------------------------------------

          if (
              'pbuf_v'
              not in active or
              'buftmp_v'
              not in active
          ):

              raise SystemExit(
                  'V11 cached pbuf vectors missing'
              )


          # ----------------------------------------------------------
          # Direct low32 modulo XOR
          # ----------------------------------------------------------

          if (
              'v11_xor_low32'
              not in active
          ):

              raise SystemExit(
                  'V11 low32 XOR missing'
              )


          # ----------------------------------------------------------
          # Required key restore bookkeeping
          # ----------------------------------------------------------

          fix_count = active.count(
              'fixrand[i] = prand_idx;'
          )


          fixex_count = active.count(
              'fixrandex[i] = prandex_idx;'
          )


          print(
              'Active fixrand count:',
              fix_count
          )


          print(
              'Active fixrandex count:',
              fixex_count
          )


          if fix_count != 1:

              raise SystemExit(
                  'Active fixrand count must equal 1'
              )


          if fixex_count != 1:

              raise SystemExit(
                  'Active fixrandex count must equal 1'
              )


          # ----------------------------------------------------------
          # Constant CLMUL optimization
          # ----------------------------------------------------------

          if (
              'lazyLengthHash_port(1024, 64)'
              in clhash
          ):

              raise SystemExit(
                  'Constant lazyLengthHash PMULL survived'
              )


          if (
              '0x10000ULL'
              not in clhash
          ):

              raise SystemExit(
                  'Constant lazyLengthHash replacement missing'
              )


          # ----------------------------------------------------------
          # ThinLTO
          # ----------------------------------------------------------

          if (
              '-flto=thin'
              not in makefile
          ):

              raise SystemExit(
                  'ThinLTO missing'
              )


          print(
              '======================================'
          )

          print(
              'HOTCORE V11 SOURCE VALIDATION: PASS'
          )

          print(
              '======================================'
          )

          PY


      # ==============================================================
      # SHOW PATCHES
      # ==============================================================

      - name: Verify HOTCORE V11 source
        shell: bash
        run: |
          set -euo pipefail

          cd src


          echo "===== BUILD ====="

          grep -n \
            "A55-HOTCORE-V11" \
            api.cpp


          echo "===== V10 FASTMOD ====="

          grep -n \
            "v10_umod64_ctx" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== V11 FASTMOD CONTEXT ====="

          grep -n \
            "v11_smod64_ctx" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== 32-BIT SELECTOR ====="

          grep -n \
            "selector_words" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== CACHED BUFFERS ====="

          grep -n \
            "pbuf_v" \
            verus/armv7/verus_clhash_portable.cpp


          grep -n \
            "buftmp_v" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== DIRECT LOW32 XOR ====="

          grep -n \
            "v11_xor_low32" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== FIXRAND ====="

          grep -n \
            "fixrand\[i\] = prand_idx" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== CONSTANT CLMUL ====="

          grep -n \
            "0x10000ULL" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== THIN LTO ====="

          grep -n \
            "flto=thin" \
            Makefile.am


      # ==============================================================
      # BUILD
      # ==============================================================

      - name: Make build script executable
        shell: bash
        run: |
          set -euo pipefail

          cd src

          chmod +x \
            scripts/build-android-ccminer.sh


      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          cd src

          docker build \
            -t ccminer-firestick-a55-v11 \
            -f build.Dockerfile \
            .


      - name: Build HOTCORE V11 armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            build-output


          mkdir -p \
            build-output


          docker run \
            --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v11 \
            arm


          echo "===== OUTPUT ====="

          find \
            build-output \
            -maxdepth 4 \
            -type f \
            -print


          echo "===== BUILD LOG ====="

          tail -n 400 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log


          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer


      # ==============================================================
      # BINARY INSPECTION
      # ==============================================================

      - name: Inspect HOTCORE V11 binary
        shell: bash
        run: |
          set -euo pipefail

          cd src


          BIN="build-output/ccminer-armeabi-v7a/bin/ccminer"


          echo "===== FILE ====="

          file \
            "$BIN"


          echo "===== BUILD ID ====="

          strings \
            "$BIN" |
            grep \
              "A55-HOTCORE-V11"


          echo "===== HARDWARE UDIV ====="

          if command -v llvm-objdump >/dev/null 2>&1
          then

              llvm-objdump \
                -d \
                "$BIN" |
                grep -m 30 \
                  -E "\budiv\b" ||
                true

          fi


          echo "===== REMAINING __aeabi_ldivmod ====="

          readelf \
            -Ws \
            "$BIN" |
            grep \
              "__aeabi_ldivmod" ||
            true


          echo "===== SIZE ====="

          ls -lh \
            "$BIN"


      # ==============================================================
      # PACKAGE
      # ==============================================================

      - name: Prepare HOTCORE V11 package
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            dist


          mkdir -p \
            dist


          BIN="build-output/ccminer-armeabi-v7a/bin"


          cp \
            "$BIN/ccminer" \
            dist/ccminer-a55-hotcore-v11


          if test -f "$BIN/libc++_shared.so"
          then

              cp \
                "$BIN/libc++_shared.so" \
                dist/

          fi


          if test -f "$BIN/libomp.so"
          then

              cp \
                "$BIN/libomp.so" \
                dist/

          fi


          chmod +x \
            dist/ccminer-a55-hotcore-v11


          cat > dist/BUILDINFO.txt <<EOF
          Build:
          A55-HOTCORE-V11

          Base:
          exact A55-FASTMOD-V10

          V10 workflow commit:
          73446a48e954bcc579c302d5a01e3dfb71b2bd30

          V11 development base:
          7f92ff0f8788f54781704ce8414915584450bd78

          ccminer:
          7f30d6bfb64d0f3ba010191c5a185016ba46f454

          ABI:
          armeabi-v7a / AArch32

          CPU:
          Cortex-A55

          V10 sustained baseline:
          approximately 1.16 MH/s

          FASTMOD V10:
          preserved

          Hardware AES:
          preserved

          Hardware PMULL:
          preserved

          VQRDMULH:
          preserved

          NEON VTBL:
          preserved

          Partial Haraka:
          preserved

          Candidate full replay:
          preserved

          Runtime Haraka validation:
          preserved

          V11 selector:
          32-bit NEON lanes

          V11 loop counters:
          32-bit

          V11 pbuf neighbour:
          precomputed

          V11 case 0x14:
          pbuf vectors cached

          V11 case 0x14:
          control bits cached

          V11 case 0x18:
          pbuf vectors cached

          V11 case 0x18:
          control bits cached

          V11 case 0x18:
          FASTMOD context hoisted outside rounds loop

          V11 modulo XOR:
          direct low32 lane

          fixrand/fixrandex:
          original single required store preserved

          lazyLengthHash(1024,64):
          constant 0x10000

          Per-hash constant PMULL:
          removed

          ThinLTO:
          enabled

          API:
          BUILD=A55-HOTCORE-V11
          EOF


          echo "===== PACKAGE ====="

          ls -lh \
            dist/


          echo "===== SHA256 ====="

          sha256sum \
            dist/* |
            tee \
              dist/SHA256SUMS.txt


      # ==============================================================
      # UPLOAD
      # ==============================================================

      - name: Upload HOTCORE V11 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestick-a55-hotcore-v11-${{ github.run_number }}
          path: src/dist/
          if-no-files-found: error
          retention-days: 30
