name: FireStick A55 QCFAST V12

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==============================================================
      # EXACT BASES NEEDED BY THE SUCCESSFUL V12 #34 PATCH
      # ==============================================================

      - name: Checkout exact V8 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 6cf06bdd8f85afef8793180e6dd68b4a1a4fd9f0
          path: v8-base


      - name: Checkout exact V10 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 73446a48e954bcc579c302d5a01e3dfb71b2bd30
          path: v10-base


      - name: Checkout V11 development base
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 7f92ff0f8788f54781704ce8414915584450bd78
          path: v11-base


      - name: Checkout exact V11 33 builder
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: c98f006a974ccee5be50ea5982311c05774432bc
          path: v11-builder


      # ==============================================================
      # IMPORTANT:
      # THIS IS THE V12 #34 WORKFLOW WHOSE SOURCE PATCH ALREADY PASSED.
      # ==============================================================

      - name: Checkout successful V12 patch source
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 50ac3037b54d6f045e534af8b04a2ddf571ae844
          path: v12-base


      - name: Checkout pinned ccminer source
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454
          path: src


      # ==============================================================
      # REPLAY ONLY THE TWO BLOCKS THAT ALREADY PASSED IN RUN #34
      #
      # block 0 = exact V11 #33 reconstruction
      # block 1 = QCFAST V12 source patch
      #
      # block 2 = old broken Python test
      #           -> deliberately NOT executed
      # ==============================================================

      - name: Replay proven V12 source patch
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path
          import textwrap


          workflow = Path(
              '../v12-base/.github/workflows/firestick-a55.yml'
          ).read_text()


          lines = workflow.splitlines()

          blocks = []

          i = 0


          while i < len(lines):

              if lines[i].strip() == "python3 - <<'PY'":

                  start = i + 1
                  end = None


                  for j in range(start, len(lines)):

                      if lines[j].strip() == 'PY':

                          end = j
                          break


                  if end is None:

                      raise SystemExit(
                          'Unterminated Python block'
                      )


                  blocks.append(
                      textwrap.dedent(
                          '\n'.join(
                              lines[start:end]
                          )
                      )
                  )


                  i = end + 1

              else:

                  i += 1


          if len(blocks) < 3:

              raise SystemExit(
                  'Expected 3 V12 blocks, found '
                  + str(len(blocks))
              )


          print(
              '======================================'
          )

          print(
              'REPLAY EXACT V11 #33'
          )

          print(
              '======================================'
          )


          exec(
              compile(
                  blocks[0],
                  'v12-replay-v11.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          api = Path(
              'api.cpp'
          ).read_text()


          if 'BUILD=A55-HOTCORE-V11' not in api:

              raise SystemExit(
                  'V11 #33 reconstruction failed'
              )


          print(
              'EXACT V11 #33: PASS'
          )


          print(
              '======================================'
          )

          print(
              'REPLAY PROVEN V12 #34 PATCH'
          )

          print(
              '======================================'
          )


          exec(
              compile(
                  blocks[1],
                  'v12-qcfast-source.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          api = Path(
              'api.cpp'
          ).read_text()


          if 'BUILD=A55-QCFAST-V12' not in api:

              raise SystemExit(
                  'V12 BUILD ID missing'
              )


          clhash = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          ).read_text()


          required = [
              'v12_mulhrs_fast',
              'v12_read_fpscr',
              'v12_write_fpscr',
              'v12_clear_qc',
              'v12_probe_qc',
              'v12_rollback_key',
              '__verusclmulwithoutreduction64alignedrepeat_v12_fast',
              'V12_FPSCR_QC',
          ]


          for token in required:

              if token not in clhash:

                  raise SystemExit(
                      'Missing V12 token: '
                      + token
                  )


          print(
              '======================================'
          )

          print(
              'V12 SOURCE REPLAY: PASS'
          )

          print(
              '======================================'
          )

          PY


      # ==============================================================
      # CLEAN SEMANTIC TEST
      #
      # Completely replaces the broken run #34 test.
      # ==============================================================

      - name: Verify QCFAST V12 semantics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import random


          def signed16(value):

              value &= 0xffff


              if value & 0x8000:

                  return value - 0x10000


              return value


          # ==========================================================
          # EXACT x86 PMULHRSW SEMANTICS
          # ==========================================================

          def x86_mulhrs(a, b):

              product = a * b


              result = (
                  product
                  + 0x4000
              ) >> 15


              return signed16(
                  result
              )


          # ==========================================================
          # ARM VQRDMULH MODEL
          # ==============================================================

          def arm_vqrdmulh(a, b):

              result = (
                  a * b
                  + 0x4000
              ) >> 15


              saturated = False


              if result > 32767:

                  result = 32767

                  saturated = True


              elif result < -32768:

                  result = -32768

                  saturated = True


              return (
                  result,
                  saturated
              )


          # ==========================================================
          # THE KNOWN DIFFERENCE
          #
          # x86 wraps 0x8000 -> -32768
          # ARM saturates -> +32767 and raises QC
          # ==============================================================

          exact = x86_mulhrs(
              -32768,
              -32768
          )


          fast, saturated = arm_vqrdmulh(
              -32768,
              -32768
          )


          assert exact == -32768

          assert fast == 32767

          assert saturated is True


          print(
              'Known saturation divergence: PASS'
          )


          # ==========================================================
          # RANDOM NON-SATURATION EQUIVALENCE
          #
          # Whenever QC would remain clear,
          # raw VQRDMULH must equal PMULHRSW.
          # ==============================================================

          random.seed(
              0xA5512
          )


          tested = 0


          for _ in range(
              2000000
          ):

              a = random.randint(
                  -32768,
                  32767
              )


              b = random.randint(
                  -32768,
                  32767
              )


              exact = x86_mulhrs(
                  a,
                  b
              )


              fast, saturated = arm_vqrdmulh(
                  a,
                  b
              )


              if not saturated:

                  assert fast == exact

                  tested += 1


          assert tested > 1900000


          print(
              '2,000,000 mulhrs comparisons: PASS'
          )


          # ==========================================================
          # KEY ROLLBACK MODEL
          #
          # Matches the CLHash behaviour:
          # before each mutation, original prand/prandex values are
          # saved. Rollback walks 31 -> 0.
          # ==============================================================

          for trial in range(
              10000
          ):

              original = [
                  random.getrandbits(128)
                  for _ in range(512)
              ]


              key = list(
                  original
              )


              fixrand = []

              fixrandex = []

              old_prand = []

              old_prandex = []


              for i in range(32):

                  a = random.randrange(
                      512
                  )


                  b = random.randrange(
                      512
                  )


                  # Save exactly what CLHash saw before mutation.
                  fixrand.append(
                      a
                  )


                  fixrandex.append(
                      b
                  )


                  old_prand.append(
                      key[a]
                  )


                  old_prandex.append(
                      key[b]
                  )


                  # Simulate arbitrary mutations.
                  key[a] = (
                      key[a]
                      ^
                      random.getrandbits(128)
                  )


                  key[b] = (
                      key[b]
                      ^
                      random.getrandbits(128)
                  )


              # Same reverse order used by FixKey / V12 rollback.
              for i in range(
                  31,
                  -1,
                  -1
              ):

                  key[
                      fixrandex[i]
                  ] = old_prandex[i]


                  key[
                      fixrand[i]
                  ] = old_prand[i]


              assert key == original


          print(
              '10,000 reverse rollback simulations: PASS'
          )


          # ==========================================================
          # QC POLICY MODEL
          # ==============================================================

          def qcfast_result(
              pairs
          ):

              qc = False

              fast_results = []


              for a, b in pairs:

                  result, saturated = arm_vqrdmulh(
                      a,
                      b
                  )


                  fast_results.append(
                      result
                  )


                  if saturated:

                      qc = True


              if qc:

                  # V12 discards/replays exact path.
                  return [
                      x86_mulhrs(
                          a,
                          b
                      )
                      for a, b in pairs
                  ]


              return fast_results


          for _ in range(
              100000
          ):

              pairs = [
                  (
                      random.randint(
                          -32768,
                          32767
                      ),
                      random.randint(
                          -32768,
                          32767
                      )
                  )
                  for _ in range(32)
              ]


              # Force saturation occasionally.
              if (
                  random.randrange(
                      100
                  )
                  == 0
              ):

                  pairs[
                      random.randrange(32)
                  ] = (
                      -32768,
                      -32768
                  )


              reference = [
                  x86_mulhrs(
                      a,
                      b
                  )
                  for a, b in pairs
              ]


              assert (
                  qcfast_result(
                      pairs
                  )
                  ==
                  reference
              )


          print(
              '100,000 QCFAST fallback simulations: PASS'
          )


          print(
              '======================================'
          )

          print(
              'QCFAST V12 SEMANTICS: PASS'
          )

          print(
              '======================================'
          )

          PY


      # ==============================================================
      # SOURCE PREFLIGHT
      # ==============================================================

      - name: Verify V12 source
        shell: bash
        run: |
          set -euo pipefail

          cd src


          echo "===== BUILD ====="

          grep -n \
            "A55-QCFAST-V12" \
            api.cpp


          echo "===== FAST MULHRS ====="

          grep -n \
            "v12_mulhrs_fast" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== FPSCR READ ====="

          grep -n \
            "vmrs %0, fpscr" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== FPSCR WRITE ====="

          grep -n \
            "vmsr fpscr, %0" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== QC PROBE ====="

          grep -n \
            "v12_probe_qc" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== ROLLBACK ====="

          grep -n \
            "v12_rollback_key" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== EXACT V11 MULHRS STILL PRESENT ====="

          grep -n \
            "_mm_mulhrs_epi16_emu" \
            verus/armv7/verus_clhash_portable.cpp |
            head -n 30


          echo "===== FAST FUNCTION ====="

          grep -n \
            "__verusclmulwithoutreduction64alignedrepeat_v12_fast" \
            verus/armv7/verus_clhash_portable.cpp


      # ==============================================================
      # BUILD
      # ==============================================================

      - name: Make build script executable
        shell: bash
        run: |
          set -euo pipefail

          cd src

          chmod +x \
            scripts/build-android-ccminer.sh


      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          cd src


          docker build \
            -t ccminer-firestick-a55-v12 \
            -f build.Dockerfile \
            .


      - name: Build QCFAST V12 armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            build-output


          mkdir -p \
            build-output


          docker run \
            --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v12 \
            arm


          echo "===== OUTPUT ====="

          find \
            build-output \
            -maxdepth 4 \
            -type f \
            -print


          echo "===== BUILD LOG ====="

          tail -n 500 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log


          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer


      # ==============================================================
      # BINARY INSPECTION
      # ==============================================================

      - name: Inspect QCFAST V12 binary
        shell: bash
        run: |
          set -euo pipefail

          cd src


          BIN="build-output/ccminer-armeabi-v7a/bin/ccminer"


          echo "===== FILE ====="

          file \
            "$BIN"


          echo "===== BUILD ID ====="

          strings \
            "$BIN" |
            grep \
              "A55-QCFAST-V12"


          echo "===== SIZE ====="

          ls -lh \
            "$BIN"


          echo "===== AEABI LDIVMOD ====="

          readelf \
            -Ws \
            "$BIN" |
            grep \
              "__aeabi_ldivmod" ||
            true


      # ==============================================================
      # PACKAGE
      # ==============================================================

      - name: Prepare QCFAST V12 package
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            dist


          mkdir -p \
            dist


          BIN="build-output/ccminer-armeabi-v7a/bin"


          cp \
            "$BIN/ccminer" \
            dist/ccminer-a55-qcfast-v12


          if test -f "$BIN/libc++_shared.so"
          then

              cp \
                "$BIN/libc++_shared.so" \
                dist/

          fi


          if test -f "$BIN/libomp.so"
          then

              cp \
                "$BIN/libomp.so" \
                dist/

          fi


          chmod +x \
            dist/ccminer-a55-qcfast-v12


          cat > dist/BUILDINFO.txt <<EOF
          Build:
          A55-QCFAST-V12

          Stable base:
          exact A55-HOTCORE-V11 #33

          V11 builder:
          c98f006a974ccee5be50ea5982311c05774432bc

          V12 proven source patch:
          50ac3037b54d6f045e534af8b04a2ddf571ae844

          ccminer source:
          7f30d6bfb64d0f3ba010191c5a185016ba46f454

          ABI:
          armeabi-v7a / AArch32

          Target CPU:
          Cortex-A55

          V11 baseline:
          approximately 1.24 MH/s

          V10 FASTMOD:
          preserved

          V11 HOTCORE:
          preserved

          Hardware AES:
          preserved

          Hardware PMULL:
          preserved

          ThinLTO:
          preserved

          V12 fast mulhrs:
          raw VQRDMULH

          Normal-path per-call overflow correction:
          removed

          FPSCR.QC:
          checked once per CLHash

          QC saturation:
          reverse rollback then exact V11 replay

          Hardware QC probe:
          enabled

          One-time fast/exact validation:
          enabled

          Permanent exact fallback:
          enabled

          API:
          BUILD=A55-QCFAST-V12
          EOF


          echo "===== PACKAGE ====="

          ls -lh \
            dist/


          echo "===== SHA256 ====="

          sha256sum \
            dist/* |
            tee \
              dist/SHA256SUMS.txt


      # ==============================================================
      # ARTIFACT
      # ==============================================================

      - name: Upload QCFAST V12 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestick-a55-qcfast-v12-${{ github.run_number }}
          path: src/dist/
          if-no-files-found: error
          retention-days: 30
