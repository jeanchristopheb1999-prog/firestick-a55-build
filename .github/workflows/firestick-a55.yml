name: FireStick A55 HOTPATH V8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pinned ccminer ARM source
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454

      - name: Patch FireStick A55 V8
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path


          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()

              if old not in s:
                  raise SystemExit(
                      f'Expected code not found in {path}: {old}'
                  )

              p.write_text(
                  s.replace(old, new, 1)
              )


          # ============================================================
          # CPU TARGET
          # Cortex-A55 / ARMv8 crypto / AArch32
          # ============================================================

          replace_once(
              'Makefile.am',
              'SHARED_CPPFLAGS += -march=armv7-a -mfpu=neon -mfloat-abi=softfp',
              'SHARED_CPPFLAGS += -march=armv8-a+crypto '
              '-mtune=cortex-a55 '
              '-mfpu=crypto-neon-fp-armv8 '
              '-mfloat-abi=softfp '
              '-fomit-frame-pointer'
          )


          # ============================================================
          # V3 ALIGNMENT / SIGBUS FIXES
          # ============================================================

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t _ALIGN(4)  blockhash_half[64] = { 0 };',
              'alignas(32) uint8_t blockhash_half[64] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              '__m128i *data_key =  (__m128i*)malloc(VERUS_KEY_SIZE + 1024);',
              '''__m128i *data_key = NULL;
              if (posix_memalign(
                      (void **)&data_key,
                      64,
                      VERUS_KEY_SIZE + 1024
                  ) != 0 || !data_key)
              {
                  return 0;
              }'''
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t  full_data[140 + 3 + 1344] = { 0 };',
              'alignas(16) uint8_t full_data[140 + 3 + 1344] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint8_t nonceSpace[15] = {0};',
              'alignas(16) uint8_t nonceSpace[16] = {0};'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint32_t  vhash[8] = { 0 };',
              'alignas(16) uint32_t vhash[8] = { 0 };'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              '((uint32_t *)(&nonceSpace[11]))[0] = nonce_buf;',
              'memcpy(&nonceSpace[11], &nonce_buf, sizeof(nonce_buf));'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint32_t fixrand[32];',
              'alignas(64) uint32_t fixrand[32];'
          )

          replace_once(
              'verus/armv7/verusscan.cpp',
              'uint32_t fixrandex[32];',
              'alignas(64) uint32_t fixrandex[32];'
          )


          # ============================================================
          # HARDWARE AES
          # Full/reference Haraka implementation
          #
          # IMPORTANT:
          # We replace between two UNIQUE comments.
          # No more accidental //extern match.
          # ============================================================

          p = Path(
              'verus/armv7/haraka_portable.c'
          )

          s = p.read_text()

          start = s.index(
              '// Simulate _mm_aesenc_si128 instructions from AESNI'
          )

          end = s.index(
              '// Simulate _mm_unpacklo_epi32',
              start
          )

          hw_aes = r'''// ARMv8 hardware AES
          void aesenc(
              unsigned char *s,
              const unsigned char *rk
          )
          {
              uint8x16_t state =
                  vld1q_u8(
                      (const uint8_t *)s
                  );

              const uint8x16_t zero =
                  vdupq_n_u8(0);

              state =
                  vaeseq_u8(
                      state,
                      zero
                  );

              state =
                  vaesmcq_u8(
                      state
                  );

              state =
                  veorq_u8(
                      state,
                      vld1q_u8(
                          (const uint8_t *)rk
                      )
                  );

              vst1q_u8(
                  (uint8_t *)s,
                  state
              );
          }


          '''

          p.write_text(
              s[:start] +
              hw_aes +
              s[end:]
          )


          # ============================================================
          # HARAKA HEADER
          #
          # Exact block replacement.
          # This fixes the stupid //extern problem permanently.
          # ============================================================

          p = Path(
              'verus/armv7/haraka_portable.h'
          )

          s = p.read_text()

          start = s.index(
              '//extern void aesenc(unsigned char *s, '
              'const unsigned char *rk);'
          )

          end = s.index(
              '\ntypedef unsigned int uint32_t;',
              start
          )

          fast_aes_header = r'''// ARMv8 AES implementation
          void aesenc(
              unsigned char *s,
              const unsigned char *rk
          );


          static inline __attribute__((always_inline))
          __m128i v8_aesenc_vec(
              __m128i state,
              __m128i round_key
          )
          {
              uint8x16_t v =
                  vreinterpretq_u8_s32(
                      state
                  );

              const uint8x16_t zero =
                  vdupq_n_u8(0);

              v =
                  vaeseq_u8(
                      v,
                      zero
                  );

              v =
                  vaesmcq_u8(
                      v
                  );

              v =
                  veorq_u8(
                      v,
                      vreinterpretq_u8_s32(
                          round_key
                      )
                  );

              return
                  vreinterpretq_s32_u8(
                      v
                  );
          }


          #define AES2_EMU(s0, s1, rci) do { \
              (s0) = v8_aesenc_vec((s0), rc[(rci)]); \
              (s1) = v8_aesenc_vec((s1), rc[(rci) + 1]); \
              (s0) = v8_aesenc_vec((s0), rc[(rci) + 2]); \
              (s1) = v8_aesenc_vec((s1), rc[(rci) + 3]); \
          } while (0)

          '''

          s = (
              s[:start] +
              fast_aes_header +
              s[end:]
          )


          # Safe Haraka vector returns
          unsafe = (
              'return *(__m128i *)result;'
          )

          if s.count(unsafe) != 2:
              raise SystemExit(
                  'Expected exactly 2 unsafe '
                  'Haraka returns, found '
                  + str(s.count(unsafe))
              )

          s = s.replace(
              unsafe,
              'return '
              'vreinterpretq_m128i_u32('
              'vld1q_u32(result));'
          )

          p.write_text(s)


          # ============================================================
          # CLHASH
          # ============================================================

          p = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          )

          s = p.read_text()


          # ------------------------------------------------------------
          # Safe remaining portable returns
          # ------------------------------------------------------------

          unsafe = (
              'return *(__m128i *)result;'
          )

          if s.count(unsafe) != 3:
              raise SystemExit(
                  'Expected exactly 3 unsafe CLHash '
                  'returns, found '
                  + str(s.count(unsafe))
              )

          s = s.replace(
              unsafe,
              '''__m128i out;
              memcpy(&out, result, sizeof(out));
              return out;'''
          )


          # ------------------------------------------------------------
          # Force small hot functions inline
          # ------------------------------------------------------------

          s = s.replace(
              '__m128i _mm_setr_epi8_emu(',
              'static inline '
              '__attribute__((always_inline)) '
              '__m128i _mm_setr_epi8_emu(',
              1
          )

          s = s.replace(
              '__m128i _mm_xor_si128_emu(',
              'static inline '
              '__attribute__((always_inline)) '
              '__m128i _mm_xor_si128_emu(',
              1
          )


          # ------------------------------------------------------------
          # FAST SAFE VECTOR LOAD
          # ------------------------------------------------------------

          start = s.index(
              '__m128i _mm_load_si128_emu(const void *p)'
          )

          end = s.index(
              '\n void _mm_store_si128_emu',
              start
          )

          fast_load = r'''static inline
          __attribute__((always_inline))
          __m128i _mm_load_si128_emu(
              const void *p
          )
          {
              return
                  vreinterpretq_s32_u8(
                      vld1q_u8(
                          (const uint8_t *)p
                      )
                  );
          }
          '''

          s = (
              s[:start] +
              fast_load +
              s[end:]
          )


          # ------------------------------------------------------------
          # FAST SAFE VECTOR STORE
          # ------------------------------------------------------------

          start = s.index(
              'void _mm_store_si128_emu(void *p, __m128i val)'
          )

          end = s.index(
              '\n__m128i _mm_shuffle_epi8_emu',
              start
          )

          fast_store = r'''static inline
          __attribute__((always_inline))
          void _mm_store_si128_emu(
              void *p,
              __m128i val
          )
          {
              vst1q_u8(
                  (uint8_t *)p,
                  vreinterpretq_u8_s32(
                      val
                  )
              );
          }
          '''

          s = (
              s[:start] +
              fast_store +
              s[end:]
          )


          # ============================================================
          # V8 PSHUFB -> NATIVE AARCH32 VTBL
          #
          # Removes scalar 16-byte loop.
          # ============================================================

          start = s.index(
              '__m128i _mm_shuffle_epi8_emu'
          )

          end = s.index(
              '\n// portable\n'
              '__m128i lazyLengthHash_port',
              start
          )

          neon_shuffle = r'''static inline
          __attribute__((always_inline))
          __m128i _mm_shuffle_epi8_emu(
              __m128i a,
              __m128i b
          )
          {
              const uint8x16_t av =
                  vreinterpretq_u8_s32(
                      a
                  );

              const uint8x16_t bv =
                  vreinterpretq_u8_s32(
                      b
                  );

              uint8x8x2_t table;

              table.val[0] =
                  vget_low_u8(av);

              table.val[1] =
                  vget_high_u8(av);


              uint8x16_t index =
                  vandq_u8(
                      bv,
                      vdupq_n_u8(
                          0x0f
                      )
                  );


              const uint8x16_t zero_mask =
                  vcgeq_u8(
                      bv,
                      vdupq_n_u8(
                          0x80
                      )
                  );


              index =
                  vbslq_u8(
                      zero_mask,
                      vdupq_n_u8(
                          0xff
                      ),
                      index
                  );


              const uint8x8_t lo =
                  vtbl2_u8(
                      table,
                      vget_low_u8(
                          index
                      )
                  );


              const uint8x8_t hi =
                  vtbl2_u8(
                      table,
                      vget_high_u8(
                          index
                      )
                  );


              return
                  vreinterpretq_s32_u8(
                      vcombine_u8(
                          lo,
                          hi
                      )
                  );
          }
          '''

          s = (
              s[:start] +
              neon_shuffle +
              s[end:]
          )


          # ============================================================
          # V5 ZERO-COPY HARDWARE PMULL
          # ============================================================

          start = s.index(
              '__m128i _mm_clmulepi64_si128_emu'
          )

          end = s.index(
              '\n__m128i _mm_mulhrs_epi16_emu',
              start
          )

          pmull = r'''static inline
          __attribute__((always_inline))
          __m128i _mm_clmulepi64_si128_emu(
              const __m128i &a,
              const __m128i &b,
              int imm
          )
          {
              const uint64x2_t av =
                  vreinterpretq_u64_s32(
                      a
                  );

              const uint64x2_t bv =
                  vreinterpretq_u64_s32(
                      b
                  );


              const uint64x1_t va =
                  (imm & 1)
                      ? vget_high_u64(av)
                      : vget_low_u64(av);


              const uint64x1_t vb =
                  (imm & 0x10)
                      ? vget_high_u64(bv)
                      : vget_low_u64(bv);


              uint64x2_t product;


              __asm__ volatile(
                  "vmull.p64 %q0, %P1, %P2"
                  : "=w"(product)
                  : "w"(va),
                    "w"(vb)
              );


              return
                  vreinterpretq_s32_u64(
                      product
                  );
          }
          '''

          s = (
              s[:start] +
              pmull +
              s[end:]
          )


          # ============================================================
          # V7 VQRDMULH
          #
          # Preserves exact PMULHRSW overflow semantics.
          # ============================================================

          start = s.index(
              '__m128i _mm_mulhrs_epi16_emu'
          )

          end = s.index(
              '__m128i _mm_set_epi64x_emu',
              start
          )

          vqrdmulh = r'''static inline
          __attribute__((always_inline))
          __m128i _mm_mulhrs_epi16_emu(
              __m128i a,
              __m128i b
          )
          {
              const int16x8_t va =
                  vreinterpretq_s16_s32(
                      a
                  );

              const int16x8_t vb =
                  vreinterpretq_s16_s32(
                      b
                  );


              int16x8_t result =
                  vqrdmulhq_s16(
                      va,
                      vb
                  );


              const int16x8_t min16 =
                  vdupq_n_s16(
                      (int16_t)-32768
                  );


              const uint16x8_t overflow =
                  vandq_u16(
                      vceqq_s16(
                          va,
                          min16
                      ),
                      vceqq_s16(
                          vb,
                          min16
                      )
                  );


              result =
                  vbslq_s16(
                      overflow,
                      min16,
                      result
                  );


              return
                  vreinterpretq_s32_s16(
                      result
                  );
          }

          '''

          s = (
              s[:start] +
              vqrdmulh +
              s[end:]
          )


          # ============================================================
          # V8 REGISTER-ONLY BRIDGES
          #
          # Removes pointer casts / stack roundtrips from selector path.
          # ============================================================

          start = s.index(
              '__m128i _mm_set_epi64x_emu'
          )

          marker = s.index(
              '__m128i _mm_cvtsi32_si128_emu',
              start
          )

          end = (
              s.rfind(
                  '\n',
                  start,
                  marker
              ) + 1
          )

          if end <= start:
              raise SystemExit(
                  'Register bridge boundary not found'
              )


          register_bridges = r'''static inline
          __attribute__((always_inline))
          __m128i _mm_set_epi64x_emu(
              uint64_t hi,
              uint64_t lo
          )
          {
              const uint64x2_t v =
                  vcombine_u64(
                      vcreate_u64(
                          lo
                      ),
                      vcreate_u64(
                          hi
                      )
                  );

              return
                  vreinterpretq_s32_u64(
                      v
                  );
          }


          static inline
          __attribute__((always_inline))
          __m128i _mm_cvtsi64_si128_emu(
              uint64_t lo
          )
          {
              const uint64x2_t v =
                  vcombine_u64(
                      vcreate_u64(
                          lo
                      ),
                      vdup_n_u64(
                          0
                      )
                  );

              return
                  vreinterpretq_s32_u64(
                      v
                  );
          }


          static inline
          __attribute__((always_inline))
          int64_t _mm_cvtsi128_si64_emu(
              __m128i &a
          )
          {
              return
                  vget_lane_s64(
                      vget_low_s64(
                          vreinterpretq_s64_s32(
                              a
                          )
                      ),
                      0
                  );
          }


          static inline
          __attribute__((always_inline))
          int32_t _mm_cvtsi128_si32_emu(
              __m128i &a
          )
          {
              return
                  vgetq_lane_s32(
                      a,
                      0
                  );
          }

          '''

          s = (
              s[:start] +
              register_bridges +
              s[end:]
          )

          p.write_text(s)


          # ============================================================
          # VERUSSCAN V8
          # ============================================================

          p = Path(
              'verus/armv7/verusscan.cpp'
          )

          s = p.read_text()


          # throughput is permanently 1
          s = s.replace(
              'static __thread uint32_t throughput = 0;',
              '/* V8 throughput is constant one */',
              1
          )


          # ============================================================
          # FIXKEY UNROLL + PARTIAL HARAKA
          # ============================================================

          start = s.index(
              'extern "C" inline void FixKey'
          )

          end = s.index(
              'extern "C" inline void VerusHashHalf',
              start
          )


          hot_helpers = r'''extern "C"
          __attribute__((always_inline))
          inline void FixKey(
              uint32_t *fixrand,
              uint32_t *fixrandex,
              __m128i *keyback,
              __m128i *g_prand,
              __m128i *g_prandex
          )
          {
          #pragma clang loop unroll(full)
              for (
                  int i = 31;
                  i >= 0;
                  --i
              )
              {
                  keyback[
                      fixrandex[i]
                  ] =
                      g_prandex[i];

                  keyback[
                      fixrand[i]
                  ] =
                      g_prand[i];
              }
          }


          // ==========================================================
          // REGISTER-ONLY HARAKA AES
          // ==========================================================

          static inline
          __attribute__((always_inline))
          uint8x16_t v8_haraka_aes(
              uint8x16_t state,
              uint8x16_t key
          )
          {
              const uint8x16_t zero =
                  vdupq_n_u8(0);

              state =
                  vaeseq_u8(
                      state,
                      zero
                  );

              state =
                  vaesmcq_u8(
                      state
                  );

              return
                  veorq_u8(
                      state,
                      key
                  );
          }


          static inline
          __attribute__((always_inline))
          uint8x16_t v8_unpacklo32(
              uint8x16_t a,
              uint8x16_t b
          )
          {
              const int32x4_t ai =
                  vreinterpretq_s32_u8(
                      a
                  );

              const int32x4_t bi =
                  vreinterpretq_s32_u8(
                      b
                  );


              const int32x2x2_t z =
                  vzip_s32(
                      vget_low_s32(
                          ai
                      ),
                      vget_low_s32(
                          bi
                      )
                  );


              return
                  vreinterpretq_u8_s32(
                      vcombine_s32(
                          z.val[0],
                          z.val[1]
                      )
                  );
          }


          static inline
          __attribute__((always_inline))
          uint8x16_t v8_unpackhi32(
              uint8x16_t a,
              uint8x16_t b
          )
          {
              const int32x4_t ai =
                  vreinterpretq_s32_u8(
                      a
                  );

              const int32x4_t bi =
                  vreinterpretq_s32_u8(
                      b
                  );


              const int32x2x2_t z =
                  vzip_s32(
                      vget_high_s32(
                          ai
                      ),
                      vget_high_s32(
                          bi
                      )
                  );


              return
                  vreinterpretq_u8_s32(
                      vcombine_s32(
                          z.val[0],
                          z.val[1]
                      )
                  );
          }


          // ==========================================================
          // PARTIAL KEYED HARAKA
          //
          // Full Haraka:
          // 40 AES rounds.
          //
          // Mining hot path only needs vhash[7].
          //
          // This version:
          // 34 AES rounds.
          //
          // Full hash is replayed only for share candidates.
          // ==========================================================

          static inline
          __attribute__((always_inline))
          void v8_haraka512_word7(
              unsigned char *out,
              const unsigned char *in,
              const __m128i *rc
          )
          {
              uint8x16_t s0 =
                  vld1q_u8(
                      in
                  );

              uint8x16_t s1 =
                  vld1q_u8(
                      in + 16
                  );

              uint8x16_t s2 =
                  vld1q_u8(
                      in + 32
                  );

              uint8x16_t s3 =
                  vld1q_u8(
                      in + 48
                  );


              // First three rounds completely.
          #pragma clang loop unroll(full)
              for (
                  int round = 0;
                  round < 3;
                  ++round
              )
              {
                  const int r =
                      round * 8;


                  s0 = v8_haraka_aes(
                      s0,
                      vreinterpretq_u8_s32(
                          rc[r + 0]
                      )
                  );

                  s1 = v8_haraka_aes(
                      s1,
                      vreinterpretq_u8_s32(
                          rc[r + 1]
                      )
                  );

                  s2 = v8_haraka_aes(
                      s2,
                      vreinterpretq_u8_s32(
                          rc[r + 2]
                      )
                  );

                  s3 = v8_haraka_aes(
                      s3,
                      vreinterpretq_u8_s32(
                          rc[r + 3]
                      )
                  );


                  s0 = v8_haraka_aes(
                      s0,
                      vreinterpretq_u8_s32(
                          rc[r + 4]
                      )
                  );

                  s1 = v8_haraka_aes(
                      s1,
                      vreinterpretq_u8_s32(
                          rc[r + 5]
                      )
                  );

                  s2 = v8_haraka_aes(
                      s2,
                      vreinterpretq_u8_s32(
                          rc[r + 6]
                      )
                  );

                  s3 = v8_haraka_aes(
                      s3,
                      vreinterpretq_u8_s32(
                          rc[r + 7]
                      )
                  );


                  const uint8x16_t t =
                      v8_unpacklo32(
                          s0,
                          s1
                      );

                  const uint8x16_t a =
                      v8_unpackhi32(
                          s0,
                          s1
                      );

                  const uint8x16_t b =
                      v8_unpacklo32(
                          s2,
                          s3
                      );

                  const uint8x16_t c =
                      v8_unpackhi32(
                          s2,
                          s3
                      );


                  s3 =
                      v8_unpacklo32(
                          a,
                          c
                      );

                  s0 =
                      v8_unpackhi32(
                          a,
                          c
                      );

                  s2 =
                      v8_unpackhi32(
                          b,
                          t
                      );

                  s1 =
                      v8_unpacklo32(
                          b,
                          t
                      );
              }


              // ======================================================
              // Fourth round:
              // complete AES stage.
              // ======================================================

              s0 = v8_haraka_aes(
                  s0,
                  vreinterpretq_u8_s32(
                      rc[24]
                  )
              );

              s1 = v8_haraka_aes(
                  s1,
                  vreinterpretq_u8_s32(
                      rc[25]
                  )
              );

              s2 = v8_haraka_aes(
                  s2,
                  vreinterpretq_u8_s32(
                      rc[26]
                  )
              );

              s3 = v8_haraka_aes(
                  s3,
                  vreinterpretq_u8_s32(
                      rc[27]
                  )
              );


              s0 = v8_haraka_aes(
                  s0,
                  vreinterpretq_u8_s32(
                      rc[28]
                  )
              );

              s1 = v8_haraka_aes(
                  s1,
                  vreinterpretq_u8_s32(
                      rc[29]
                  )
              );

              s2 = v8_haraka_aes(
                  s2,
                  vreinterpretq_u8_s32(
                      rc[30]
                  )
              );

              s3 = v8_haraka_aes(
                  s3,
                  vreinterpretq_u8_s32(
                      rc[31]
                  )
              );


              // Only dependency needed for final output word 7.
              const uint8x16_t t =
                  v8_unpacklo32(
                      s0,
                      s1
                  );

              const uint8x16_t b =
                  v8_unpacklo32(
                      s2,
                      s3
                  );


              s2 =
                  v8_unpackhi32(
                      b,
                      t
                  );


              // ======================================================
              // Fifth round:
              // only state2 is required.
              // ======================================================

              s2 = v8_haraka_aes(
                  s2,
                  vreinterpretq_u8_s32(
                      rc[34]
                  )
              );


              s2 = v8_haraka_aes(
                  s2,
                  vreinterpretq_u8_s32(
                      rc[38]
                  )
              );


              // After final MIX,
              // output bytes 52..55 come from
              // lane 2 of pre-mix state2.
              uint32_t word7 =
                  vgetq_lane_u32(
                      vreinterpretq_u32_u8(
                          s2
                      ),
                      2
                  );


              uint32_t input_word7;


              memcpy(
                  &input_word7,
                  in + 52,
                  sizeof(input_word7)
              );


              // Haraka feed-forward.
              word7 ^=
                  input_word7;


              memcpy(
                  out + 28,
                  &word7,
                  sizeof(word7)
              );
          }


          '''

          s = (
              s[:start] +
              hot_helpers +
              s[end:]
          )


          # ============================================================
          # V8 VERUS HASH
          #
          # Fast path:
          # partial Haraka word7.
          #
          # First hash on every thread:
          # validate against complete original Haraka.
          #
          # Failure:
          # automatic full-Haraka fallback.
          # ============================================================

          start = s.index(
              'extern "C" void inline Verus2hash'
          )

          end = s.index(
              '#ifdef _WIN32',
              start
          )


          verus2_fast = r'''static __thread int
          v8_haraka_fast_state = 0;
          //  0 = untested
          //  1 = verified
          // -1 = fallback


          extern "C"
          __attribute__((always_inline))
          inline void Verus2hash(
              unsigned char *hash,
              unsigned char *curBuf,
              unsigned char *nonce,
              __m128i * __restrict data_key,
              uint8_t *gpu_init,
              uint32_t *fixrand,
              uint32_t *fixrandex,
              __m128i *g_prand,
              __m128i *g_prandex,
              int version
          )
          {
              (void)gpu_init;
              (void)version;


              memcpy(
                  curBuf + 47,
                  curBuf,
                  16
              );

              memcpy(
                  curBuf + 63,
                  curBuf,
                  1
              );


              memcpy(
                  curBuf + 32,
                  nonce,
                  15
              );


              uint64_t intermediate =
                  verusclhashv2_2(
                      data_key,
                      curBuf,
                      511,
                      fixrand,
                      fixrandex,
                      g_prand,
                      g_prandex
                  );


              memcpy(
                  curBuf + 47,
                  &intermediate,
                  8
              );

              memcpy(
                  curBuf + 55,
                  &intermediate,
                  8
              );

              memcpy(
                  curBuf + 63,
                  &intermediate,
                  1
              );


              intermediate &=
                  511;


              const __m128i *round_keys =
                  data_key +
                  intermediate;


              if (__builtin_expect(
                      v8_haraka_fast_state < 0,
                      0
                  ))
              {
                  haraka512_port_keyed(
                      hash,
                      curBuf,
                      round_keys
                  );
              }
              else
              {
                  v8_haraka512_word7(
                      hash,
                      curBuf,
                      round_keys
                  );


                  // One-time thread verification.
                  if (__builtin_expect(
                          v8_haraka_fast_state == 0,
                          0
                      ))
                  {
                      alignas(16)
                      uint32_t reference_hash[8] =
                          { 0 };


                      haraka512_port_keyed(
                          (unsigned char *)
                              reference_hash,
                          curBuf,
                          round_keys
                      );


                      uint32_t fast_word7;


                      memcpy(
                          &fast_word7,
                          hash + 28,
                          sizeof(fast_word7)
                      );


                      if (
                          fast_word7 ==
                          reference_hash[7]
                      )
                      {
                          v8_haraka_fast_state =
                              1;
                      }
                      else
                      {
                          memcpy(
                              hash,
                              reference_hash,
                              32
                          );

                          v8_haraka_fast_state =
                              -1;
                      }
                  }
              }


              FixKey(
                  fixrand,
                  fixrandex,
                  data_key,
                  g_prand,
                  g_prandex
              );
          }


          // ==========================================================
          // COMPLETE HASH
          // Only used for candidate verification.
          // ==========================================================

          extern "C"
          __attribute__((noinline))
          void Verus2hashFullV8(
              unsigned char *hash,
              unsigned char *curBuf,
              unsigned char *nonce,
              __m128i * __restrict data_key,
              uint8_t *gpu_init,
              uint32_t *fixrand,
              uint32_t *fixrandex,
              __m128i *g_prand,
              __m128i *g_prandex,
              int version
          )
          {
              (void)gpu_init;
              (void)version;


              memcpy(
                  curBuf + 47,
                  curBuf,
                  16
              );

              memcpy(
                  curBuf + 63,
                  curBuf,
                  1
              );


              memcpy(
                  curBuf + 32,
                  nonce,
                  15
              );


              uint64_t intermediate =
                  verusclhashv2_2(
                      data_key,
                      curBuf,
                      511,
                      fixrand,
                      fixrandex,
                      g_prand,
                      g_prandex
                  );


              memcpy(
                  curBuf + 47,
                  &intermediate,
                  8
              );

              memcpy(
                  curBuf + 55,
                  &intermediate,
                  8
              );

              memcpy(
                  curBuf + 63,
                  &intermediate,
                  1
              );


              intermediate &=
                  511;


              haraka512_port_keyed(
                  hash,
                  curBuf,
                  data_key +
                  intermediate
              );


              FixKey(
                  fixrand,
                  fixrandex,
                  data_key,
                  g_prand,
                  g_prandex
              );
          }

          '''

          s = (
              s[:start] +
              verus2_fast +
              s[end:]
          )


          # ============================================================
          # CANDIDATE PATH
          #
          # Fast word7 detects candidate.
          # Complete 256-bit hash is replayed before submission.
          # ============================================================

          start = s.index(
              '\t\tif (vhash[7] <= Htarg )'
          )

          end = s.index(
              '\n\t\tif ((uint64_t)throughput',
              start
          )


          candidate = r'''		if (__builtin_expect(
                      vhash[7] <= Htarg,
                      0
                  ))
                  {
                      alignas(16)
                      uint32_t fullhash[8] =
                          { 0 };


                      Verus2hashFullV8(
                          (unsigned char *)
                              fullhash,

                          (unsigned char *)
                              blockhash_half,

                          nonceSpace,

                          data_key,

                          &gpuinit,

                          fixrand,
                          fixrandex,

                          data_key_prand,
                          data_key_prandex,

                          version
                      );


                      // Never submit anything that disagrees
                      // with complete Haraka.
                      if (
                          fullhash[7] ==
                          vhash[7]
                      )
                      {
                          work->valid_nonces++;


                          ((uint32_t *)
                              full_data
                          )[NONCE_OFT] =
                              nonce_buf;


                          memcpy(
                              work->data,
                              full_data,
                              140
                          );


                          const int nonce =
                              work->valid_nonces -
                              1;


                          memcpy(
                              work->extra,
                              sol_data,
                              1347
                          );


                          memcpy(
                              work->extra + 1332,
                              nonceSpace,
                              15
                          );


                          bn_store_hash_target_ratio(
                              fullhash,
                              work->target,
                              work,
                              nonce
                          );


                          work->nonces[
                              work->valid_nonces - 1
                          ] =
                              nonce_buf;


                          goto out;
                      }
                  }
          '''

          s = (
              s[:start] +
              candidate +
              s[end:]
          )


          # ============================================================
          # V8 LOOP BOOKKEEPING
          #
          # Remove work from every single nonce.
          # ============================================================

          s = s.replace(
              'struct timeval tv_start, tv_end;',
              '',
              1
          )


          s = s.replace(
              'gettimeofday(&tv_start, NULL);',
              '',
              1
          )


          s = s.replace(
              'throughput = 1;',
              '',
              1
          )


          s = s.replace(
              '*hashes_done = nonce_buf - start_nonce + throughput;',
              '',
              1
          )


          s = s.replace(
              'if ((uint64_t)throughput + '
              '(uint64_t)nonce_buf >= '
              '(uint64_t)max_nonce)',
              'if ((uint64_t)nonce_buf + '
              '1ULL >= '
              '(uint64_t)max_nonce)',
              1
          )


          s = s.replace(
              'nonce_buf += throughput;',
              '++nonce_buf;',
              1
          )


          old_out = (
              'out:\n'
              '\tgettimeofday(&tv_end, NULL);'
          )


          new_out = (
              'out:\n'
              '\t*hashes_done = '
              'nonce_buf - start_nonce + 1;'
          )


          if old_out not in s:
              raise SystemExit(
                  'Could not locate original out bookkeeping'
              )


          s = s.replace(
              old_out,
              new_out,
              1
          )


          p.write_text(s)


          # ============================================================
          # API BUILD IDENTIFIER
          # ============================================================

          p = Path(
              'api.cpp'
          )

          s = p.read_text()


          old = (
              'sprintf(buffer, '
              '"NAME=%s;VER=%s;API=%s;"'
          )


          new = (
              'sprintf(buffer, '
              '"NAME=%s;VER=%s;'
              'BUILD=A55-HOTPATH-V8;'
              'API=%s;"'
          )


          if old not in s:
              raise SystemExit(
                  'API summary signature not found'
              )


          p.write_text(
              s.replace(
                  old,
                  new,
                  1
              )
          )


          print(
              '======================================'
          )

          print(
              'FireStick A55 HOTPATH V8'
          )

          print(
              '======================================'
          )

          print(
              'V3 alignment/SIGBUS    : YES'
          )

          print(
              'ARMv8 hardware AES     : YES'
          )

          print(
              'V5 zero-copy PMULL     : YES'
          )

          print(
              'V7 VQRDMULH            : YES'
          )

          print(
              'CLHash register AES    : YES'
          )

          print(
              'NEON VTBL shuffle      : YES'
          )

          print(
              'Register bridges       : YES'
          )

          print(
              'FixKey full unroll     : YES'
          )

          print(
              'Partial Haraka word7   : YES'
          )

          print(
              'Haraka 34/40 AES       : YES'
          )

          print(
              'Runtime self-test      : YES'
          )

          print(
              'Full candidate replay  : YES'
          )

          print(
              'hashes_done hoist      : YES'
          )

          print(
              'Frame pointer omitted  : YES'
          )

          print(
              'BUILD=A55-HOTPATH-V8'
          )

          PY


