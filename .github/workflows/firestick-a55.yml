name: FireStick A55 FASTMOD V10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==============================================================
      # EXACT V8 CHAMPION WORKFLOW
      #
      # We deliberately rebuild from the exact historical V8 workflow,
      # not from V9.
      # ==============================================================

      - name: Checkout exact V8 workflow
        uses: actions/checkout@v4
        with:
          repository: jeanchristopheb1999-prog/firestick-a55-build
          ref: 6cf06bdd8f85afef8793180e6dd68b4a1a4fd9f0
          path: v8-base


      # ==============================================================
      # PINNED CCMINER SOURCE
      # ==============================================================

      - name: Checkout pinned ccminer ARM source
        uses: actions/checkout@v4
        with:
          repository: shmutalov/ccminer
          ref: 7f30d6bfb64d0f3ba010191c5a185016ba46f454
          path: src


      # ==============================================================
      # REPLAY EXACT V8 PATCH
      # ==============================================================

      - name: Rebuild exact V8 champion base
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path
          import textwrap


          workflow = Path(
              '../v8-base/.github/workflows/firestick-a55.yml'
          ).read_text()


          lines = workflow.splitlines()


          start = None

          for i, line in enumerate(lines):
              if line.strip() == "python3 - <<'PY'":
                  start = i + 1
                  break


          if start is None:
              raise SystemExit(
                  'Could not find V8 Python patch'
              )


          end = None

          for i in range(start, len(lines)):
              if lines[i].strip() == 'PY':
                  end = i
                  break


          if end is None:
              raise SystemExit(
                  'Could not find end of V8 Python patch'
              )


          patch_code = textwrap.dedent(
              '\n'.join(
                  lines[start:end]
              )
          )


          print(
              '======================================'
          )

          print(
              'REPLAYING EXACT V8 PATCH'
          )

          print(
              'commit: '
              '6cf06bdd8f85afef8793180e6dd68b4a1a4fd9f0'
          )

          print(
              '======================================'
          )


          exec(
              compile(
                  patch_code,
                  'historical-v8-patch.py',
                  'exec'
              ),
              {
                  '__name__': '__main__',
              }
          )


          print(
              'Exact V8 patch replayed successfully'
          )
          PY


      # ==============================================================
      # V10 FAST 64/32 MODULO
      # ==============================================================

      - name: Patch FASTMOD V10
        shell: bash
        run: |
          set -euo pipefail

          cd src

          python3 - <<'PY'
          from pathlib import Path


          p = Path(
              'verus/armv7/verus_clhash_portable.cpp'
          )

          s = p.read_text()


          # ==========================================================
          # V10 EXACT SIGNED 64 / SIGNED 32 REMAINDER
          #
          # Problem:
          #
          #     int64_t dividend % int32_t divisor
          #
          # on AArch32 calls __aeabi_ldivmod because there is no
          # native 64-bit divide instruction.
          #
          # Cortex-A55 DOES have fast 32-bit UDIV.
          #
          # V10:
          # - converts to unsigned magnitude
          # - performs exact 64/32 remainder
          # - uses 32-bit UDIV only
          # - restores C signed remainder semantics
          #
          # No floating point.
          # No reciprocal approximation.
          # Bit-exact integer result.
          # ==========================================================


          helper = r'''

          // ==========================================================
          // A55 FASTMOD V10
          // Exact signed int64 % signed int32 using 32-bit UDIV.
          // ==========================================================

          typedef struct
          {
              uint32_t d;
              uint32_t shift;
              uint32_t vn;
              uint32_t vn1;
              uint32_t vn0;

          } v10_div32_ctx;


          static inline
          __attribute__((always_inline))
          uint32_t v10_udiv32(
              uint32_t numerator,
              uint32_t denominator
          )
          {
              uint32_t quotient;


              __asm__ volatile(
                  "udiv %0, %1, %2"
                  : "=r"(quotient)
                  : "r"(numerator),
                    "r"(denominator)
              );


              return quotient;
          }


          static inline
          __attribute__((always_inline))
          uint32_t v10_umod32(
              uint32_t numerator,
              uint32_t denominator
          )
          {
              const uint32_t quotient =
                  v10_udiv32(
                      numerator,
                      denominator
                  );


              return
                  numerator -
                  quotient * denominator;
          }


          static inline
          __attribute__((always_inline))
          v10_div32_ctx v10_make_div32_ctx(
              int32_t divisor
          )
          {
              v10_div32_ctx ctx;


              // Absolute value using unsigned arithmetic.
              // Works for INT32_MIN too.
              const uint32_t raw =
                  (uint32_t)divisor;


              ctx.d =
                  divisor < 0
                      ? (uint32_t)(0u - raw)
                      : raw;


              ctx.shift =
                  (uint32_t)__builtin_clz(
                      ctx.d
                  );


              ctx.vn =
                  ctx.d <<
                  ctx.shift;


              ctx.vn1 =
                  ctx.vn >>
                  16;


              ctx.vn0 =
                  ctx.vn &
                  0xffffu;


              return ctx;
          }


          static inline
          __attribute__((always_inline))
          uint32_t v10_umod64_ctx(
              uint64_t numerator,
              const v10_div32_ctx *ctx
          )
          {
              const uint32_t d =
                  ctx->d;


              // d == 1 => remainder always zero.
              if (__builtin_expect(
                      d == 1u,
                      0
                  ))
              {
                  return 0u;
              }


              uint32_t u1 =
                  (uint32_t)(
                      numerator >>
                      32
                  );


              const uint32_t u0 =
                  (uint32_t)numerator;


              // First reduce the high 32 bits.
              //
              // This is one hardware 32-bit UDIV at most.
              if (u1 >= d)
              {
                  u1 =
                      v10_umod32(
                          u1,
                          d
                      );
              }


              // Entire value now fits in 32 bits.
              if (__builtin_expect(
                      u1 == 0u,
                      0
                  ))
              {
                  return
                      v10_umod32(
                          u0,
                          d
                      );
              }


              // ------------------------------------------------------
              // Normalized 64/32 division using base 2^16.
              //
              // Precondition:
              //     u1 < d
              //
              // Two 16-bit quotient digits.
              //
              // All actual division operations below are 32-bit UDIV.
              // ------------------------------------------------------

              const uint32_t shift =
                  ctx->shift;


              uint32_t un32;
              uint32_t un10;


              if (shift != 0u)
              {
                  un32 =
                      (u1 << shift) |
                      (
                          u0 >>
                          (32u - shift)
                      );


                  un10 =
                      u0 <<
                      shift;
              }
              else
              {
                  un32 =
                      u1;

                  un10 =
                      u0;
              }


              const uint32_t un1 =
                  un10 >>
                  16;


              const uint32_t un0 =
                  un10 &
                  0xffffu;


              const uint32_t vn =
                  ctx->vn;


              const uint32_t vn1 =
                  ctx->vn1;


              const uint32_t vn0 =
                  ctx->vn0;


              // ------------------------------------------------------
              // First quotient digit
              // ------------------------------------------------------

              uint32_t q1 =
                  v10_udiv32(
                      un32,
                      vn1
                  );


              uint32_t rhat =
                  un32 -
                  q1 * vn1;


              while (
                  q1 >= 0x10000u ||
                  q1 * vn0 >
                      (rhat << 16) +
                      un1
              )
              {
                  --q1;


                  rhat +=
                      vn1;


                  if (
                      rhat >=
                      0x10000u
                  )
                  {
                      break;
                  }
              }


              const uint32_t un21 =
                  (un32 << 16) +
                  un1 -
                  q1 * vn;


              // ------------------------------------------------------
              // Second quotient digit
              // ------------------------------------------------------

              uint32_t q0 =
                  v10_udiv32(
                      un21,
                      vn1
                  );


              rhat =
                  un21 -
                  q0 * vn1;


              while (
                  q0 >= 0x10000u ||
                  q0 * vn0 >
                      (rhat << 16) +
                      un0
              )
              {
                  --q0;


                  rhat +=
                      vn1;


                  if (
                      rhat >=
                      0x10000u
                  )
                  {
                      break;
                  }
              }


              const uint32_t rem_normalized =
                  (un21 << 16) +
                  un0 -
                  q0 * vn;


              return
                  rem_normalized >>
                  shift;
          }


          static inline
          __attribute__((always_inline))
          int32_t v10_smod64_ctx(
              int64_t dividend,
              const v10_div32_ctx *ctx
          )
          {
              const uint64_t raw =
                  (uint64_t)dividend;


              const int negative =
                  dividend < 0;


              // Absolute value of INT64_MIN is handled safely
              // using unsigned two's complement arithmetic.
              const uint64_t magnitude =
                  negative
                      ? (~raw + 1ULL)
                      : raw;


              const uint32_t remainder =
                  v10_umod64_ctx(
                      magnitude,
                      ctx
                  );


              const int32_t signed_remainder =
                  (int32_t)remainder;


              // C/C++ remainder sign follows dividend.
              return
                  negative
                      ? -signed_remainder
                      : signed_remainder;
          }


          static inline
          __attribute__((always_inline))
          int32_t v10_smod64(
              int64_t dividend,
              int32_t divisor
          )
          {
              const v10_div32_ctx ctx =
                  v10_make_div32_ctx(
                      divisor
                  );


              return
                  v10_smod64_ctx(
                      dividend,
                      &ctx
                  );
          }


          // Directly XOR the signed modulo result into
          // the low 32-bit lane.
          static inline
          __attribute__((always_inline))
          __m128i v10_xor_low32(
              __m128i acc,
              uint32_t value
          )
          {
              uint32x4_t v =
                  vreinterpretq_u32_s32(
                      acc
                  );


              v =
                  vsetq_lane_u32(
                      vgetq_lane_u32(
                          v,
                          0
                      ) ^ value,
                      v,
                      0
                  );


              return
                  vreinterpretq_s32_u32(
                      v
                  );
          }


          '''


          marker = (
              '__m128i '
              '__verusclmulwithoutreduction64alignedrepeat_v2_1'
          )


          insert_at = s.index(
              marker
          )


          s = (
              s[:insert_at] +
              helper +
              s[insert_at:]
          )


          # ==========================================================
          # PATCH ACTIVE V2.1
          # ==========================================================

          func_start = s.index(
              marker
          )


          func_end = s.index(
              '// verus intermediate hash extra - v2.2',
              func_start
          )


          active = s[
              func_start:
              func_end
          ]


          # ==========================================================
          # CASE 0x0C
          #
          # This was the first 64-bit modulo site.
          # ==========================================================

          case0c_start = active.index(
              'case 0xc:'
          )


          case10_start = active.index(
              'case 0x10:',
              case0c_start
          )


          case0c = active[
              case0c_start:
              case10_start
          ]


          old_case0c = '''                // cannot be zero here
                const int32_t divisor = (uint32_t)selector;

                acc = _mm_xor_si128_emu(add1, acc);

                const int64_t dividend = _mm_cvtsi128_si64_emu(acc);
                const __m128i modulo = _mm_cvtsi32_si128_emu(dividend % divisor);
                acc = _mm_xor_si128_emu(modulo, acc);
          '''


          new_case0c = '''                // cannot be zero here
                const int32_t divisor = (uint32_t)selector;

                const v10_div32_ctx divctx =
                    v10_make_div32_ctx(
                        divisor
                    );

                acc = _mm_xor_si128_emu(add1, acc);

                const int64_t dividend =
                    _mm_cvtsi128_si64_emu(
                        acc
                    );

                const int32_t remainder =
                    v10_smod64_ctx(
                        dividend,
                        &divctx
                    );

                acc =
                    v10_xor_low32(
                        acc,
                        (uint32_t)remainder
                    );
          '''


          if old_case0c not in case0c:
              raise SystemExit(
                  'V10 case 0x0c signature not found'
              )


          case0c = case0c.replace(
              old_case0c,
              new_case0c,
              1
          )


          active = (
              active[:case0c_start] +
              case0c +
              active[case10_start:]
          )


          # ==========================================================
          # CASE 0x18
          #
          # This was the second active 64-bit modulo site.
          #
          # Divisor normalization is hoisted outside the random
          # 1..8 round loop.
          # ==========================================================

          case18_start = active.index(
              'case 0x18:'
          )


          case1c_start = active.index(
              'case 0x1c:',
              case18_start
          )


          case18 = active[
              case18_start:
              case1c_start
          ]


          old_decl = '''                __m128i *rc = prand;
                __m128i onekey;

                do
          '''


          new_decl = '''                __m128i *rc = prand;
                __m128i onekey;

                const int32_t divisor =
                    (int32_t)(uint32_t)selector;

                const v10_div32_ctx divctx =
                    v10_make_div32_ctx(
                        divisor
                    );

                do
          '''


          if old_decl not in case18:
              raise SystemExit(
                  'V10 case 0x18 declaration not found'
              )


          case18 = case18.replace(
              old_decl,
              new_decl,
              1
          )


          old_mod = '''                        // cannot be zero here, may be negative
                        const int32_t divisor = (uint32_t)selector;
                        const int64_t dividend = _mm_cvtsi128_si64_emu(onekey);
                        const __m128i modulo = _mm_cvtsi32_si128_emu(dividend % divisor);
                        acc = _mm_xor_si128_emu(modulo, acc);
          '''


          new_mod = '''                        // cannot be zero here, may be negative
                        const int64_t dividend =
                            _mm_cvtsi128_si64_emu(
                                onekey
                            );

                        const int32_t remainder =
                            v10_smod64_ctx(
                                dividend,
                                &divctx
                            );

                        acc =
                            v10_xor_low32(
                                acc,
                                (uint32_t)remainder
                            );
          '''


          if old_mod not in case18:
              raise SystemExit(
                  'V10 case 0x18 modulo signature not found'
              )


          case18 = case18.replace(
              old_mod,
              new_mod,
              1
          )


          active = (
              active[:case18_start] +
              case18 +
              active[case1c_start:]
          )


          s = (
              s[:func_start] +
              active +
              s[func_end:]
          )


          # ==========================================================
          # OLD COMPATIBILITY FUNCTION
          #
          # Not used by our v2.2 mining path, but eliminate its
          # 64-bit modulo too so the source has no remaining
          # "dividend % divisor".
          # ==========================================================

          old_legacy = (
              'const __m128i modulo = '
              '_mm_cvtsi32_si128_emu(dividend % divisor);'
          )


          legacy_count = s.count(
              old_legacy
          )


          if legacy_count != 2:
              raise SystemExit(
                  'Expected 2 legacy modulo sites, found '
                  + str(legacy_count)
              )


          legacy_new = '''const int32_t v10_legacy_remainder =
                    v10_smod64(
                        dividend,
                        divisor
                    );
                const __m128i modulo =
                    _mm_cvtsi32_si128_emu(
                        (uint32_t)v10_legacy_remainder
                    );'''


          s = s.replace(
              old_legacy,
              legacy_new
          )


          # ==========================================================
          # ASSERT NO ORIGINAL 64-BIT MODULO REMAINS
          # ==========================================================

          if 'dividend % divisor' in s:
              raise SystemExit(
                  'A 64-bit modulo site survived V10 patch'
              )


          p.write_text(s)


          # ==========================================================
          # API BUILD ID
          # ==========================================================

          p = Path(
              'api.cpp'
          )


          api = p.read_text()


          if (
              'BUILD=A55-HOTPATH-V8'
              not in api
          ):
              raise SystemExit(
                  'V8 API ID not found'
              )


          api = api.replace(
              'BUILD=A55-HOTPATH-V8',
              'BUILD=A55-FASTMOD-V10',
              1
          )


          p.write_text(
              api
          )


          print(
              '======================================'
          )

          print(
              'FireStick A55 FASTMOD V10'
          )

          print(
              '======================================'
          )

          print(
              'Base                     : EXACT V8'
          )

          print(
              'V9 changes               : NONE'
          )

          print(
              'case 0x0c fastmod        : YES'
          )

          print(
              'case 0x18 fastmod        : YES'
          )

          print(
              'case 0x18 divisor hoist  : YES'
          )

          print(
              '32-bit hardware UDIV     : YES'
          )

          print(
              '64-bit software division : REMOVED HOT PATH'
          )

          print(
              'direct low32 XOR         : YES'
          )

          print(
              'BUILD=A55-FASTMOD-V10'
          )

          PY


      # ==============================================================
      # VERIFY PATCH
      # ==============================================================

      - name: Verify V10 source
        shell: bash
        run: |
          set -euo pipefail

          cd src


          echo "===== BUILD ID ====="

          grep -n \
            "A55-FASTMOD-V10" \
            api.cpp


          echo "===== HARDWARE UDIV ====="

          grep -n \
            '"udiv %0, %1, %2"' \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== FASTMOD ====="

          grep -n \
            "v10_smod64_ctx" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== CASE 0x0C / 0x18 ====="

          grep -n \
            "v10_make_div32_ctx" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== ORIGINAL 64-BIT MOD CHECK ====="

          if grep -n \
            "dividend % divisor" \
            verus/armv7/verus_clhash_portable.cpp
          then
              echo "ERROR: original 64-bit modulo remains"
              exit 1
          else
              echo "PASS: no original dividend % divisor remains"
          fi


          echo "===== V8 HARDWARE AES ====="

          grep -n \
            "v8_aesenc_vec" \
            verus/armv7/haraka_portable.h


          echo "===== V8 PMULL ====="

          grep -n \
            "vmull.p64" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== V8 VQRDMULH ====="

          grep -n \
            "vqrdmulhq_s16" \
            verus/armv7/verus_clhash_portable.cpp


          echo "===== V8 PARTIAL HARAKA ====="

          grep -n \
            "v8_haraka512_word7" \
            verus/armv7/verusscan.cpp


      # ==============================================================
      # MASSIVE MODULO CORRECTNESS TEST
      # ==============================================================

      - name: Verify FASTMOD semantics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import random


          MASK32 = (
              1 << 32
          ) - 1


          MASK64 = (
              1 << 64
          ) - 1


          def u32(x):
              return x & MASK32


          def udiv32(n, d):
              return n // d


          def umod32(n, d):
              q = udiv32(
                  n,
                  d
              )

              return u32(
                  n -
                  q * d
              )


          def fast_unsigned_mod64_32(
              numerator,
              d
          ):
              assert 0 < d <= 0xffffffff


              u1 = (
                  numerator >>
                  32
              ) & MASK32


              u0 = (
                  numerator &
                  MASK32
              )


              if d == 1:
                  return 0


              if u1 >= d:
                  u1 = umod32(
                      u1,
                      d
                  )


              if u1 == 0:
                  return umod32(
                      u0,
                      d
                  )


              shift = (
                  32 -
                  d.bit_length()
              )


              vn = u32(
                  d <<
                  shift
              )


              vn1 = (
                  vn >>
                  16
              )


              vn0 = (
                  vn &
                  0xffff
              )


              if shift:
                  un32 = u32(
                      (
                          u1 <<
                          shift
                      ) |
                      (
                          u0 >>
                          (
                              32 -
                              shift
                          )
                      )
                  )


                  un10 = u32(
                      u0 <<
                      shift
                  )
              else:
                  un32 = u1
                  un10 = u0


              un1 = (
                  un10 >>
                  16
              )


              un0 = (
                  un10 &
                  0xffff
              )


              q1 = udiv32(
                  un32,
                  vn1
              )


              rhat = u32(
                  un32 -
                  q1 * vn1
              )


              while (
                  q1 >= 0x10000 or
                  q1 * vn0 >
                      u32(
                          (
                              rhat <<
                              16
                          ) +
                          un1
                      )
              ):
                  q1 = u32(
                      q1 -
                      1
                  )


                  rhat = u32(
                      rhat +
                      vn1
                  )


                  if (
                      rhat >=
                      0x10000
                  ):
                      break


              un21 = u32(
                  (
                      un32 <<
                      16
                  ) +
                  un1 -
                  q1 * vn
              )


              q0 = udiv32(
                  un21,
                  vn1
              )


              rhat = u32(
                  un21 -
                  q0 * vn1
              )


              while (
                  q0 >= 0x10000 or
                  q0 * vn0 >
                      u32(
                          (
                              rhat <<
                              16
                          ) +
                          un0
                      )
              ):
                  q0 = u32(
                      q0 -
                      1
                  )


                  rhat = u32(
                      rhat +
                      vn1
                  )


                  if (
                      rhat >=
                      0x10000
                  ):
                      break


              rem_normalized = u32(
                  (
                      un21 <<
                      16
                  ) +
                  un0 -
                  q0 * vn
              )


              return (
                  rem_normalized >>
                  shift
              )


          def c_remainder(a, b):
              # C/C++ truncates signed division toward zero.
              q = (
                  abs(a) //
                  abs(b)
              )


              if (
                  (a < 0) !=
                  (b < 0)
              ):
                  q = -q


              return (
                  a -
                  q * b
              )


          def fast_signed_mod(
              dividend,
              divisor
          ):
              raw = (
                  dividend &
                  MASK64
              )


              if dividend < 0:
                  magnitude = (
                      (~raw + 1) &
                      MASK64
                  )
              else:
                  magnitude = raw


              if divisor < 0:
                  d = (
                      -divisor
                  )
              else:
                  d = divisor


              r = fast_unsigned_mod64_32(
                  magnitude,
                  d
              )


              return (
                  -r
                  if dividend < 0
                  else r
              )


          # ----------------------------------------------------------
          # EDGE CASES
          # ----------------------------------------------------------

          dividends = [
              -(1 << 63),
              -(1 << 63) + 1,
              -0x7fffffffffffffff,
              -1234567890123456789,
              -0x100000000,
              -0xffffffff,
              -3,
              -2,
              -1,
              0,
              1,
              2,
              3,
              0xffffffff,
              0x100000000,
              1234567890123456789,
              (1 << 63) - 1,
          ]


          divisors = [
              -(1 << 31),
              -(1 << 31) + 1,
              -2147483647,
              -0x10000,
              -65535,
              -3,
              -2,
              -1,
              1,
              2,
              3,
              65535,
              0x10000,
              2147483646,
              2147483647,
          ]


          for dividend in dividends:
              for divisor in divisors:

                  reference = c_remainder(
                      dividend,
                      divisor
                  )


                  fast = fast_signed_mod(
                      dividend,
                      divisor
                  )


                  if fast != reference:
                      raise SystemExit(
                          'EDGE MISMATCH: '
                          f'{dividend} % {divisor} '
                          f'fast={fast} '
                          f'ref={reference}'
                      )


          print(
              'Edge cases: PASS'
          )


          # ----------------------------------------------------------
          # RANDOM CASES
          # ----------------------------------------------------------

          random.seed(
              0xA55F10
          )


          for i in range(
              200000
          ):
              dividend = random.randint(
                  -(1 << 63),
                  (1 << 63) - 1
              )


              divisor = random.randint(
                  -(1 << 31),
                  (1 << 31) - 1
              )


              if divisor == 0:
                  divisor = 1


              reference = c_remainder(
                  dividend,
                  divisor
              )


              fast = fast_signed_mod(
                  dividend,
                  divisor
              )


              if fast != reference:
                  raise SystemExit(
                      'RANDOM MISMATCH '
                      f'at test {i}: '
                      f'{dividend} % {divisor} '
                      f'fast={fast} '
                      f'ref={reference}'
                  )


          print(
              '200000 random FASTMOD tests: PASS'
          )

          print(
              'FASTMOD V10 semantics: PASS'
          )

          PY


      # ==============================================================
      # BUILD
      # ==============================================================

      - name: Make Android build script executable
        shell: bash
        run: |
          set -euo pipefail

          cd src

          chmod +x \
            scripts/build-android-ccminer.sh


      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          cd src

          docker build \
            -t ccminer-firestick-a55-v10 \
            -f build.Dockerfile \
            .


      - name: Build FASTMOD V10 armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            build-output


          mkdir -p \
            build-output


          docker run \
            --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v10 \
            arm


          echo "===== OUTPUT ====="


          find \
            build-output \
            -maxdepth 4 \
            -type f \
            -print


          echo "===== BUILD LOG ====="


          tail -n 300 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log


          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer


      # ==============================================================
      # BINARY INSPECTION
      # ==============================================================

      - name: Inspect FASTMOD V10 binary
        shell: bash
        run: |
          set -euo pipefail

          cd src


          BIN="build-output/ccminer-armeabi-v7a/bin/ccminer"


          echo "===== FILE ====="

          file \
            "$BIN"


          echo "===== BUILD ID ====="

          strings \
            "$BIN" |
            grep \
              "A55-FASTMOD-V10"


          echo "===== UDIV DISASSEMBLY ====="

          if command -v llvm-objdump >/dev/null 2>&1
          then
              llvm-objdump \
                -d \
                "$BIN" |
                grep -m 20 \
                  -E "\budiv\b" ||
                true
          else
              echo \
                "llvm-objdump unavailable on runner"
          fi


          echo "===== AEABI LDIVMOD SYMBOL ====="

          readelf \
            -Ws \
            "$BIN" |
            grep \
              "__aeabi_ldivmod" ||
            echo \
              "GOOD: __aeabi_ldivmod not linked"


          echo "===== V10 SYMBOLS ====="

          readelf \
            -Ws \
            "$BIN" |
            grep \
              "v10_" ||
            true


          echo "===== BINARY SIZE ====="

          ls -lh \
            "$BIN"


      # ==============================================================
      # PACKAGE
      # ==============================================================

      - name: Prepare FASTMOD V10 package
        shell: bash
        run: |
          set -euo pipefail

          cd src


          rm -rf \
            dist


          mkdir -p \
            dist


          BIN="build-output/ccminer-armeabi-v7a/bin"


          cp \
            "$BIN/ccminer" \
            dist/ccminer-a55-fastmod-v10


          if test -f "$BIN/libc++_shared.so"
          then
              cp \
                "$BIN/libc++_shared.so" \
                dist/
          fi


          if test -f "$BIN/libomp.so"
          then
              cp \
                "$BIN/libomp.so" \
                dist/
          fi


          chmod +x \
            dist/ccminer-a55-fastmod-v10


          cat > dist/BUILDINFO.txt <<EOF
          Build:
          A55-FASTMOD-V10

          Strategy:
          Exact V8 champion plus specialized AArch32 fast modulo.

          V8 workflow commit:
          6cf06bdd8f85afef8793180e6dd68b4a1a4fd9f0

          ccminer source commit:
          7f30d6bfb64d0f3ba010191c5a185016ba46f454

          ABI:
          armeabi-v7a / AArch32

          CPU:
          Cortex-A55

          Previous champion:
          A55-HOTPATH-V8

          Previous measured performance:
          approximately 679 kH/s

          V9 changes:
          NOT INCLUDED

          V3 alignment fixes:
          preserved

          Hardware AES:
          preserved

          Hardware PMULL:
          preserved

          VQRDMULH:
          preserved

          NEON VTBL:
          preserved

          Register bridges:
          preserved

          FixKey unroll:
          preserved

          Partial Haraka:
          preserved

          Haraka hot path:
          34 AES operations

          Haraka runtime self-test:
          preserved

          Full candidate replay:
          preserved

          New V10 optimization:
          exact signed 64/32 remainder

          AArch32 32-bit hardware UDIV:
          enabled

          Active modulo case 0x0c:
          optimized

          Active modulo case 0x18:
          optimized

          Case 0x18 divisor normalization:
          hoisted outside inner loop

          Direct low32 modulo XOR:
          enabled

          Floating point reciprocal:
          NOT USED

          Approximate division:
          NOT USED

          FASTMOD workflow semantic tests:
          200000 random cases + edge cases

          API:
          BUILD=A55-FASTMOD-V10
          EOF


          echo "===== PACKAGE ====="

          ls -lh \
            dist/


          echo "===== SHA256 ====="

          sha256sum \
            dist/* |
            tee \
              dist/SHA256SUMS.txt


      # ==============================================================
      # ARTIFACT
      # ==============================================================

      - name: Upload FASTMOD V10 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestick-a55-fastmod-v10-${{ github.run_number }}
          path: src/dist/
          if-no-files-found: error
          retention-days: 30
