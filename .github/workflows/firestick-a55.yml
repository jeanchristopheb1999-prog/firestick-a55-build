      - name: Verify V7 MULHRS semantics
        shell: bash
        run: |
          python3 - <<'PY'
          def wrap16(x):
              x &= 0xffff
              return (
                  x - 0x10000
                  if x & 0x8000
                  else x
              )

          def reference(a, b):
              return wrap16(
                  ((a * b) + 0x4000) >> 15
              )

          def v7_model(a, b):
              x = (
                  ((a * b) + 0x4000)
                  >> 15
              )

              if x > 32767:
                  x = 32767

              if x < -32768:
                  x = -32768

              if (
                  a == -32768 and
                  b == -32768
              ):
                  x = -32768

              return x

          tests = [
              (-32768, -32768),
              (-32768, 32767),
              (32767, 32767),
              (32767, -32768),
              (0, 0),
              (1, 1),
              (-1, -1),
              (12345, -23456),
              (-22222, 11111),
          ]

          for a, b in tests:
              r = reference(a, b)
              n = v7_model(a, b)

              print(
                  a,
                  b,
                  r,
                  n
              )

              if r != n:
                  raise SystemExit(
                      f'MULHRS mismatch: '
                      f'{a}, {b}'
                  )

          print(
              'V7 MULHRS semantics PASSED'
          )
          PY

      - name: Make Android build script executable
        run: |
          chmod +x \
            scripts/build-android-ccminer.sh

      - name: Build Android NDK image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t ccminer-firestick-a55-v8 \
            -f build.Dockerfile \
            .

      - name: Build armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-output
          mkdir -p build-output

          docker run --rm \
            -v "$PWD/build-output:/build/output" \
            ccminer-firestick-a55-v8 \
            arm

          echo "===== OUTPUT ====="

          find \
            build-output \
            -maxdepth 4 \
            -type f \
            -print

          echo "===== BUILD LOG ====="

          tail -n 250 \
            build-output/ccminer-armeabi-v7a/log/armeabi-v7a.log

          test -f \
            build-output/ccminer-armeabi-v7a/bin/ccminer

      - name: Inspect V8 binary
        shell: bash
        run: |
          set -euo pipefail

          BIN="build-output/ccminer-armeabi-v7a/bin/ccminer"

          echo "===== FILE ====="
          file "$BIN"

          echo "===== BUILD ID STRING ====="
          strings "$BIN" |
            grep "A55-HOTPATH-V8"

          echo "===== AARCH32 64-BIT DIVISION DIAGNOSTIC ====="
          readelf -Ws "$BIN" |
            grep "__aeabi_ldivmod" || true

          echo "===== SIZE ====="
          ls -lh "$BIN"

      - name: Prepare V8 package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          BIN="build-output/ccminer-armeabi-v7a/bin"

          cp \
            "$BIN/ccminer" \
            dist/ccminer-a55-hotpath-v8

          test -f "$BIN/libc++_shared.so" && \
            cp "$BIN/libc++_shared.so" dist/ || true

          test -f "$BIN/libomp.so" && \
            cp "$BIN/libomp.so" dist/ || true

          chmod +x \
            dist/ccminer-a55-hotpath-v8

          cat > dist/BUILDINFO.txt <<EOF
          Build:
          A55-HOTPATH-V8

          Source:
          shmutalov/ccminer
          7f30d6bfb64d0f3ba010191c5a185016ba46f454

          ABI:
          armeabi-v7a / AArch32

          CPU:
          Cortex-A55 tuned

          ARMv8 crypto:
          enabled

          V3 SIGBUS fixes:
          preserved

          Hardware AES:
          enabled

          Zero-copy hardware PMULL:
          enabled

          VQRDMULH:
          enabled

          MULHRS INT16_MIN edge correction:
          enabled

          V8 CLHash register AES:
          enabled

          V8 partial keyed Haraka:
          word7-only hot path

          V8 partial Haraka AES count:
          34 vs 40 full

          V8 full-hash candidate replay:
          enabled

          V8 first-hash runtime self-test:
          enabled per mining thread

          V8 PSHUFB:
          AArch32 NEON VTBL2

          V8 selector extraction:
          direct NEON lane access

          V8 FixKey:
          fully unrolled

          V8 hashes_done:
          hoisted out of per-hash loop

          V8 throughput TLS:
          removed from hot loop

          Frame pointer:
          omitted

          API:
          BUILD=A55-HOTPATH-V8

          Stable fallback:
          A55-VQRDMULH-V7

          V7 measured sustained baseline:
          approximately 428 kH/s at 750 seconds
          EOF

          echo "===== SHA256 ====="

          sha256sum \
            dist/* |
            tee \
              dist/SHA256SUMS.txt

      - name: Upload V8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestick-a55-hotpath-v8-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
